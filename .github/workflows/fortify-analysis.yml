name: Fortify on Demand Scan
run-name: "Fortify on Demand Scan (${{ github.event_name }})"

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**/*.md'
      - 'doc-resources/**'
      - '.github/copilot-instructions.md'
      - '.github/instructions/**'
      - '.github/prompts/**'
      - '.github/skills/**'
      - '.github/agents/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'doc-resources/**'
      - '.github/copilot-instructions.md'
      - '.github/instructions/**'
      - '.github/prompts/**'
      - '.github/skills/**'
      - '.github/agents/**'
  schedule:
    - cron: '16 0 * * 5'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  check-duplicate-run:
    uses: fortify/shared-github/.github/workflows/reusable-check-duplicate-run.yml@15d0b01f3bedb5c1523cb806e745f041e9bce5a3

  FoD-Scan:
    needs: check-duplicate-run
    if: needs.check-duplicate-run.outputs.should_skip != 'true'
    uses: fortify/shared-github/.github/workflows/reusable-fortify-analysis.yml@15d0b01f3bedb5c1523cb806e745f041e9bce5a3
    with:
      java-version: '17'
    secrets: inherit
