name: update-repo-docs

on:
  workflow_dispatch:
  schedule:
    - cron: '5 4 * * *'
  push:
    branches:
      - dev/v3.x
    paths:
      - 'doc-resources/**'
      
jobs:
  update-repo-docs:
    permissions:
      contents: write
      pull-requests: write
    uses: fortify/shared-github/.github/workflows/reusable-update-repo-docs.yml@15d0b01f3bedb5c1523cb806e745f041e9bce5a3
