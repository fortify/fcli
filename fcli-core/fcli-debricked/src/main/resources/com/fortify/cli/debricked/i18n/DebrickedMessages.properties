# Used to 'productize' some descriptions defined in FortifyCLIMessages.properties
product=Debricked
module=debricked

# Make sure none of the commands inherit usage header or description of the top-level fcli command
# Note that we define these as usage.* whereas our parent bundle defines fcli.usage.* (with fcli prefix).
# For some reason, overriding fcli.usage.* doesn't work.
usage.header = 
usage.description = 

# fcli debricked
fcli.debricked.usage.header = Interact with Debricked.
fcli.debricked.usage.description.0 = The commands in this module allow for interacting with \
  Debricked for open source vulnerability scanning and management. This includes functionality \
  like managing scan results, repositories, and other Debricked entities.
fcli.debricked.usage.description.1 = %nBefore being able to interact with Debricked, a session will need \
  to be created by passing Debricked URL and credentials to the 'session login' command in this \
  module. As a best practice, 'session logout' should be run to terminate the session when \
  there are no more activities to be performed.

# Debricked Messages
debricked.session.name=Session name for storing Debricked login credentials.
debricked.session.name.arggroup=Session Options:

# Login options
debricked-user=Debricked username
debricked-password=Debricked password  
debricked-access-token=Debricked access token
debricked-url=Debricked base URL

# fcli debricked session
fcli.debricked.session.usage.header=Manage Debricked sessions (start here).
fcli.debricked.session.usage.description = The session commands allow for managing one or more \
  Debricked sessions used to interact with a particular Debricked instance with the provided \
  credentials. Potentially you can have multiple open Debricked sessions, for example connecting \
  to different Debricked environments like DEV and PROD, or connecting to the same Debricked \
  instance but with different credentials.

# Session commands
fcli.debricked.session.login.usage.header=Create a session for interacting with Debricked.
fcli.debricked.session.logout.usage.header=Terminate a Debricked session.
fcli.debricked.session.list.usage.header=List active Debricked sessions.

# Output table configurations for session commands
fcli.debricked.session.login.output.table.args=sessionName,type,url,expiryDate,expired
fcli.debricked.session.logout.output.table.args=sessionName,type,url,expiryDate,expired
fcli.debricked.session.list.output.table.args=sessionName,type,url,expiryDate,expired