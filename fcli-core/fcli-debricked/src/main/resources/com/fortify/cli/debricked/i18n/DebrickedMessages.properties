# Used to 'productize' some descriptions defined in FortifyCLIMessages.properties
product=Debricked
module=debricked

# Make sure none of the commands inherit usage header or description of the top-level fcli command
# Note that we define these as usage.* whereas our parent bundle defines fcli.usage.* (with fcli prefix).
# For some reason, overriding fcli.usage.* doesn't work.
usage.header = 
usage.description = 

# fcli debricked
fcli.debricked.usage.header = Interact with Debricked.
fcli.debricked.usage.description.0 = The commands in this module allow for interacting with \
  Debricked for open source vulnerability scanning and management. This includes functionality \
  like managing scan results, repositories, and other Debricked entities.
fcli.debricked.usage.description.1 = %nBefore being able to interact with Debricked, a session will need \
  to be created by passing Debricked URL and credentials to the 'session login' command in this \
  module. As a best practice, 'session logout' should be run to terminate the session when \
  there are no more activities to be performed.

# fcli debricked session
fcli.debricked.session.usage.header=Manage Debricked sessions (start here).
fcli.debricked.session.usage.description = The session commands allow for managing one or more \
  Debricked sessions used to interact with a particular Debricked instance with the provided \
  credentials. Potentially you can have multiple open Debricked sessions, for example connecting \
  to different Debricked environments like DEV and PROD, or connecting to the same Debricked \
  instance but with different credentials.

# fcli debricked session
fcli.debricked.session.login.usage.header=Create a session for interacting with Debricked.
fcli.debricked.session.login.url=Debricked base URL
fcli.debricked.session.login.user=Debricked username
fcli.debricked.session.login.password=Debricked password  
fcli.debricked.session.login.access-token=Debricked access token
fcli.debricked.session.login.debricked-session=Name for this Debricked session. Default value: ${DEFAULT-VALUE}.
fcli.debricked.session.logout.usage.header=Terminate a Debricked session.
fcli.debricked.session.logout.debricked-session = Name of the FoD session to be terminated. Default value: ${DEFAULT-VALUE}.
fcli.debricked.session.list.usage.header=List active Debricked sessions.

# fcli debricked rest
fcli.debricked.rest.usage.header = Interact with Debricked REST API endpoints.
fcli.debricked.rest.usage.description = These commands allow for direct interaction with Debricked REST API endpoints, \
  somewhat similar to using 'curl' but benefiting from standard fcli functionality like session management \
  (no need to manually specify Authorization header), rich output formatting options, and query functionality.
fcli.debricked.rest.call.usage.header = Call an individual Debricked REST API endpoint.
fcli.debricked.rest.call.no-paging = By default, this command will load all pages of data from Debricked (from the \
  given offset if specified as a request parameter). Use this option to return only a single page.
fcli.debricked.rest.call.no-transform = By default, this command performs generic transformations on Debricked REST \
  responses, like only outputting the actual response data (contents of the 'items' property). Use this \
  option to output the original response contents without transformations.
fcli.debricked.rest.call.transform = This option allows for performing custom transformations on the response \
  data based on a Spring Expression Language (SpEL) expression. For example, this allows for retrieving \
  data from sub-properties, or using project selection/projection. Note that the expression operates on \
  the raw response, as if --no-transform was specified before evaluating the expression.

# Output table configurations for session commands
fcli.debricked.session.login.output.table.args=name,type,url,expires,expired
fcli.debricked.session.logout.output.table.args=name,type,url,expires,expired
fcli.debricked.session.list.output.table.args=name,type,url,expires,expired

