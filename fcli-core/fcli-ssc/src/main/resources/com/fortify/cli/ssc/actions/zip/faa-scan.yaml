# yaml-language-server: $schema=https://fortify.github.io/fcli/schemas/action/fcli-action-schema-dev-2.x.json

author: Fortify
usage:
  header: (PREVIEW) Run Fortify Agentic Analyzer Scan
  description: |
    This action can be used to run a Fortify Agentic Analyzer (FAA) scan of the project
    and optionally upload the results to SSC as a SARIF report.
    
    Optionally, you can provide the FPR file from a prior SAST scan. When provided,
    FAA uses this context to avoid reporting duplicate issues that were already found
    by the SAST scan, resulting in higher quality analysis results.

config:
  output: immediate
  rest.target.default: ssc
  run.fcli.status.log.default: true    # By default, we log all exit statuses
  run.fcli.status.check.default: true
  mcp: exclude # FAA is a specialized tool requiring specific setup

# NOTE: When updating any options, ci action may also need to be updated
cli.options:
  sourceDir:
    names: --source-dir, -d
    description: >-
      Source directory on which to run Fortify Agentic Analyzer scan.
      Defaults to current working directory if not specified.
    required: true 
  fprFile:
    names: --fpr, -f
    description: >-
      Optional path to the FPR file from a prior SAST scan. When provided, FAA uses this
      context to avoid reporting duplicate issues already identified by SAST, resulting in
      enhanced analysis quality. If not provided, FAA will perform a standalone analysis.
    required: false 
  appVersion:
    names: --app-version, --av
    description: >-
      Optional SSC application version to which the FAA scan results (SARIF) must be uploaded. If not specified, FAA scan will run and write results to the output file, but SARIF will not be uploaded to SSC. Application version must already exist in SSC if specified.
    required: false 
  output:
    names: --output, -o
    description: >-
      Output SARIF file path where FAA scan results will be written.
      Defaults to fortifyaa.sarif in the current working directory.
    required: false 
    default: fortifyaa.sarif
  faaPath:
    names: --faa-path, -p
    description: |
      Path to a pre-installed Fortify Agentic Analyzer (FAA) installation. 
      FAA must be pre-installed on the system before running this action; 
      this action only registers the existing installation with fcli.
      Defaults to the FORTIFY_AGENTIC_ANALYZER_HOME environment variable.
      Required: User must have FAA already installed and FORTIFY_AGENTIC_ANALYZER_HOME set.
    required: true
  extraScanOpts:
    names: --extra-scan-opts
    description: >-
      Extra options to be passed to the 'fortifyaa -scan' command.
    required: false 
  skipWait:
    names: --skip-wait
    description: >-
      By default, the action will wait for the SARIF artifact upload to complete. Use this option to skip
      waiting for the upload to complete.
    required: false 
    type: boolean
    default: true

steps:
  - var.set:
      # Used for passing extra options from ci action without bothering about escaping
      extraScanOpts: ${#join(" ", {cli.extraScanOpts, global.faaScan?.extraOpts})}
      global.faaScanUpload.fcliVarName: faa_scan_${#action.runID().replace('-','_')}
      global.faaScanUpload.waitForCmd: 'fcli ssc artifact wait-for ::${global.faaScanUpload.fcliVarName}::'
  
  - run.fcli:
      SETUP_TOOLS: fcli tool env init "--tools=fortifyaa:${cli.faaPath}"
      RUN_FAA_SCAN:
        cmd: >
          fcli tool fortifyaa run --
          -clean
          -scan "${cli.sourceDir}"
          ${#isNotBlank(cli.fprFile) ? '--fpr "' + cli.fprFile + '"' : ''}
          -o "${cli.output}"
          ${extraScanOpts}
        stdout: collect
        stderr: collect
        on.success:
          - out.write:
              stdout: ${RUN_FAA_SCAN.stdout}
              stderr: ${RUN_FAA_SCAN.stderr}
        on.fail:
          - out.write:
              stdout: ${RUN_FAA_SCAN.stdout}
              stderr: ${RUN_FAA_SCAN.stderr}
          - throw: FAA Scan failed with errors.
      UPLOAD_SARIF:
        cmd: >
          fcli ssc artifact upload 
          --av "${cli.appVersion}" 
          --engine-type Fortify_AA 
          -f "${cli.output}"
          --store "${global.faaScanUpload.fcliVarName}"
        status.check: false
  
  - if: ${!cli.skipWait}
    run.fcli:
      WAIT: ${global.faaScanUpload.waitForCmd}
