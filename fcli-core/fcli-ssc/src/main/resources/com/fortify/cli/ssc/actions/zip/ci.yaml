# yaml-language-server: $schema=https://fortify.github.io/fcli/schemas/action/fcli-action-schema-dev-2.x.json

author: Fortify
usage:
  header: Run SSC CI pipeline
  description: |
    This action can be used to run a full, standardized CI pipeline that performs the
    following activities:
        
    * Create & configure SSC application version if needed
    * Package source code
    * Submit SAST scan request
    * Submit DAST scan request, using pre-existing SC-DAST scan settings
    * Wait for SAST/DAST scan completion
    * Perform post-scan activities, like checking policy outcome, exporting results, ...
    
    Configuration for this fcli action is done through environment variables; the
    sections below list the environment variables supported by this action.
    
    ${#include('/ci-action-bootstrap'+(isAsciiDoc?'.adoc':'.txt'))}
    
    ${#include('/ci-action-core-ssc'+(isAsciiDoc?'.adoc':'.txt'))}

config:
  output: immediate
  rest.target.default: ssc
  run.fcli.status.log.default: true    # By default, we log all exit statuses
  run.fcli.status.check.default: false # By default, we want to continue on fcli failures
  run.fcli.group.default: ciGroup
  mcp: exclude
  mask.env-vars:
    DEBRICKED_ACCESS_TOKEN:
      sensitivity: high

  
steps:
  # Configure module; allows for copying/re-using similar #actionCmd invocations in FoD ci action
  - var.set:
      module: ssc
      
  # Run ci-vars action to obtain CI data
  - run.fcli:
      detect-env: 
        group: detect-env
        cmd: fcli action run detect-env
        status.check: true   # Fail immediately if this step fails, as it doesn't make sense to continue
        on.success:
          - var.set:
              global.ci.av: ${#env('SSC_APPVERSION')?:global.ci.defaultFortifyRepo}
          - if: ${global.ci.av==null}
            throw: SSC application version must be specified through SSC_APPVERSION environment variable
            
  # Validate that workspace and source directories exist before proceeding
  - if: ${!#fs.isDirectory(global.ci.workspaceDir)}
    throw: "Workspace directory does not exist or is not accessible: ${global.workspace.dir}"
  - if: ${!#fs.isDirectory(global.ci.sourceDir)}
    throw: "Source directory does not exist or is not accessible: ${global.cli.sourceDir}"
            
  - var.set:
      # Configure session name
      sessionName: ci-${#action.runID()}
      # Configure scan types to run
      dast.skipReason: > # Disabled by default; requires DO_DAST_SCAN=true and DAST_SETTINGS to be enabled
        ${
            #fcliCmdSkipFromEnvReason('DAST_SCAN', true)
            ?:#skipBlankEnvReason('DAST_SETTINGS')
        }
      sast.skipReason: > # Enabled by default, unless explicitly disabled
        ${
            #fcliCmdSkipFromEnvReason('SAST_SCAN', false)
        }
      debricked.skipReason: > # Enabled if DEBRICKED_ACCESS_TOKEN specified, unless explicitly disabled
        ${
            #fcliCmdSkipFromEnvReason('DEBRICKED_SCAN', false)
            ?:#skipBlankEnvReason('DEBRICKED_ACCESS_TOKEN')
        }
      global.debrickedScan.extraOpts: >
        ${
            #extraOpts('DEBRICKED_SCAN')
        }
      # Aviator configuration: separate SAST and DAST audits
      # DO_AVIATOR_SAST_AUDIT: enables SAST audit only
      # DO_AVIATOR_DAST_AUDIT: enables DAST audit only
      aviatorSast.skipReason: >
        ${
            #fcliCmdSkipFromEnvReason('AVIATOR_SAST_AUDIT', false)
            ?:#skipBlankEnvReason('AVIATOR_TOKEN')
            ?:#skipBlankEnvReason('AVIATOR_URL')
        }
      aviatorDast.skipReason: >
        ${
            #fcliCmdSkipFromEnvReason('AVIATOR_DAST_AUDIT', false)
            ?:#skipBlankEnvReason('AVIATOR_TOKEN')
            ?:#skipBlankEnvReason('AVIATOR_URL')
        }
      aviator.loginOpts: --url=AVIATOR_URL
      aviator.app: ${#env('AVIATOR_APP')?:'::av::application.name'}
      # DAST publish configuration
      dast.submitForAudit: false # Will be extracted from DAST scan settings
      wait.skipReason: >- # Enabled by default, unless explicitly disabled through DO_WAIT or DO_SAST_WAIT (deprecated)
        ${
            #fcliCmdSkipFromEnvReason('WAIT', false)
            ?:#fcliCmdSkipFromEnvReason('SAST_WAIT', false) 
        }
      # Sanitize ':'/'/' from app/repo names for SC-DAST; override via DAST_SCAN_NAME
      dast.scanName: >-
        ${
            #env('DAST_SCAN_NAME')?:(global.ci.av + '-' + #action.runID()).replaceAll('[:/]', '-')
        }
      # Post-scan tasks will be skipped if wait is skipped or if no scans were completed
      # successfully. Post-scan skip reason will be reset to null once the wait task for
      # any scan completed successfully. 
      postScan.skipReason: ${#ifBlank(wait.skipReason,'No scans have been run because they failed or were skipped')}

  # Set up Aviator session if necessary
  - with:
      sessions:
        - if: "${#isBlank(aviatorSast.skipReason) || #isBlank(aviatorDast.skipReason)}"
          login: ${#fcliCmd('AVIATOR_LOGIN', 'fcli aviator session login')} "--aviator-session=${sessionName}" "--token=env:AVIATOR_TOKEN" ${#optsFromEnv(aviator.loginOpts)}
          logout: ${#fcliCmd('AVIATOR_LOGOUT', 'fcli aviator session logout')} "--aviator-session=${sessionName}"
      do:
        # Run the fcli commands that make up this CI pipeline. Note that by default, pipeline will
        # continue to run on failures due to config:run.fcli.status.check.default being set to false.
        #
        # This extensively uses the following SpEL functions and action variables::
        # - #actionCmd(envPrefix, module, action): 
        #   Run <envPrefix>_ACTION if specified, otherwise the given <action>.
        #   Append any options as specified in <envPrefix>_EXTRA_OPTS.
        # - #fcliCmd(envPrefix, cmd):
        #   Run the given <cmd>, appending any options specified in <envPrefix>_EXTRA_OPTS
        # - #actionCmdSkipFromEnvReason(envPrefix, skipByDefault):
        #   If skipByDefault==false, action will only be skipped if DO_<envPrefix>==false
        #   Otherwise, action will be skipped unlesss DO_<envPrefix>==true, or <envPrefix>_ACTION or <envPrefix>_EXTRA_OPTS are specified
        # - #fcliCmdSkipFromEnvReason(envPrefix, skipByDefault):
        #   If skipByDefault==false, command will only be skipped if DO_<envPrefix>==false
        #   Otherwise, action will be skipped unlesss DO_<envPrefix>==true, or <envPrefix>_EXTRA_OPTS is specified
        # - <earlierStep>.dependencySkipReason:
        #   Automatically set to an appropriate skip reason by fcli, if <earlierStep> was skipped or failed.
        - run.fcli:
            SETUP:
              cmd: ${#actionCmd('SETUP', 'ssc', 'setup-appversion')} "--av=${global.ci.av}" "--store=av"
              status.check: true       # Fail immediately if this step fails, as it doesn't make sense to continue
              skip.if-reason:
                - ${#actionCmdSkipFromEnvReason('SETUP', false)} # Skip if DO_SETUP==false
                  
            PACKAGE_ACTION:
              cmd: ${#actionCmd('PACKAGE_ACTION', 'ssc', 'package')} "--source-dir=${global.ci.sourceDir}" "--av=${global.ci.av}"
              skip.if-reason:
                - ${sast.skipReason} # Skip if SAST scan is skipped
                  
            SAST_SCAN: 
              cmd: ${#fcliCmd('SAST_SCAN', 'sc-sast scan start')} --publish-to "${global.ci.av}" --store sc_sast_scan -f "${global.package.output}"
              skip.if-reason:
                - ${sast.skipReason}                     # Skip if SAST scan is skipped
                - ${PACKAGE_ACTION.dependencySkipReason} # Skip if PACKAGE_ACTION was skipped or failed
            
            # DAST scan using pre-existing SC-DAST settings (DAST_SETTINGS); not created here
            DAST_SCAN:
              cmd: ${#fcliCmd('DAST_SCAN', 'sc-dast scan start')} --settings "${#env('DAST_SETTINGS')}" --name "${dast.scanName}" --store sc_dast_scan
              skip.if-reason:
                - ${dast.skipReason} # Skip if DAST scan is skipped

            DEBRICKED_SCAN_ACTION:
              # --extra-scan-opts is passed through global.debrickedScan.extraOpts variable defined above
              cmd: >
                ${#actionCmd('DEBRICKED_SCAN_ACTION', 'ssc', 'debricked-scan')}
                "--source-dir=${global.ci.sourceDir}"
                "--repository=${global.ci.qualifiedRepoName}"
                "--branch=${global.ci.sourceBranch}"
                "--av=${global.ci.av}"
                "--debricked-token=${#env('DEBRICKED_ACCESS_TOKEN')}"
                "--cli-version=${#env('DEBRICKED_CLI_VERSION')?:'auto'}"
                "--skip-wait=true"
              skip.if-reason:
                - ${debricked.skipReason}                # Skip if Debricked scan is skipped
              on.success:
                - if: ${global.debrickedScan?.policyFailure==true} # TODO Test this
                  var.set: 
                    DEBRICKED_SCAN_ACTION.status: 'WARNING'
                    DEBRICKED_SCAN_ACTION.statusReason: 'Debricked scan completed with policy violations'
            
            DEBRICKED_WAIT:
              cmd: "${#fcliCmd('DEBRICKED_WAIT', global.debrickedPublish.waitForCmd)}"
              skip.if-reason:
                - ${wait.skipReason}                                 # Skip if wait.skipReason!=null
                - ${DEBRICKED_SCAN_ACTION.dependencySkipReason}      # Skip if DEBRICKED_SCAN_ACTION was skipped or failed
              on.success:
                - var.set: { postScan.skipReason: } # Reset postScan.skipReason to allow post-scan tasks to run       
            
            # TODO Improve this to:
            # - Wait for scan completion (but not publish completion)
            # - Download logs/fpr if debugging is enabled
            # - Wait for scan publish completion before running further post-scan steps
            SAST_WAIT:
              cmd: "${#fcliCmd('SAST_WAIT', 'sc-sast scan wait-for')} ::sc_sast_scan::"
              skip.if-reason:
                - ${wait.skipReason}                                 # Skip if wait.skipReason!=null
                - ${SAST_SCAN.dependencySkipReason}                  # Skip if SAST_SCAN was skipped or failed
              on.success:
                - var.set: { postScan.skipReason: } # Reset postScan.skipReason to allow post-scan tasks to run
                
            DOWNLOAD_SAST_LOG:
              cmd: "${#fcliCmd('DOWNLOAD_SAST_LOG', 'sc-sast scan download -t log')} ::sc_sast_scan::"
              skip.if-reason:
                - ${SAST_WAIT.dependencySkipReason}                      # Skip if SAST_WAIT was skipped or failed
                - ${#isDebugEnabled()?'':'--debug flag not specified'}   # Skip if debugging is disabled
                
            DOWNLOAD_SAST_SENSOR_LOG:
              cmd: "${#fcliCmd('DOWNLOAD_SAST_SENSOR_LOG', 'sc-sast scan download -t sensor-log')} ::sc_sast_scan::"
              skip.if-reason:
                - ${SAST_WAIT.dependencySkipReason}                      # Skip if SAST_WAIT was skipped or failed
                - ${#isDebugEnabled()?'':'--debug flag not specified'}   # Skip if debugging is disabled
            DOWNLOAD_SAST_FPR:
              cmd: "${#fcliCmd('DOWNLOAD_SAST_FPR', 'sc-sast scan download -t fpr')} ::sc_sast_scan::"
              skip.if-reason:
                - ${SAST_WAIT.dependencySkipReason}                      # Skip if SAST_WAIT was skipped or failed
                - ${#isDebugEnabled()?'':'--debug flag not specified'}   # Skip if debugging is disabled
              
            AVIATOR_SAST_AUDIT:
              cmd: ${#fcliCmd('AVIATOR_SAST_AUDIT', 'aviator ssc audit-sast')} --aviator-session ${sessionName} --av "${global.ci.av}" --app "${aviator.app}" --store aviator_sast_audit
              skip.if-reason:
                - ${SAST_WAIT.dependencySkipReason}                    # Skip if SAST_WAIT was skipped or failed
                - ${postScan.skipReason}                               # Skip if no scans were run
                - ${aviatorSast.skipReason}                           # Skip if SAST Aviator audit is to be skipped
              on.success:
                - var.set:
                    aviatorSast.artifactId: "${#var('aviator_sast_audit').hasNonNull('artifactId') ? #var('aviator_sast_audit').get('artifactId').asText() : ''}"

            # Placed after SAST-only post-scan steps so those can run while the DAST scan is still going.
            # DAST can be slow; disabled by default, enable with DO_DAST_WAIT=true. Use DAST_WAIT_EXTRA_OPTS to pass --timeout
            # Always enabled if DAST Aviator audit is enabled, as the audit requires the published scan results.
            DAST_WAIT:
              cmd: "${#fcliCmd('DAST_WAIT', 'sc-dast scan wait-for')} ::sc_dast_scan::"
              skip.if-reason:
                - ${wait.skipReason}                                 # Skip if wait.skipReason!=null
                - "${#isBlank(aviatorDast.skipReason) ? '' : #fcliCmdSkipFromEnvReason('DAST_WAIT', true)}"  # Skip unless DO_DAST_WAIT==true or DAST Aviator audit enabled
                - ${DAST_SCAN.dependencySkipReason}                  # Skip if DAST_SCAN was skipped or failed
              on.success:
                - var.set:
                    postScan.skipReason: # Reset postScan.skipReason to allow post-scan tasks to run
                    dast.submitForAudit: "${#var('sc_dast_scan').hasNonNull('submitForAudit') ? #var('sc_dast_scan').get('submitForAudit').asBoolean() : false}"
                # Scan results go to the app version configured in the DAST scan settings, not necessarily the CI app version
                - if: "${#var('sc_dast_scan').hasNonNull('applicationVersionId') && #var('sc_dast_scan').get('applicationVersionId').asText() != #var('av').get('id').asText()}"
                  log.warn: "DAST scan settings target application version '${#var('sc_dast_scan').get('applicationName').asText()}:${#var('sc_dast_scan').get('applicationVersionName').asText()}', which differs from the CI application version '${global.ci.av}'. DAST results will be published to the application version in the scan settings."

            DAST_PUBLISH:
              cmd: "${#fcliCmd('DAST_PUBLISH', 'sc-dast scan publish')} ::sc_dast_scan::"
              skip.if-reason:
                - ${DAST_WAIT.dependencySkipReason}                  # Skip if DAST_WAIT was skipped or failed
                - "${dast.submitForAudit ? 'Results automatically published by DAST scan settings' : ''}"  # Skip if submitForAudit is true

            # Wait until results have been published to SSC, either through DAST_PUBLISH or automatically
            DAST_PUBLISH_WAIT:
              cmd: "${#fcliCmd('DAST_PUBLISH_WAIT', 'sc-dast scan wait-for')} ::sc_dast_scan:: --published"
              skip.if-reason:
                - ${DAST_WAIT.dependencySkipReason}                  # Skip if DAST_WAIT was skipped or failed
                - "${dast.submitForAudit ? '' : DAST_PUBLISH.dependencySkipReason}"  # Skip if explicit publish failed; DAST_PUBLISH is expected to be skipped on auto-publish

            # Neither scan JSON nor publish output exposes the SSC artifact id, so look up the DAST artifacts
            # in the app version targeted by the scan.
            DAST_ARTIFACTS:
              cmd: >
                ${#fcliCmd('DAST_ARTIFACTS', 'ssc artifact list')}
                "--av=${#var('sc_dast_scan').get('applicationVersionId').asText()}"
                "--query=scanTypes.contains('WEBINSPECT')"
                --store dast_artifacts
              skip.if-reason:
                - ${DAST_PUBLISH_WAIT.dependencySkipReason}          # Skip if DAST_PUBLISH_WAIT was skipped or failed
              on.success:
                - var.set:
                    dast.artifactIds: "${#join(' ', #var('dast_artifacts').![get('id').asText()])}"

            DAST_ARTIFACTS_WAIT:
              cmd: "${#fcliCmd('DAST_ARTIFACTS_WAIT', 'ssc artifact wait-for')} ${dast.artifactIds}"
              skip.if-reason:
                - ${DAST_ARTIFACTS.dependencySkipReason}             # Skip if DAST_ARTIFACTS was skipped or failed
                - "${#isBlank(dast.artifactIds) ? 'No DAST artifacts found in SSC' : ''}"

            AVIATOR_DAST_AUDIT:
              cmd: ${#fcliCmd('AVIATOR_DAST_AUDIT', 'aviator ssc audit-dast')} --aviator-session ${sessionName} --av "${global.ci.av}" --app "${aviator.app}" --store aviator_dast_audit
              skip.if-reason:
                - ${postScan.skipReason}                               # Skip if no scans were run
                - ${DAST_WAIT.dependencySkipReason}                    # Skip if DAST_WAIT was skipped or failed
                - ${DAST_ARTIFACTS_WAIT.dependencySkipReason}          # Skip if DAST results are not available in SSC
                - ${aviatorDast.skipReason}                           # Skip if DAST Aviator audit is to be skipped

            # Waits for the SAST audit artifact only after the DAST audit, so SSC can process it in the meantime
            AVIATOR_SAST_WAIT:
              cmd: "${#fcliCmd('AVIATOR_SAST_WAIT', 'ssc artifact wait-for')} ${aviatorSast.artifactId}"
              skip.if-reason:
                - ${AVIATOR_SAST_AUDIT.dependencySkipReason}           # Skip if AVIATOR_SAST_AUDIT was skipped or failed
                - ${postScan.skipReason}                               # Skip if no scans were run
                - ${aviatorSast.skipReason}                           # Skip if SAST Aviator audit is to be skipped
                - "${#isBlank(aviatorSast.artifactId) ? 'No artifact produced by SAST Aviator audit, nothing to wait for' : ''}"

            AVIATOR_REMEDIATIONS:
              cmd: >
                ${#actionCmd('AVIATOR_REMEDIATIONS', 'ssc', global.ci.ssc_aviatorRemediationsAction)}
                "--source-dir=${global.ci.sourceDir}"
                "--artifact-id=${aviatorSast.artifactId}"
                "--progress=none"
              skip.if-reason:
                - ${#actionCmdSkipFromEnvReason('AVIATOR_REMEDIATIONS', true)} # Skip unless DO_AVIATOR_REMEDIATIONS==true or AVIATOR_REMEDIATIONS_ACTION/EXTRA_OPTS defined
                - ${#actionCmdSkipNoActionReason('AVIATOR_REMEDIATIONS', 'ssc', global.ci.ssc_aviatorRemediationsAction)}
                - ${postScan.skipReason}                               # Skip if no scans were run
                - ${AVIATOR_SAST_WAIT.dependencySkipReason}             # Skip if SAST audit was skipped or failed
                - "${#isBlank(aviatorSast.artifactId) ? 'No SAST artifact produced by Aviator audit' : ''}" # Skip if no SAST artifact available

            CHECK_POLICY:
              cmd: ${#actionCmd('CHECK_POLICY', 'ssc', 'check-policy')} "--av=${global.ci.av}" "--progress=none"
              stdout: collect
              skip.if-reason:
                - ${postScan.skipReason}                               # Skip if no scans were run
                - ${#actionCmdSkipFromEnvReason('CHECK_POLICY', true)} # Skip unless DO_CHECK_POLICY==true or CHECK_POLICY_ACTION/EXTRA_OPTS defined
                
            APPVERSION_SUMMARY:
              cmd: ${#actionCmd('APPVERSION_SUMMARY', 'ssc', 'appversion-summary')} "--av=${global.ci.av}" "--progress=none"
              stdout: collect
              skip.if-reason:
                - ${postScan.skipReason}                                      # Skip if no scans were run
                - ${#actionCmdSkipFromEnvReason('APPVERSION_SUMMARY', false)} # Skip if DO_APPVERSION_SUMMARY==false
                
            PR_COMMENT:
              cmd: ${#actionCmd('PR_COMMENT', 'ssc', global.ci.ssc_prCommentAction)} "--av=${global.ci.av}"
              skip.if-reason: 
                - ${postScan.skipReason}                             # Skip if no scans were run
                - ${#actionCmdSkipFromEnvReason('PR_COMMENT', true)} # Skip unless DO_PR_COMMENT==true or PR_COMMENT_ACTION/EXTRA_OPTS defined
                - ${#actionCmdSkipNoActionReason('PR_COMMENT', 'ssc', global.ci.ssc_prCommentAction)}
                - ${global.ci.prNotActiveSkipReason}                 # Skip if not a pull/merge request
                
            SAST_EXPORT:
              cmd: "${#actionCmd('SAST_EXPORT', 'ssc', global.ci.ssc_sastExportAction)} \"--av=${global.ci.av}\" \"--workspace-dir=${global.ci.workspaceDir}\" \"--source-dir=${global.ci.sourceDir}\""
              skip.if-reason:
                - ${SAST_WAIT.dependencySkipReason}                    # Skip if SAST_WAIT was skipped or failed
                - ${#actionCmdSkipFromEnvReason('SAST_EXPORT', false)} # Skip if DO_SAST_EXPORT==false
                - ${#actionCmdSkipNoActionReason('SAST_EXPORT', 'ssc', global.ci.ssc_sastExportAction)}

            DEBRICKED_EXPORT:
              cmd: "${#actionCmd('DEBRICKED_EXPORT', 'ssc', global.ci.ssc_scaExportAction)} \"--av=${global.ci.av}\""
              skip.if-reason:
                - ${DEBRICKED_WAIT.dependencySkipReason}                    # Skip if DEBRICKED_WAIT was skipped or failed
                - ${#actionCmdSkipFromEnvReason('DEBRICKED_EXPORT', false)} # Skip if DO_DEBRICKED_EXPORT==false
                - ${#actionCmdSkipNoActionReason('DEBRICKED_EXPORT', 'ssc', global.ci.ssc_scaExportAction)}
          
  - with:
      writers:
        ciSummaryWriter:
          type: table
          style: md-border
          to: var:ciSummary
      do:
        - var.set:
            exitCode: 0
        - records.for-each:
            from: ${#properties(ciGroup)}
            record.var-name: ciEntry
            do:
              - writer.append:
                  ciSummaryWriter: {fmt: ciEntry}
              - var.set:
                  exitCode: ${exitCode+(ciEntry.value.exitCode?:0)}
  - var.set:
      formattedSummary: {fmt: summary}
  - out.write:
      stdout: ${formattedSummary}
  - if: ${#isNotBlank(global.ci.jobSummaryFile)}
    out.write:
      ${global.ci.jobSummaryFile}: ${formattedSummary}
  - exit: ${exitCode}

formatters:
  ciEntry:
    Step: ${ciEntry.key}
    Status: ${ciEntry.value.status}
    Reason: ${ciEntry.value.statusReason?:''}
    
  summary: |
  
    # Fcli CI Pipeline Summary
    
    ${ciSummary.replaceAll('\r', '')}
    
    # Fcli Security Policy Status
    
    ${CHECK_POLICY.exitCode==0||CHECK_POLICY.exitCode==100?CHECK_POLICY.stdout:CHECK_POLICY.dependencySkipReason}
        
    ${APPVERSION_SUMMARY.stdout}
