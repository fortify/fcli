# yaml-language-server: $schema=https://fortify.github.io/fcli/schemas/action/fcli-action-schema-dev-2.x.json
author: Fortify
usage:
  header: Create a pull request from changed files
  description: |
    This action detects local file changes, creates a new branch, commits the changes,
    pushes to the remote, and raises a pull/merge request via the detected CI system's API.
    
    This action requires:
    - Git repository access (for branch/commit/push operations)
    - CI system token with PR/MR creation permissions (GITHUB_TOKEN, CI_JOB_TOKEN, etc.)
    
    Configuration via environment variables:
    - `SOURCE_DIR` — Source directory where changes are detected (default: CI workspace or current directory)
    - `PR_TITLE` — PR/MR title (default: "fix: Fortify auto-remediation fixes")
    - `PR_BODY` — PR/MR body (default: auto-generated description)
    - `PR_BRANCH_PREFIX` — Branch name prefix (default: "fcli/remediation")
    - `PR_COMMIT_MESSAGE` — Commit message (default: "fix: apply Fortify auto-remediation fixes")

config:
  output: immediate
  rest.target.default: ssc
  run.fcli.status.log.default: true    # By default, we log all exit statuses
  run.fcli.status.check.default: true
  mcp: exclude

steps:
  - run.fcli:
      detect-env:
        group: detect-env
        cmd: fcli action run detect-env
        status.check: true
    on.fail:
      - log.warn:
          msg: "CI environment detection failed"
          cause: ${detect-env_exception}

  - var.set:
      sourceDir: ${#env('SOURCE_DIR')?:global.ci.sourceDir?:'.'}

  # Log initial git repository information for diagnostics
  - var.set:
      gitRepoInfo: ${#git.localRepo(sourceDir)}
  - if: ${gitRepoInfo!=null}
    log.info: "Git repository: workspace=${gitRepoInfo.repository.workspaceDir}, remote=${gitRepoInfo.repository.remoteUrl?:'not configured'}, branch=${gitRepoInfo.branch.short_?:'detached HEAD'}"

  # Log current commit information for reference (debug level)
  - if: ${gitRepoInfo.commit!=null}
    log.debug: "Current HEAD: ${gitRepoInfo.commit.headId.short} - ${gitRepoInfo.commit.message.short}"

  # Check if there are changes to commit
  - var.set:
      hasChanges: ${#git.hasChanges(sourceDir)}

  - if: ${!hasChanges}
    do:
      - log.info: "No changes detected in ${sourceDir}, skipping PR creation."
      - exit: 0

  - log.info: "Changes detected in ${sourceDir}, proceeding with PR creation."

  - var.set:
      branchPrefix: ${#env('PR_BRANCH_PREFIX')?:'aviator/remediations'}
      commitMessage: "${#env('PR_COMMIT_MESSAGE')?:'fix: apply Fortify auto-remediation fixes'}"
      prTitle: "${#env('PR_TITLE')?:'fix: Fortify auto-remediation fixes'}"
      prBody: "${#env('PR_BODY')?:'This pull request contains auto-remediation fixes generated by Fortify SAST Aviator.'}"

  # Create a new branch for the changes with error handling
  - var.set:
      branchName: ${#git.createBranch(sourceDir, branchPrefix)}
    on.fail:
      - log.warn:
          msg: "Failed to create branch with prefix '${branchPrefix}'"
          cause: ${lastException}
      - throw: ${lastException}
  - log.info: "Successfully created branch: ${branchName}"

  # Stage and commit changes with error handling
  - var.set:
      staged: ${#git.addAll(sourceDir)}
    on.fail:
      - log.warn:
          msg: "Failed to stage changes in ${sourceDir}"
          cause: ${lastException}
      - throw: ${lastException}
  - log.debug: "All changes staged successfully"

  - var.set:
      commitSha: "${#git.commit(sourceDir, commitMessage)}"
    on.fail:
      - log.warn:
          msg: "Failed to commit staged changes with message: '${commitMessage}'"
          cause: ${lastException}
      - throw: ${lastException}
  - log.info: "Successfully committed changes: ${commitSha}"

  # Pre-push diagnostics: Check for available credentials
  - var.set:
      githubToken: "${#env('GITHUB_TOKEN')?:#env('GH_TOKEN')}"
      gitlabToken: "${#env('CI_JOB_TOKEN')}"
      azureToken: "${#env('SYSTEM_ACCESSTOKEN')}"
      bitbucketToken: "${#env('BITBUCKET_TOKEN')}"

  - log.debug: "Credential availability check - GitHub: ${githubToken!=null?'configured':'not found'}, GitLab: ${gitlabToken!=null?'configured':'not found'}, Azure: ${azureToken!=null?'configured':'not found'}, Bitbucket: ${bitbucketToken!=null?'configured':'not found'}"

  - if: "${githubToken==null && gitlabToken==null && azureToken==null && bitbucketToken==null && gitRepoInfo.repository.remoteUrl!=null && gitRepoInfo.repository.remoteUrl.contains('https')}"
    do:
      - log.warn: "WARNING: No CI credentials detected (GITHUB_TOKEN/GH_TOKEN, CI_JOB_TOKEN, SYSTEM_ACCESSTOKEN, BITBUCKET_TOKEN). Remote URL uses HTTPS and requires authentication: ${gitRepoInfo.repository.remoteUrl}"

  # Push branch to remote with detailed error context
  - var.set:
      pushedRef: ${#git.push(sourceDir)}
    on.fail:
      - var.set:
          errorMsg: "Failed to push branch '${branchName}' to remote"
          remoteUrl: "${gitRepoInfo.repository.remoteUrl?:'unknown'}"
          exceptionType: "${lastException.type}"
          exceptionMsg: "${lastException.message}"
      - log.warn:
          msg: "${errorMsg}. Remote: ${remoteUrl}. Error: ${exceptionType}: ${exceptionMsg}"
          cause: ${lastException}
      - if: "${exceptionMsg.contains('No credentials available')}"
        do:
          - log.warn: "DIAGNOSIS: Push failed due to missing credentials. Required environment variables for HTTPS remotes: GITHUB_TOKEN or GH_TOKEN (GitHub), CI_JOB_TOKEN (GitLab), SYSTEM_ACCESSTOKEN (Azure DevOps), or BITBUCKET_TOKEN (Bitbucket)"
          - log.warn: "DIAGNOSIS: Ensure the CI runner has permission to set and pass through authentication tokens to this action"
      - throw:
          msg: "${errorMsg}"
          cause: ${lastException}
  - log.info: "Successfully pushed branch to remote: ${pushedRef}"

  # Create PR/MR based on detected CI system
  - var.set:
      ci.detected: ${#_ci.detect()}
      ci.type: ${ci.detected.type}
      baseBranch: "${#env('BASE_BRANCH')?:'main'}"
  - log.debug: "Detected CI system: ${ci.type}"
  - log.debug: "Detected Base Branch: ${baseBranch}"

  # GitHub PR creation
  - if: ${ci.type=='github'}
    do:
      - var.set:
          repoOwner: ${ci.detected.repo().owner}
          repoName: ${ci.detected.repo().name}
          prHead: "${repoOwner}:${branchName}"
      - log.debug: "Creating GitHub PR: head=${prHead}, base=${baseBranch}, title=${prTitle}"
      - var.set:
          pr: ${#_ci.detect().repo().createPullRequest(prTitle, prHead, baseBranch, prBody)}
        on.fail:
          - log.warn:
              msg: "Failed to create GitHub Pull Request from '${branchName}' to '${baseBranch}'"
              cause: ${lastException}
          - log.warn: "Troubleshooting: Verify branch '${branchName}' exists on remote, and base branch '${baseBranch}' is valid"
          - throw: ${lastException}
      - log.info: "Successfully created GitHub Pull Request #${pr.number}: ${pr.html_url}"
  
  # GitLab MR creation
  - if: ${ci.type=='gitlab'}
    do:
      - var.set:
          mr: ${#_ci.detect().project().createMergeRequest(prTitle, branchName, baseBranch, prBody)}
        on.fail:
          - log.warn:
              msg: "Failed to create GitLab Merge Request from '${branchName}' to '${baseBranch}'"
              cause: ${lastException}
          - throw: ${lastException}
      - log.info: "Successfully created GitLab Merge Request !${mr.iid}: ${mr.web_url}"

  # Unknown CI system - log warning
  - if: ${ci.type!='github' && ci.type!='gitlab'}
    log.warn: "PR/MR creation not supported for CI system '${ci.type}'. Branch '${branchName}' (${pushedRef}) has been pushed; please create a PR/MR manually."

  # Success summary
  - log.info: "PR creation workflow completed successfully. Branch '${branchName}' pushed to remote."
