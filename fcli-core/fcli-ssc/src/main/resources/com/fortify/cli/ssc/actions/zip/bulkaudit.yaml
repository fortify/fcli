# yaml-language-server: $schema=https://fortify.github.io/fcli/schemas/action/fcli-action-schema-dev-2.x.json

author: Fortify
usage:
  header: (PREVIEW, DEPRECATED) Perform SAST Aviator audits of SSC application versions in bulk.
  description: |
    This action is deprecated; use the `bulkaudit-sast` action instead.

    For backward compatibility, this action accepts the original `bulkaudit` options
    and delegates execution to `bulkaudit-sast`.

config:
  output: immediate
  run.fcli.status.log.default: true
  mcp: exclude # Not suitable for MCP tool invocation

cli.options:
  max-audits:
    group: bulkaudit-sast-options
    names: --max-audits, -m
    description: "Maximum number of project versions to audit. Default: -1 (unlimited)"
    required: false
    default: -1
    type: int
  aviator-app-mapping:
    group: bulkaudit-sast-options
    names: --aviator-app-mapping
    description: >-
      Controls how SSC project versions map to Fortify Aviator applications. 'app' (default) maps one
      Fortify Aviator app per SSC project; 'version' maps one Fortify Aviator app per SSC project version
      (using project_name__version_name).
    required: false
    default: app
  filter:
    group: bulkaudit-sast-options
    names: --filter, -f
    description: >-
      Optional filter to apply when querying SSC for projects. Example: 'Languages:java'. Default: no filtering
    required: false
    default: ""
  exclude-filter:
    group: bulkaudit-sast-options
    names: --exclude-filter, -e
    description: >-
      Optional inverse filter to exclude projects from audit. Projects matching this filter will be skipped.
      Example: 'Languages:c#' to exclude .NET projects. Can be combined with --filter. Default: no exclusion
    required: false
    default: ""
  dry-run:
    group: bulkaudit-sast-options
    names: --dry-run, -n
    description: "Show what aviator commands would be executed without actually running them. Default: false"
    required: false
    default: false
    type: boolean
  tag-mapping:
    group: bulkaudit-sast-options
    names: --tag-mapping, -t
    description: >-
      Path to tag mapping YAML file. This custom mapping ensures that Fortify Remediation Aviator 'Unsure'
      audit results are properly handled. Required unless --add-aviator-tags is specified.
    required: false
  add-aviator-tags:
    group: bulkaudit-sast-options
    names: --add-aviator-tags
    description: >-
      If specified, runs 'fcli aviator ssc prepare' for the application before audit. Required unless
      --tag-mapping is specified.
    required: false
    type: boolean
    default: false
  refresh:
    group: bulkaudit-sast-options
    names: --refresh
    description: >-
      Refresh application version metrics before audit. For large applications this can lead to timeout errors.
      Default: true
    required: false
    type: boolean
    default: true
  refresh-timeout:
    group: bulkaudit-sast-options
    names: --refresh-timeout
    description: >-
      Timeout period for metric refresh, e.g., 30s (30 seconds), 5m (5 minutes), 1h (1 hour). Default: 60s
    required: false
    default: "60s"
  skip-if-exceeding-quota:
    group: bulkaudit-sast-options
    names: --skip-if-exceeding-quota
    description: >-
      Skip audit if the number of open issues exceeds the available Fortify Remediation Aviator quota.
      When skipped, a summary with top unaudited categories is shown. Default: false
    required: false
    default: false
    type: boolean
  test-exceeding-quota:
    group: bulkaudit-sast-options
    names: --test-exceeding-quota
    description: >-
      Check whether the number of open issues exceeds the available Fortify Remediation Aviator quota and
      report the result without performing an audit. Default: false
    required: false
    default: false
    type: boolean
  folder-priority-order:
    group: bulkaudit-sast-options
    names: --folder-priority-order
    description: >-
      Custom priority order for folder-based filtering when quota is exceeded (comma-separated, highest priority
      first). Example: Critical,High,Medium,Low. Applied to all audited versions. Default: uses server default
      (Critical > High > Medium > Low)
    required: false
    default: ""

steps:
  - run.fcli:
      bulkaudit_sast:
        cmd: ssc action run bulkaudit-sast ${#action.copyParametersFromGroup('bulkaudit-sast-options')}
        status.check: true
