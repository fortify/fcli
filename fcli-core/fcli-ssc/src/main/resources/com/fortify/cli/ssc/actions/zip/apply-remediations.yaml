# yaml-language-server: $schema=https://fortify.github.io/fcli/schemas/action/fcli-action-schema-dev-2.x.json
author: Fortify
usage:
  header: Apply Aviator remediations
  description: |
    This action applies Aviator auto-remediation fixes to source code for a given
    SSC application version. It downloads the audited FPR with remediation suggestions
    and applies the fixes to the local source tree.
    
    This action requires:
    - An SSC session to be active (for downloading the audited FPR with remediations)
    - An Aviator session to be active (for the apply-remediations command)
    
    After running this action, any modified files can be committed and pushed using
    the `create-pr` action.

cli.options:
  aviatorArtifact:
    names: --aviator-artifact
    description: "Artifact ID to apply remediations from. If not specified, uses --latest to apply from the most recent Aviator-processed artifact."
    required: false

config:
  output: immediate
  rest.target.default: ssc
  mcp: exclude

steps:
  - run.fcli:
      detect-env:
        group: detect-env
        cmd: fcli action run detect-env
        status.check: true

  - var.set:
      av: ${#env('SSC_APPVERSION')?:global.ci.defaultFortifyRepo}
  - if: ${av==null}
    throw: SSC application version must be specified through SSC_APPVERSION environment variable

  - var.set:
      sourceDir: ${global.ci.sourceDir?:'.'}
      artifactSelector: "${#isNotBlank(cli.aviatorArtifact) ? '--artifact-id '+cli.aviatorArtifact : '--av '+av+' --latest'}"

  - run.fcli:
      APPLY_REMEDIATIONS:
        cmd: "aviator ssc apply-remediations --source-dir \"${sourceDir}\" ${artifactSelector}"
        status.check: true
