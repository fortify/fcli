port: 8080
imports:
  - actions/http-fod.yaml

# THREAD MODEL
# The HTTP MCP server uses three independent thread pools:
#
#   workThreads      -- handles MCP tool call requests. Each simultaneous tool call
#                      from any user occupies one work thread for its full duration.
#                      Size this to: expected_concurrent_users * max_parallel_tool_calls_per_user.
#
#   progressThreads  -- polls progress for long-running jobs at regular intervals.
#                      One thread is consumed per active long-running job during each poll cycle.
#                      4 threads is sufficient for most deployments.
#
#   asyncBgThreads   -- runs background async streaming jobs (e.g. run.fcli steps with streaming
#                      output). Each active async streaming job occupies one background thread.
#                      Increase if actions make heavy use of async streaming.

# Optional settings (shown with default values):
# workThreads: 20          # Number of threads for handling MCP tool call requests
# progressThreads: 4       # Number of threads for streaming progress updates
# asyncBgThreads: 2        # Number of background threads for async job processing
# jobSafeReturn: 25s       # Max time to wait for a job result before returning a job ID
# progressInterval: 5s     # Interval between progress update checks
# isolationScopeTtl: 4h    # Idle timeout for per-user session/variable state; state is
#                          # discarded and variables are deleted after this period of inactivity

fod:
  url: https://api.ams.fortify.com
  connectTimeout: 30s
  socketTimeout: 10m
  insecureModeEnabled: false
