fcli.agent.usage.header = (PREVIEW) Manage AI assistant integrations
fcli.agent.usage.description = Manage AI-related functionality like MCP servers and skills.

# fcli agent extensions
fcli.agent.extensions.usage.header = (PREVIEW) Manage Fortify extensions for AI coding assistants
fcli.agent.extensions.usage.description = Install, update, uninstall, or check status of Fortify extensions (skills, agents, plugins) for AI coding assistants like Claude Code, GitHub Copilot, OpenAI Codex, and Gemini CLI.
fcli.agent.extensions.install.usage.header = Install Fortify extensions to detected coding assistants
fcli.agent.extensions.install.usage.description = Download and install Fortify extensions (skills, agents, plugins) to detected AI coding assistants. By default, extensions are downloaded from the official Fortify releases. Use --source to specify a local zip, directory, or alternative URL.
fcli.agent.extensions.install.output.table.args = assistant,file,__action__
fcli.agent.extensions.uninstall.usage.header = Remove installed Fortify extensions from coding assistants
fcli.agent.extensions.uninstall.usage.description = Remove previously installed Fortify extensions from AI coding assistant directories and clean up fcli state.
fcli.agent.extensions.uninstall.output.table.args = assistant,file,__action__
fcli.agent.extensions.update.usage.header = Update installed Fortify extensions
fcli.agent.extensions.update.usage.description = Update installed extensions: add new files, update changed files, and remove files no longer in the source. Can also be used for first-time install.
fcli.agent.extensions.update.output.table.args = assistant,file,__action__
fcli.agent.extensions.status.usage.header = Show current extension installation state
fcli.agent.extensions.status.usage.description = Display the current installation state of Fortify extensions per coding assistant.
fcli.agent.extensions.status.output.table.args = assistant,file

# Shared option descriptions for extensions commands
fcli.agent.extensions.assistants = Restrict to specific assistants (e.g., --assistants claude,copilot). Default: all detected.
fcli.agent.extensions.exclude-assistants = Exclude specific assistants from the operation.
fcli.agent.extensions.source = Extensions source: local zip file, local directory, or remote URL. Default: official Fortify releases.
fcli.agent.extensions.dir = Install to a specific directory instead of auto-detected locations. Requires --content-type. Bypasses assistant detection.
fcli.agent.extensions.content-types = Filter by content type: skills, agents, plugins. Default: all. Required with --dir.
fcli.agent.extensions.on-invalid-signature = Action on invalid signature: ignore, warn, fail. Default: fail.
fcli.agent.extensions.on-unsigned = Action on unsigned content: ignore, warn, fail. Default: fail.
fcli.agent.extensions.on-invalid-version = Action on incompatible schema version: ignore, warn, fail. Default: fail.
fcli.agent.extensions.confirm = Skip confirmation prompt.
fcli.agent.extensions.dry-run = Show what would be done without performing any changes.

# fcli agent mcp
fcli.agent.mcp.usage.header = (PREVIEW) Manage fcli MCP server commands for AI assistants
fcli.agent.mcp.usage.description = Start fcli MCP servers for AI assistants, and generate HTTP MCP server config templates.
fcli.agent.mcp.start-stdio.usage.header = (PREVIEW) Start fcli MCP server on stdio for AI integration
fcli.agent.mcp.start-stdio.usage.description = Start the fcli MCP server over stdio. This command exposes fcli module commands and/or \
  imported action functions as MCP tools to AI clients.%n\
  %nTHREAD MODEL:%n\
  - Work threads (--work-threads): execute MCP tool calls. Each concurrent tool call occupies one thread for its\n\
    full duration. Size to the maximum number of tool calls the AI may invoke in parallel.%n\
  - Progress threads (--progress-threads): poll progress for long-running jobs at regular intervals. One thread\n\
    is consumed per active long-running job during each poll. The default of 4 is sufficient for most use cases.%n\
  - Async background threads (--async-bg-threads): run background async streaming jobs (e.g. run.fcli steps\n\
    with streaming output). Increase if actions make heavy use of async streaming.%n
fcli.agent.mcp.start-stdio.module = Fcli module to expose through this MCP server instance.
fcli.agent.mcp.start-stdio.import = Action YAML files to import. Exported functions are registered as MCP tools or resources based on function metadata.
fcli.agent.mcp.start-stdio.work-threads = Number of worker threads used to execute MCP tool jobs concurrently. Increase for higher parallelism if AI invokes multiple tools simultaneously.
fcli.agent.mcp.start-stdio.progress-threads = Number of threads used for updating and tracking job progress for long-running jobs.
fcli.agent.mcp.start-stdio.job-safe-return = Maximum time to wait synchronously for a job result before returning an in_progress placeholder. Specify duration like 25s, 2m, 1h.
fcli.agent.mcp.start-stdio.progress-interval = Interval between internal progress counter updates for long-running jobs. Specify duration (e.g. 500ms, 1s, 2s).
fcli.agent.mcp.start-stdio.async-bg-threads = Number of background threads for running async streaming jobs. Default: 2.

fcli.agent.mcp.start-http.usage.header = (PREVIEW) Start import-only HTTP fcli MCP server for AI integration
fcli.agent.mcp.start-http.usage.description = Start an HTTP MCP server exposing only exported functions from imported action YAML files defined in a config file. Generate a sample config file with 'fcli agent mcp create-http-config --type <ssc|fod>' and customize the generated YAML for your environment. The server listens for MCP POST requests on the /mcp endpoint. Each request must include the product-specific auth header as semicolon-separated key=value pairs; escape literal '\\', ';', or '=' characters as '\\\\', '\\;', or '\\='.\
	%n%nAUTH HEADERS (per HTTP request):\
	%n- SSC mode: X-AUTH-SSC: token=<sscToken>[;sc-sast-token=<scSastClientAuthToken>]\
	%n- FoD mode, user/PAT auth: X-AUTH-FOD: tenant=<tenant>;user=<user>;pat=<pat>\
	%n- FoD mode, client auth: X-AUTH-FOD: client-id=<clientId>;client-secret=<clientSecret>\
	%nExactly one FoD auth mode must be specified per request.
fcli.agent.mcp.start-http.config = Path to HTTP MCP YAML config file. Generate a template with 'fcli agent mcp create-http-config'.

fcli.agent.mcp.create-http-config.usage.header = Generate a sample HTTP MCP server config file
fcli.agent.mcp.create-http-config.usage.description = Create a sample HTTP MCP config file for the selected product type.
fcli.agent.mcp.create-http-config.type = Product type for template generation: ssc or fod.
fcli.agent.mcp.create-http-config.config = Output path for the generated config file. Default: mcp-http-config.yaml.
fcli.agent.mcp.create-http-config.force = Overwrite an existing config file if it already exists.
