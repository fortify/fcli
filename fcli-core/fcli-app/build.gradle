apply from: "${sharedGradleScriptsDir}/fcli-java.gradle"
apply plugin: 'com.github.johnrengelman.shadow'

// Define dependencies on all fcli Gradle projects
dependencies {
	implementation project("${fcliCommonRef}")
	implementation project("${fcliActionRef}")
    implementation project("${fcliAviatorRef}")
    implementation project("${fcliConfigRef}")
	implementation project("${fcliFoDRef}")
    implementation project("${fcliSSCRef}")
    implementation project("${fcliSCSastRef}")
    implementation project("${fcliSCDastRef}")
    implementation project("${fcliToolRef}")
	implementation project("${fcliLicenseRef}")
    implementation project("${fcliUtilRef}")

    // Logging dependencies
    runtimeOnly('org.slf4j:jcl-over-slf4j')
	
	// Enable ANSI support
	runtimeOnly("org.fusesource.jansi:jansi")
}

// Replace imperative task definitions with configuration avoidance & proper inputs/outputs
ext.generatedPicocliReflectConfigDir = "${buildDir}/generated-reflect-config"

tasks.register('generatePicocliReflectConfig', JavaExec) {
    group = 'code generation'
    description = 'Generate picocli reflect-config.json'
    def outputFile = layout.buildDirectory.file("generated-reflect-config/META-INF/native-image/picocli-reflect-config/reflect-config.json")
    // Inputs
    inputs.property('rootCommandsClassName', fcliRootCommandsClassName)
    inputs.files(configurations.runtimeClasspath, configurations.annotationProcessor, sourceSets.main.runtimeClasspath)
    // Outputs
    outputs.file(outputFile)
    classpath(configurations.runtimeClasspath, configurations.annotationProcessor, sourceSets.main.runtimeClasspath)
    mainClass.set('picocli.codegen.aot.graalvm.ReflectionConfigGenerator')
    args(fcliRootCommandsClassName, '-o', outputFile.get().asFile.absolutePath)
}

apply plugin: 'application'
application { mainClass.set(fcliMainClassName) }

// Ensure shadowJar picks up generated reflect config lazily
shadowJar {
    dependsOn(tasks.named('generatePicocliReflectConfig'))
    mergeServiceFiles()
    archiveBaseName.set('fcli')
    archiveClassifier.set('')
    archiveVersion.set('')
    from({ generatedPicocliReflectConfigDir })
}

ext {
	thirdPartyBaseName = "${project.name}"
}
plugins.apply('com.github.jk1.dependency-license-report')
apply from: "${gradleHelpersLocation}/thirdparty-helper.gradle"

// distThirdPartyReleaseAsset task refactored
tasks.register('distThirdPartyReleaseAsset') {
    group = 'distribution'
    description = 'Prepare third-party license asset in release assets directory'
    dependsOn('distThirdParty')
    dependsOn('createDistDir')
    inputs.file(layout.buildDirectory.file('dist/fcli-app-thirdparty.zip'))
    outputs.file(layout.projectDirectory.file("${releaseAssetsDir}/fcli-thirdparty.zip"))
    doLast {
        def src = file("$buildDir/dist/fcli-app-thirdparty.zip")
        def dest = file("${releaseAssetsDir}/fcli-thirdparty.zip")
        if (dest.exists()) { dest.delete() }
        src.renameTo(dest)
    }
}

// Main dist task refactored
tasks.register('dist', Copy) {
    group = 'distribution'
    description = 'Copy application shadow jar to release assets directory'
    dependsOn('shadowJar', 'createDistDir')
    from(layout.buildDirectory.dir('libs')) { include 'fcli.jar' }
    into(releaseAssetsDir)
    inputs.file(layout.buildDirectory.file('libs/fcli.jar'))
    outputs.dir(releaseAssetsDir)
}