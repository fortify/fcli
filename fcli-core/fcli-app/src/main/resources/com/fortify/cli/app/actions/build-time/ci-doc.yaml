# yaml-language-server: $schema=https://fortify.github.io/fcli/schemas/action/fcli-action-schema-dev-2.x.json

# ============================================================================
# CI Documentation Generator - Refactored Structure
# ============================================================================
# This action generates CI/CD integration documentation by:
# 1. Defining CI systems and their components upfront as structured variables
# 2. Iterating over these definitions to generate outputs
# 3. Using formatters for content templates to avoid SpEL evaluation issues
#
# ADDING A NEW CI SYSTEM VERSION:
# 1. Add entry to ciSystemRegistry below
# 2. Add corresponding example formatters (quickStartExample, fullExample)
# 3. Run: ./gradlew :fcli-core:fcli-app:buildTimeAction_ci_doc
# 4. Verify generated files in build output
# ============================================================================

author: Fortify
usage:
  header: Generate CI documentation
  description: |
    Generate CI/CD integration documentation including environment variable
    references and usage guides.

config:
  output: immediate
  mcp: exclude
  
cli.options:
  outputDir:
    names: "-d"
    description: Required output directory

steps:
  # ==========================================================================
  # INITIALIZATION: Define all CI systems, components, and their outputs
  # ==========================================================================
  # Load environment variable definitions for products and common components
  - var.set:
      fodEnvVars: {fmt: fodEnvVars}
      sscEnvVars: {fmt: sscEnvVars}
      commonEnvVars: {fmt: commonEnvVars}
      fortifySetup21xEnvVars: {fmt: fortifySetup21xEnvVars}
      fcliBootstrapEnvVars: {fmt: fcliBootstrapEnvVars}
  
  # Define CI system registry: each CI system contains versions with their components and outputs
  # Structure allows easy addition of new CI systems and versions
  - var.set:
      ciSystemRegistry.github: >-
        ${
          {
            '3.0.x': {
              'setupComponent': 'fortifySetup',
              'setupVersion': '2.1.x',
              'outputs': {
                'setup': {
                  'filePattern': '{ciSystem}-setup-{version}.adoc',
                  'formatter': 'ciSystemSetupDoc',
                  'products': {}
                },
                'ciDocs': {
                  'filePattern': '{ciSystem}-ci-{product}-{version}.adoc',
                  'formatter': 'ciSystemFullDoc',
                  'products': {'fod', 'ssc'}
                }
              }
            }
          }
        }
  
  # Define setup components (e.g., @fortify/setup versions) with their env vars
  - var.set:
      setupComponents.fortifySetup: >-
        ${
          {
            '2.1.x': {
              'name': '@fortify/setup',
              'notes': 'Adds fcli version pinning via FCLI_BOOTSTRAP_VERSION. Uses RUNNER_TOOL_CACHE for persistent caching when full version specified.',
              'envVars': fortifySetup21xEnvVars
            }
          }
        }
  
  # ==========================================================================
  # STEP 1: Generate Bootstrap Fragments (version-specific)
  # ==========================================================================
  # Generate bootstrap-v{version}.txt/adoc for each unique setup component
  # These are product-independent fragments showing env vars for tool setup
  - records.for-each:
      from: ${#properties(setupComponents)}
      record.var-name: setupCompEntry
      do:
      - records.for-each:
          from: ${#properties(setupCompEntry.value)}
          record.var-name: versionEntry
          do:
          - var.set:
              setupKey: ${setupCompEntry.key}
              setupVersion: ${versionEntry.key}
              setupDef: ${versionEntry.value}
      
      # Build AsciiDoc table cells for this setup component
      - var.rm: [asciiDocCells]
      - records.for-each:
          from: ${setupDef.envVars}
          record.var-name: envVar
          do:
          - var.set:
              asciiDocCells..: {fmt: asciiDocCell}
      - records.for-each:
          from: ${fcliBootstrapEnvVars}
          record.var-name: envVar
          do:
          - var.set:
              asciiDocCells..: {fmt: asciiDocCell}
      
      # Generate text table for plain text output
      - with:
          writers:
            tableWriter:
              to: var:textTable
              type: table
              style: border
          do:
          - records.for-each:
              from: ${setupDef.envVars}
              record.var-name: envVar
              do:
              - writer.append:
                  tableWriter: {fmt: textCell}
          - records.for-each:
              from: ${fcliBootstrapEnvVars}
              record.var-name: envVar
              do:
              - writer.append:
                  tableWriter: {fmt: textCell}
      
      # Write bootstrap fragment files
      - out.write:
          "${cli.outputDir}/bootstrap-v${setupVersion}.txt": {fmt: bootstrapTextTable}
          "${cli.outputDir}/bootstrap-v${setupVersion}.adoc": {fmt: bootstrapAsciiDocTable}
  
  # ==========================================================================
  # STEP 2: Generate Session Fragments (product-specific)
  # ==========================================================================
  # Generate session-{product}.txt/adoc for each product
  # Contains authentication and connection env vars
  - records.for-each:
      from: ${{'fod', 'ssc'}}
      record.var-name: product
      do:
      - var.set:
          productEnvVars: "${product=='fod'?fodEnvVars:sscEnvVars}"
          sessionEnvVars: ${productEnvVars.session}
          asciiDocActionUrl: "${product}-actions.html"
      
      # Build cells for output
      - var.rm: [asciiDocCells]
      - records.for-each:
          from: ${sessionEnvVars}
          record.var-name: envVar
          do:
          - var.set:
              asciiDocCells..: {fmt: asciiDocCell}
      
      # Generate text table
      - with:
          writers:
            tableWriter:
              to: var:textTable
              type: table
              style: border
          do:
          - records.for-each:
              from: ${sessionEnvVars}
              record.var-name: envVar
              do:
              - writer.append:
                  tableWriter: {fmt: textCell}
      
      # Write session fragment files
      - var.set:
          module: ${product}
      - out.write:
          "${cli.outputDir}/session-${product}.txt": {fmt: textTable}
          "${cli.outputDir}/session-${product}.adoc": {fmt: asciiDocTable}
  
  # ==========================================================================
  # STEP 3: Generate CI Core Fragments (product-specific)
  # ==========================================================================
  # Generate ci-core-{product}.txt/adoc with CI integration env vars
  # Organized by workflow phase for AsciiDoc, flat for text
  - records.for-each:
      from: ${{'fod', 'ssc'}}
      record.var-name: product
      do:
      - var.set:
          productEnvVars: "${product=='fod'?fodEnvVars:sscEnvVars}"
          asciiDocActionUrl: "${product}-actions.html"
          ciEnvVarSections: "${{productEnvVars.preScan, commonEnvVars.package, productEnvVars.scan, productEnvVars.postScan}}"
          sectionTitles: "${{
            (product=='fod'?'Release Configuration':'Application Version Configuration'),
            'Packaging Configuration',
            'Scan Configuration',
            'Post-Scan Configuration'
          }}"
      
      # Generate text table (flat list of all env vars)
      - with:
          writers:
            tableWriter:
              to: var:textTable
              type: table
              style: border
          do:
          - records.for-each:
              from: ${ciEnvVarSections}
              record.var-name: envVarList
              do:
              - records.for-each:
                  from: ${envVarList}
                  record.var-name: envVar
                  do:
                  - writer.append:
                      tableWriter: {fmt: textCell}
      
      # Generate AsciiDoc multi-section table
      - var.rm: [asciiDocSections]
      - records.for-each:
          from: "${{0, 1, 2, 3}}"
          record.var-name: sectionIdx
          do:
          - var.set:
              sectionTitle: ${sectionTitles[sectionIdx]}
          - var.rm: [asciiDocCells]
          - records.for-each:
              from: ${ciEnvVarSections[sectionIdx]}
              record.var-name: envVar
              do:
              - var.set:
                  asciiDocCells..: {fmt: asciiDocCell}
          - var.set:
              asciiDocSections..: {fmt: asciiDocSection}
      
      # Write core fragment files
      - var.set:
          module: ${product}
      - out.write:
          "${cli.outputDir}/ci-core-${product}.txt": {fmt: textTable}
          "${cli.outputDir}/ci-core-${product}.adoc": {fmt: asciiDocMultiSectionTable}
  
  # ==========================================================================
  # STEP 4: Generate Complete CI Integration Guides
  # ==========================================================================
  # For each CI system, generate complete documentation including:
  # - Setup documentation (product-independent)
  # - Per-product complete CI integration guides
  - records.for-each:
      from: ${#properties(ciSystemRegistry)}
      record.var-name: ciSystemEntry
      do:
      - var.set:
          ciSystem: ${ciSystemEntry.key}
          ciSystemVersions: ${ciSystemEntry.value}
      
      # Process each version of this CI system
      - records.for-each:
          from: ${#properties(ciSystemVersions)}
          record.var-name: versionEntry
          do:
          - var.set:
              ciVersion: ${versionEntry.key}
              ciSystemDef: ${versionEntry.value}
              setupDef: ${setupComponents[ciSystemDef.setupComponent][ciSystemDef.setupVersion]}
              setupVersion: ${ciSystemDef.setupVersion}
      
          # Process each output type defined for this CI system version
          - records.for-each:
              from: ${#properties(ciSystemDef.outputs)}
              record.var-name: outputEntry
              do:
              - var.set:
                  outputKey: ${outputEntry.key}
                  outputDef: ${outputEntry.value}
              
              # Determine if this output applies to specific products or is product-independent  
              # Note: empty products may be represented as empty array [] or empty map {}
              - if: "${outputDef.products.size() == 0}"
                steps:
                # Product-independent output (e.g., setup docs)
                - var.set:
                    outputFile: "${outputDef.filePattern.replaceAll('\\{ciSystem\\}', ciSystem).replaceAll('\\{version\\}', 'v'+ciVersion)}"
                    fortifyProductName: ""
                    exampleUsage: {fmt: "${ciSystem}SetupExample"}
                
                # Build env var cells for setup documentation
                - var.rm: [bootstrapEnvVarCells, fcliEnvVarCells]
                - records.for-each:
                    from: ${setupDef.envVars}
                    record.var-name: envVar
                    do:
                    - var.set:
                        bootstrapEnvVarCells..: {fmt: asciiDocCell}
                - records.for-each:
                    from: ${fcliBootstrapEnvVars}
                    record.var-name: envVar
                    do:
                    - var.set:
                        fcliEnvVarCells..: {fmt: asciiDocCell}
                
                # Write product-independent output
                - out.write:
                    "${cli.outputDir}/${outputFile}": {fmt: "${outputDef.formatter}"}
              
              # Product-specific outputs
              - if: "${outputDef.products.size() > 0}"
                steps:
                - records.for-each:
                    from: ${outputDef.products}
                    record.var-name: product
                    do:
                    - var.set:
                        product: ${product}
                        productEnvVars: "${product=='fod'?fodEnvVars:sscEnvVars}"
                        outputFile: "${outputDef.filePattern.replaceAll('\\{ciSystem\\}', ciSystem).replaceAll('\\{version\\}', 'v'+ciVersion).replaceAll('\\{product\\}', product)}"
                        fortifyProductName: "${product=='fod'?'Fortify on Demand':'Software Security Center'}"
                        asciiDocActionUrl: "${product}-actions.html"
                        exampleUsage: {fmt: "${ciSystem}${product.substring(0,1).toUpperCase()}${product.substring(1)}Example"}
                    
                    # Build all env var cell arrays for complete documentation
                    - var.rm: [bootstrapEnvVarCells, fcliEnvVarCells, sessionEnvVarCells, preScanEnvVarCells, packageEnvVarCells, scanEnvVarCells, postScanEnvVarCells]
                    - records.for-each:
                        from: ${setupDef.envVars}
                        record.var-name: envVar
                        do:
                        - var.set:
                            bootstrapEnvVarCells..: {fmt: asciiDocCell}
                    - records.for-each:
                        from: ${fcliBootstrapEnvVars}
                        record.var-name: envVar
                        do:
                        - var.set:
                            fcliEnvVarCells..: {fmt: asciiDocCell}
                    - records.for-each:
                        from: ${productEnvVars.session}
                        record.var-name: envVar
                        do:
                        - var.set:
                            sessionEnvVarCells..: {fmt: asciiDocCell}
                    - records.for-each:
                        from: ${productEnvVars.preScan}
                        record.var-name: envVar
                        do:
                        - var.set:
                            preScanEnvVarCells..: {fmt: asciiDocCell}
                    - records.for-each:
                        from: ${commonEnvVars.package}
                        record.var-name: envVar
                        do:
                        - var.set:
                            packageEnvVarCells..: {fmt: asciiDocCell}
                    - records.for-each:
                        from: ${productEnvVars.scan}
                        record.var-name: envVar
                        do:
                        - var.set:
                            scanEnvVarCells..: {fmt: asciiDocCell}
                    - records.for-each:
                        from: ${productEnvVars.postScan}
                        record.var-name: envVar
                        do:
                        - var.set:
                            postScanEnvVarCells..: {fmt: asciiDocCell}
                    
                    # Set module variable for text table formatter references
                    - var.set:
                        module: ${product}
                    
                    # Write product-specific output
                    - out.write:
                        "${cli.outputDir}/${outputFile}": {fmt: "${outputDef.formatter}"}

# ==============================================================================
# FORMATTERS SECTION
# ==============================================================================
# Organized by purpose: table formatters, examples, document templates, env var definitions

formatters:
  # ============================================================================
  # BASE TABLE FORMATTERS
  # ============================================================================
  
  bootstrapTextTable: |
    ${textTable}
    
    * These variables are typically set by CI/CD bootstrapping tools like `@fortify/cli-action` (GitHub Actions)
      or similar CI-specific integrations. When using fcli directly, these are not required.
  
  bootstrapAsciiDocTable: |
    [%autowidth]
    |===
    |Environment Variable|Description 
    
    ${#join("", asciiDocCells)}
    |===
    
    NOTE: These variables are typically set by CI/CD bootstrapping tools like `@fortify/cli-action` (GitHub Actions)
    or similar CI-specific integrations. When using fcli directly, these are not required.
  
  textTable: |
    ${textTable}
    
    * Any fcli action references in this table refer to actions in the `fcli ${module}` module; please see
      `fcli ${module} action help <action-name>` for more information.
  
  textCell:
    Environment Variable: ${(envVar.realNode!=null?envVar.realNode:envVar).names}
    Description: "${#processFcliCmdRefs((envVar.realNode!=null?envVar.realNode:envVar).desc.replaceAll('actionRef:([\\w_-]+)(#[\\w_-]+)', '`$1`'), false)}"
  
  asciiDocTable: |
    [%autowidth]
    |===
    |Environment Variable|Description 
    
    ${#join("", asciiDocCells)}
    |===
  
  asciiDocCell: |
    |${(envVar.realNode!=null?envVar.realNode:envVar).names.replaceAll('\\n', ' +\\\\n')}
    |${#processFcliCmdRefs((envVar.realNode!=null?envVar.realNode:envVar).desc.replaceAll('\\n', ' +\\\\n').replaceAll('actionRef:([\\w_-]+)(#[\\w_-]+)', 'link:'+asciiDocActionUrl+'$2[$1]'), true)}
    
  asciiDocSection: |
    ==== ${sectionTitle}
    
    [%autowidth]
    |===
    |Environment Variable|Description 
    
    ${#join("", asciiDocCells)}
    |===
  
  asciiDocMultiSectionTable: |
    ${#join("\n\n", asciiDocSections)}
  
  # ============================================================================
  # CI-SPECIFIC EXAMPLES
  # ============================================================================
  # Separated from definitions to avoid SpEL evaluation issues with CI syntax
  
  githubFodExample: |
    
    === Example Usage
    
    [source,yaml]
    ----
    name: Fortify on Demand SAST Scan
    on:
      push:
        branches: [main]
      pull_request:
        branches: [main]
    
    jobs:
      fortify:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
          - uses: fortify/github-action@v3
            env:
              FOD_URL: ${'$'}{{ vars.FOD_URL }}
              FOD_CLIENT_ID: ${'$'}{{ secrets.FOD_CLIENT_ID }}
              FOD_CLIENT_SECRET: ${'$'}{{ secrets.FOD_CLIENT_SECRET }}
              # FOD_RELEASE: MyApp:main  # Optional: defaults to repo:branch
    ----
  
  githubSscExample: |
    
    === Example Usage
    
    [source,yaml]
    ----
    name: Software Security Center SAST Scan
    on:
      push:
        branches: [main]
      pull_request:
        branches: [main]
    
    jobs:
      fortify:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
          - uses: fortify/github-action@v3
            env:
              SSC_URL: ${'$'}{{ vars.SSC_URL }}
              SSC_TOKEN: ${'$'}{{ secrets.SSC_TOKEN }}
              SC_SAST_TOKEN: ${'$'}{{ secrets.SC_SAST_TOKEN }}
              # SSC_APPVERSION: MyApp:main  # Optional: defaults to repo:branch
    ----
  
  githubSetupExample: |
    
    === Example Usage
    
    [source,yaml]
    ----
    name: Custom Fortify Workflow
    on: [push]
    
    jobs:
      custom-scan:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
          - uses: fortify/github-action/setup@v3
            env:
              FCLI_BOOTSTRAP_VERSION: v3.14.1  # Pin to specific version
          - name: Run custom fcli commands
            run: |
              fcli fod session login
              # Your custom workflow here
              fcli fod session logout
    ----
  
  # ============================================================================
  # COMPLETE DOCUMENT TEMPLATES
  # ============================================================================
  
  ciSystemFullDoc: |
    = `fortify/github-action`
    :fcli-version: ${#fcliBuildProperties().fcliVersion}
    :fortify-setup-version: ${setupVersion}
    :ci-action-version: ${ciVersion}
    :generation-date: ${#formatDateTime('yyyy-MM-dd')}
    :toc: left
    :toclevels: 3
    
    [.subtitle]
    ${fortifyProductName}
    
    == Version Information
    
    [%autowidth]
    |===
    |Component|Version
    
    |fcli|{fcli-version}
    |${setupDef.name}|{fortify-setup-version}
    |${#capitalize(ciSystem)} Action|{ci-action-version}
    |Generated|{generation-date}
    |===
    
    == Overview
    
    This ${#capitalize(ciSystem)} Action provides seamless integration of ${fortifyProductName} Application Security Testing (AST) into your CI/CD workflows. The action leverages `${setupDef.name}` to bootstrap fcli, then executes fcli-based CI workflows through the fcliCmd:fcli action run: command.
    
    ${#ifBlank(setupDef.notes, '')?:setupDef.notes}
    ${exampleUsage}
    
    == Configuration
    
    Configuration is accomplished through environment variables set in your CI workflow file. The following sections document all available configuration options organized by their purpose.
    
    === Setup & Bootstrap
    
    These environment variables control tool installation and initialization before scanning begins.
    
    [%autowidth]
    |===
    |Environment Variable|Description
    ${#join("", bootstrapEnvVarCells)}${#join("", fcliEnvVarCells)}
    |===
    
    === Authentication & Connection
    
    Configure credentials and connection details for ${product=='fod'?'Fortify on Demand':'Software Security Center'}.
    
    [%autowidth]
    |===
    |Environment Variable|Description
    ${#join("", sessionEnvVarCells)}
    |===
    
    === ${product=='fod'?'Release':'Application Version'} Management
    
    [%autowidth]
    |===
    |Environment Variable|Description
    ${#join("", preScanEnvVarCells)}
    |===
    
    === Package Configuration
    
    [%autowidth]
    |===
    |Environment Variable|Description
    ${#join("", packageEnvVarCells)}
    |===
    
    === Scan Execution
    
    [%autowidth]
    |===
    |Environment Variable|Description
    ${#join("", scanEnvVarCells)}
    |===
    
    === Post-Scan Actions
    
    [%autowidth]
    |===
    |Environment Variable|Description
    ${#join("", postScanEnvVarCells)}
    |===
  
  ciSystemSetupDoc: |
    = `fortify/github-action/setup`
    :fcli-version: ${#fcliBuildProperties().fcliVersion}
    :fortify-setup-version: ${setupVersion}
    :ci-action-version: ${ciVersion}
    :generation-date: ${#formatDateTime('yyyy-MM-dd')}
    :toc: left
    :toclevels: 3
    
    == Version Information
    
    [%autowidth]
    |===
    |Component|Version
    
    |fcli|{fcli-version}
    |${setupDef.name}|{fortify-setup-version}
    |${#capitalize(ciSystem)} Action|{ci-action-version}
    |Generated|{generation-date}
    |===
    
    == Overview
    
    This ${#capitalize(ciSystem)} Action provides a setup component that bootstraps fcli and other Fortify tools for use in custom CI/CD workflows. This allows you to implement fully customized AST scan workflows or other automation workflows that interact with Fortify products.
    
    ${#ifBlank(setupDef.notes, '')?:setupDef.notes}
    ${exampleUsage}
    
    == Configuration
    
    Configuration is accomplished through environment variables set in your CI workflow file. This setup component applies to both Fortify on Demand (FoD) and Software Security Center (SSC) integrations.
    
    === Setup & Bootstrap
    
    These environment variables control tool installation and initialization.
    
    [%autowidth]
    |===
    |Environment Variable|Description
    ${#join("", bootstrapEnvVarCells)}${#join("", fcliEnvVarCells)}
    |===
  
  # ============================================================================
  # ENVIRONMENT VARIABLE DEFINITIONS
  # ============================================================================
  # These are kept as formatters to be loaded into variables at action start
  # This allows the same definitions to be reused across multiple processing steps
  
  fodEnvVars:
    session:
      - names: FOD_URL
        desc: >-  
          Fortify on Demand URL, for example `https://ams.fortify.com`. This must be rendered by the CI/CD system
          as plain text, not as a masked secret/variable.
      - names: FOD_CLIENT_ID\nFOD_CLIENT_SECRET
        desc: >-
          Required when authenticating with an API key: Fortify on Demand Client ID (API key) and Secret (API secret).
      - names: FOD_TENANT\nFOD_USER\nFOD_PASSWORD
        desc: >-
          Required when authenticating with user credentials: Fortify on Demand tenant, user and password. It is
          recommended to use a Personal Access Token instead of an actual user password.
      - names: FOD_LOGIN_EXTRA_OPTS
        desc: >-
          Extra login options, for example for disabling SSL checks or changing connection time-outs; see 
          fcliCmd:fcli fod session login: documentation.
    preScan:
      - names: FOD_RELEASE
        desc: >-
          Fortify on Demand release to use with this action. This should be specified as `<app-name>:<release-name>`
          (for non-microservices applications) or `<app-name>:<microservice-name>:<release-name>` (for microservices 
          applications). Default value is based on repository and branch name, for example `myOrg/myRepo:myBranch`.
          Note that you'll need to explicitly configure `FOD_RELEASE` for microservices applications, as the default
          value lacks a microservice name.
      - names: DO_SETUP\nSETUP_ACTION\nSETUP_EXTRA_OPTS
        desc: >-
          If `DO_SETUP` is set not set to `false`, the application and/or release will be created if they do not
          yet exist, and static scan settings will be configured if not configured already, using the
          fcli-provided actionRef:setup-release#_setup_release action, or, if specified, the custom fcli action specified through
          `SETUP_ACTION`. Extra options for the fcli action can be passed through the `SETUP_EXTRA_OPTS`
          environment variable.\n\nDepending on your Git workflow, it is recommended to copy state from the
          release representing your default branch by passing the `--copy-from` option through
          `SETUP_EXTRA_OPTS`. To allow this action to create new applications, depending on FoD version,
          you may (also) need to provide the `--app-owner <user id or name>` option through `SETUP_EXTRA_OPTS`.
    scan:
      - names: DO_SAST_SCAN\nSAST_SCAN_EXTRA_OPTS
        desc: >-
          The fcli `ci` action currently only supports running a SAST scan, which is enabled by default.
          The `SAST_SCAN_EXTRA_OPTS` environment variable can be used to provide additional options to the
          fcliCmd:fcli fod sast-scan start: command, for example to specify scan notes. Note that these environment
          variables only control the submission of the scan request; see the information below for details
          on waiting for the scan to complete.
      - names: DO_WAIT\nDO_SAST_WAIT\nSAST_WAIT_EXTRA_OPTS
        desc: >-
          By default, the fcli `ci` action will wait for all started scans to complete; set `DO_WAIT` to
          `false` to just kick off any configured scans without waiting for completion. Note that doing so
          will skip any post-scan tasks. The `SAST_WAIT_EXTRA_OPTS` environment variable can be used to pass
          extra options to the fcliCmd:fcli fod sast-scan wait-for: command. Note that `DO_SAST_WAIT` is deprecated; 
          please use `DO_WAIT` instead.
    postScan:
      - names: DO_RELEASE_SUMMARY\nRELEASE_SUMMARY_ACTION\nRELEASE_SUMMARY_EXTRA_OPTS
        desc: >-
          If `DO_RELEASE_SUMMARY` is not set to `false`, a release summary will be generated using the
          fcli-provided actionRef:release-summary#_release_summary action or, if specified, the custom fcli action specified through
          `RELEASE_SUMMARY_ACTION`. Extra options for the fcli action can be specified through the
          `RELEASE_SUMMARY_EXTRA_OPTS` environment variable, which may include fcli options to allow
          unsigned custom actions to be used.
      - names: DO_CHECK_POLICY\nCHECK_POLICY_ACTION\nCHECK_POLICY_EXTRA_OPTS
        desc: >-
          If `DO_CHECK_POLICY` is set to true (implied if any of the other two `CHECK_POLICY_*` variables
          are set), a policy check will be run after scan completion using the fcli-provided
          actionRef:check-policy#_check_policy action or, if specified, the custom fcli action specified through
          `CHECK_POLICY_ACTION`. Extra options for a custom fcli action can be passed through the
          `CHECK_POLICY_EXTRA_OPTS` environment variable, which may include fcli options to allow
          unsigned custom actions to be used.
      - names: DO_PR_COMMENT\nPR_COMMENT_ACTION\nPR_COMMENT_EXTRA_OPTS
        desc: >-
          (PREVIEW) If `DO_PR_COMMENT` is set to true (implied if any of the other two `PR_COMMENT_*` variables
          are set), a Pull Request or Merge Request comment will be generated using an fcli-provided action
          matching the current CI system like actionRef:github-pr-comment#_github_pr_comment or, if specified, the custom fcli action
          specified through `PR_COMMENT_ACTION`. Extra options for the fcli action can be specified through
          the `PR_COMMENT_EXTRA_OPTS` environment variable, which may include fcli options to allow unsigned
          custom actions to be used.
      - names: DO_SAST_EXPORT\nSAST_EXPORT_ACTION\nSAST_EXPORT_EXTRA_OPTS
        desc: >-
          If `DO_SAST_EXPORT` is not set to `false` and a SAST scan was completed, the SAST vulnerability
          data will be exported into a CI-specific format using an fcli-provided action matching the current
          CI system like actionRef:github-sast-report#_github_sast_report or actionRef:gitlab-sast-report#_gitlab_sast_report, or, if specified, the custom fcli action
          specified through `SAST_EXPORT_ACTION`. Extra options for the fcli action can be specified through the
          `SAST_EXPORT_EXTRA_OPTS` environment variable, which may include fcli options to allow unsigned custom
          actions to be used.
  
  sscEnvVars:
    session:
      - names: SSC_URL
        desc: >-
            Software Security Center (SSC) URL, for example `https://ssc.customer.fortifyhosted.net/`. This must be 
            rendered by the CI/CD system as plain text, not as a masked secret/variable.
      - names: SSC_TOKEN
        desc: >-
            Required when authenticating with an SSC token (recommended). Most actions should work fine with a CIToken.
      - names: SSC_USER\nSSC_PASSWORD
        desc: >-
            Required when authenticating with SSC user credentials.
      - names: SC_SAST_TOKEN
        desc: >-
            ScanCentral SAST Client Authentication Token for authenticating with ScanCentral SAST Controller. This 
            environment variable is required when running a ScanCentral SAST scan.
      - names: SSC_LOGIN_EXTRA_OPTS
        desc: >-
            Extra SSC login options, for example for disabling SSL checks or changing connection time-outs; 
            see fcliCmd:fcli ssc session login: documentation.
    preScan:
      - names: SSC_APPVERSION
        desc: >-
          Fortify SSC application version to use with this action. This should be specified as `<app-name>:<version-name>`. 
          Default value is based on repository and branch name, for example `myOrg/myRepo:myBranch`.
      - names: DO_SETUP\nSETUP_ACTION\nSETUP_EXTRA_OPTS
        desc: >-
          If `DO_SETUP` is set not set to `false`, the application and/or version will be created if they do not yet
          exist using the fcli-provided actionRef:setup-appversion#_setup_appversion action, or, if specified, the custom fcli action specified
          through `SETUP_ACTION`. Extra options for the fcli action can be passed through the `SETUP_EXTRA_OPTS` 
          environment variable.\n\nDepending on your Git workflow, it is recommended to copy state from the
          application version representing your default branch by passing the `--copy-from` option through
          `SETUP_EXTRA_OPTS`.
    scan:
      - names: DO_SAST_SCAN\nSAST_SCAN_EXTRA_OPTS
        desc: >-
          The fcli `ci` action by default runs a SAST scan, optionally in combination with other scan types.
          The `DO_SAST_SCAN` environment variable can be set to `false` to disable the SAST scan.
          The `SAST_SCAN_EXTRA_OPTS` environment variable can be used to provide additional options to
          the fcliCmd:fcli sc-sast scan start: command, for example to request a scan completion email notification.
          Note that these environment variables only control the submission of the scan request; see the
          information below for details on waiting for the scan to complete. 
      - names: DO_DEBRICKED_SCAN\nDEBRICKED_SCAN_EXTRA_OPTS\nDEBRICKED_ACCESS_TOKEN\nDEBRICKED_VERSION\nDEBRICKED_HOME
        desc: >-
          The fcli `ci` action supports running a Debricked Software Composition Analysis (SCA) scan, which
          is enabled automatically if `DEBRICKED_ACCESS_TOKEN` is provided. The `DO_DEBRICKED_SCAN` environment
          variable can be set to `false` to (temporarily) disable the Debricked scan. The `DEBRICKED_SCAN_EXTRA_OPTS`
          environment variable can be used to provide additional options to the `debricked scan` command.\nBy default:\n
          - If `DEBRICKED_HOME` is specified, the pre-installed Debricked CLI at that location will be registered
          and used, skipping automatic installation. The path should point to the installation directory or binary.\n
          - `DEBRICKED_VERSION` may be specified to request a specific Debricked CLI version to be used; if not
          already installed (through fcli or on system PATH), the requested version will be automatically downloaded and installed.\n
          - If neither `DEBRICKED_VERSION` nor `DEBRICKED_HOME` are set, the most recently installed Debricked CLI version
          will be used (either previously installed through fcli or on system PATH) if found, otherwise latest available version
          will be installed.\n
          - Tool definitions to identify available Debricked CLI versions will be downloaded from the default
          location; use `TOOL_DEFINITIONS` to use customized tool definitions.\n
          - Set `PREINSTALLED` to `true` to require that Debricked CLI is already installed, preventing tool definitions
          from being updated or Debricked CLI from being installed.\n
      - names: DO_WAIT\nDO_SAST_WAIT\nSAST_WAIT_EXTRA_OPTS\nDEBRICKED_WAIT_EXTRA_OPTS
        desc: >-
          By default, the fcli `ci` action will wait for all started scans to complete; set `DO_WAIT` to
          `false` to just kick off any configured scans without waiting for completion. Note that doing so
          will skip any post-scan tasks. The `SAST_WAIT_EXTRA_OPTS` environment variable can be used to pass
          extra options to the fcliCmd:fcli sc-sast scan wait-for: command, and similarly, the `DEBRICKED_WAIT_EXTRA_OPTS`
          environment variable can be used to pass extra options to the fcliCmd:fcli ssc artifact wait-for: command.
          Note that `DO_SAST_WAIT` is deprecated; please use `DO_WAIT` instead.
    postScan:
      - names: AVIATOR_URL\nAVIATOR_TOKEN\nAVIATOR_LOGIN_EXTRA_OPTS
        desc: >-
          Aviator URL and JWT token to use for Aviator operations (see below). The `AVIATOR_TOKEN`
          environment variable should hold the actual token contents; prefixes like `file:` or `string:`
          (like the `--token` option on the fcliCmd:fcli aviator session login: command) are not supported. The
          `AVIATOR_LOGIN_EXTRA_OPTS` environment variable can be used to pass additional options to the
          fcliCmd:fcli aviator session login: command.
      - names: DO_AVIATOR_AUDIT\nAVIATOR_APP\nAVIATOR_AUDIT_EXTRA_OPTS\nAVIATOR_WAIT_EXTRA_OPTS
        desc: >-
          If `DO_AVIATOR_AUDIT` is not set to `false`, and Aviator URL and token have been configured,
          scan results will be sent to Aviator for AI-driven auditing. The Aviator application name
          can optionally be configured through `AVIATOR_APP`, which defaults to the SSC application name.
          The `AVIATOR_AUDIT_EXTRA_OPTS` environment variable can be used to pass extra options to the
          fcliCmd:fcli aviator ssc audit: command, for example to adjust tag mappings. The `AVIATOR_WAIT_EXTRA_OPTS`
          environment variable can be used to pass extra options to the fcliCmd:fcli ssc artifact wait-for: command,
          which will be run to wait for SSC to process the audited results.
      - names: DO_APPVERSION_SUMMARY\nAPPVERSION_SUMMARY_ACTION\nAPPVERSION_SUMMARY_EXTRA_OPTS
        desc: >-
          If `DO_APPVERSION_SUMMARY` is not set to `false`, an application version summary will be generated using the
          fcli-provided actionRef:appversion-summary#_appversion_summary action or, if specified, the custom fcli action specified through
          `APPVERSION_SUMMARY_ACTION`. Extra options for the fcli action can be specified through the
          `APPVERSION_SUMMARY_EXTRA_OPTS` environment variable, which may include fcli options to allow
          unsigned custom actions to be used.
      - names: DO_CHECK_POLICY\nCHECK_POLICY_ACTION\nCHECK_POLICY_EXTRA_OPTS
        desc: >-
          If `DO_CHECK_POLICY` is set to true (implied if any of the other two `CHECK_POLICY_*` variables
          are set), a policy check will be run after scan completion using the fcli-provided
          actionRef:check-policy#_check_policy action or, if specified, the custom fcli action specified through
          `CHECK_POLICY_ACTION`. Extra options for a custom fcli action can be passed through the
          `CHECK_POLICY_EXTRA_OPTS` environment variable, which may include fcli options to allow
          unsigned custom actions to be used.
      - names: DO_PR_COMMENT\nPR_COMMENT_ACTION\nPR_COMMENT_EXTRA_OPTS
        desc: >-
          (PREVIEW) If `DO_PR_COMMENT` is set to true (implied if any of the other two `PR_COMMENT_*` variables
          are set), a Pull Request or Merge Request comment will be generated using an fcli-provided action
          matching the current CI system like actionRef:github-pr-comment#_github_pr_comment or, if specified, the custom fcli action
          specified through `PR_COMMENT_ACTION`. Extra options for the fcli action can be specified through
          the `PR_COMMENT_EXTRA_OPTS` environment variable, which may include fcli options to allow unsigned
          custom actions to be used.
      - names: DO_SAST_EXPORT\nSAST_EXPORT_ACTION\nSAST_EXPORT_EXTRA_OPTS
        desc: >-
          If `DO_SAST_EXPORT` is not set to `false` and a SAST scan was completed, the SAST vulnerability
          data will be exported into a CI-specific format using an fcli-provided action matching the current
          CI system like actionRef:github-sast-report#_github_sast_report or actionRef:gitlab-sast-report#_gitlab_sast_report, or, if specified, the custom fcli action
          specified through `SAST_EXPORT_ACTION`. Extra options for the fcli action can be specified through the
          `SAST_EXPORT_EXTRA_OPTS` environment variable, which may include fcli options to allow unsigned custom
          actions to be used.
      - names: DO_DEBRICKED_EXPORT\nDEBRICKED_EXPORT_ACTION\nDEBRICKED_EXPORT_EXTRA_OPTS
        desc: >-
          If `DO_DEBRICKED_EXPORT` is not set to `false` and a Debricked scan was completed, the Debricked vulnerability
          data will be exported into a CI-specific format using an fcli-provided action matching the current
          CI system like actionRef:gitlab-debricked-report#_gitlab_debricked_report, or, if specified, the custom fcli action
          specified through `DEBRICKED_EXPORT_ACTION`. Extra options for the fcli action can be specified through the
          `DEBRICKED_EXPORT_EXTRA_OPTS` environment variable, which may include fcli options to allow unsigned custom
          actions to be used.
  
  commonEnvVars:
    package:
      - names: PACKAGE_ACTION\nPACKAGE_ACTION_EXTRA_OPTS
        desc: >- 
          By default, when running a SAST scan, the fcli actionRef:package#_package action is used to (optionally) package the source code
          to be scanned; see next entry for information on how to configure the default actionRef:package#_package action. If the standard
          fcli actionRef:package#_package action doesn't meet your needs, for example if you want to perform a local translation using
          Fortify Static Code Analyzer, you can use `PACKAGE_ACTION` to use a custom action for packaging, optionally
          providing extra options to this custom action through the `PACKAGE_ACTION_EXTRA_OPTS` environment variable.
          Note that any custom action must set the `global.package.output` action variable, pointing to the package or
          MBS file to be scanned.
      - names: USE_PACKAGE\nPACKAGE_EXTRA_OPTS\nSC_CLIENT_VERSION\nSC_CLIENT_HOME\nSOURCE_DIR\nTOOL_DEFINITIONS
        desc: >-
          These environment variables define packaging behavior. If `USE_PACKAGE` is specified, packaging will be skipped
          and the given package or MBS file (which must already exist) will be used. To pass additional options to the
          `scancentral package` command like `-bt` or `-bf`, use `PACKAGE_EXTRA_OPTS`.\nBy default:\n
          - If `SC_CLIENT_HOME` is specified, the pre-installed ScanCentral Client at that location will be registered
          and used, skipping automatic installation. The path should point to the installation directory or binary.\n
          - `SC_CLIENT_VERSION` may be specified to request a specific ScanCentral Client version to be used; if not
          already installed (through fcli or on system PATH), the requested version will be automatically downloaded and installed.\n
          - If neither `SC_CLIENT_VERSION` nor `SC_CLIENT_HOME` are set, the most recently installed ScanCentral Client version
          will be used (either previously installed through fcli or on system PATH) if found, otherwise latest available version
          will be installed.\n
          - Current working directory will be packaged; use `SOURCE_DIR` to package a different directory.\n
          - Debug logging for Scancentral Client is disabled; pass --debug on the fcli invocation to enable debug logging.\n
          - Tool definitions to identify available ScanCentral Client versions will be downloaded from the default
          location; use `TOOL_DEFINITIONS` to use customized tool definitions.\n
          - Set `PREINSTALLED` to `true` to require that ScanCentral Client is already installed, preventing tool definitions
          from being updated or ScanCentral Client from being installed.\n
  
  fortifySetup21xEnvVars:
    - names: FCLI_BOOTSTRAP_VERSION
      desc: >-
        Fcli version to bootstrap (e.g., 'v3', 'v3.14', 'v3.14.1', or without 'v' prefix: '3.14.1').
        When set to a full major.minor.patch version, GitHub Actions will use RUNNER_TOOL_CACHE for
        persistent caching across workflow runs. Partial versions (e.g., 'v3') or unset will use
        RUNNER_TEMP for job-specific temporary storage. Ignored if FCLI_BOOTSTRAP_URL is set.
    - names: FCLI_BOOTSTRAP_PATH
      desc: >-
        Path to a pre-installed fcli executable. When set, fcli bootstrapping will use this binary instead
        of downloading fcli. The specified fcli must be version 3.14.0 or later. This allows CI integrations
        to control which fcli version is used and skip the download/verification process.
    - names: FCLI_BOOTSTRAP_URL
      desc: >-
        Custom URL for downloading the fcli archive. When set, this overrides FCLI_BOOTSTRAP_VERSION and
        the default GitHub release URL. Useful for air-gapped environments or internal mirrors. The URL
        should point to a platform-specific fcli archive (e.g., `fcli-linux.tgz`, `fcli-windows.zip`,
        `fcli-mac.tgz`).
    - names: FCLI_BOOTSTRAP_RSA_SHA256_URL
      desc: >-
        Custom URL for the fcli RSA SHA256 signature file. When set, this overrides the default signature
        URL (which is `FCLI_BOOTSTRAP_URL` + `.rsa_sha256`). Required when using a custom `FCLI_BOOTSTRAP_URL`
        with signature verification enabled.
    - names: FCLI_BOOTSTRAP_VERIFY_SIGNATURE
      desc: >-
        Controls whether RSA SHA256 signature verification is performed when downloading fcli. Set to `false`
        to skip verification (not recommended). By default, signature verification is enabled to ensure
        the downloaded fcli binary has not been tampered with.
  
  fcliBootstrapEnvVars:
    - names: TOOL_DEFINITIONS
      desc: >-
        URL or file path to custom tool definitions YAML file. This fcli environment variable controls
        where fcli retrieves tool version information for ScanCentral Client, Debricked CLI, and other
        tools. Useful for air-gapped environments or when using custom tool repositories. When set,
        fcli will use the specified tool definitions instead of downloading from the default GitHub location.
