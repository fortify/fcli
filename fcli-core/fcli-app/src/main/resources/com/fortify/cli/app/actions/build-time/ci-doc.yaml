# yaml-language-server: $schema=https://fortify.github.io/fcli/schemas/action/fcli-action-schema-dev-2.x.json

author: Fortify
usage:
  header: Generate CI documentation
  description: |
    Generate CI/CD integration documentation including environment variable
    references and usage guides.

config:
  output: immediate
  mcp: exclude
  
cli.options:
  outputDir:
    names: "-d"
    description: Required output directory
  
steps:
  # Load all definition objects from formatters section into variables
  # These contain environment variable definitions for different products and CI systems
  - var.set:
      fodDefinitions: {fmt: fodDefinitions}
      sscDefinitions: {fmt: sscDefinitions}
      commonDefinitions: {fmt: commonDefinitions}
      fortifySetupDefinitions: {fmt: fortifySetupDefinitions}
      ciSystemDefinitions: {fmt: ciSystemDefinitions}
      fcliToolBootstrapEnvVars: {fmt: fcliToolBootstrapEnvVars}
  # ============================================================================
  # STEP 1: Generate Bootstrap Fragments (version-specific)
  # ============================================================================
  # Creates bootstrap-v{version}.txt/adoc files for each @fortify/setup version
  # Each fragment includes:
  #   - @fortify/setup-specific env vars (FCLI_PATH, FCLI_URL, FCLI_VERIFY_SIGNATURE, etc.)
  #   - fcli-specific env vars (TOOL_DEFINITIONS - applies to all versions)
  # Example outputs: bootstrap-v1.0.x.txt, bootstrap-v1.0.x.adoc
  # NOTE: When adding a new @fortify/setup version, add its key to the array below AND define it in fortifySetupDefinitions
  - records.for-each:
      from: ${{'fortify-setup-2.1.x'}}
      record.var-name: bootstrapKey
      do:
      # Reset AsciiDoc cell accumulator for this bootstrap version
      - var.rm:
          - asciiDocCells
      # Load bootstrap definition and extract version + env vars
      - var.set:
          bootstrapDef: ${fortifySetupDefinitions[bootstrapKey]}
          fortifySetupVersion: ${bootstrapKey.replaceAll('fortify-setup-', '')}
          bootstrapEnvVars: ${fortifySetupDefinitions[bootstrapKey].envVars}
      # Generate table containing both @fortify/setup and fcli env vars
      - with:
          writers:
            tableWriter:
              to: var:textTable
              type: table
              style: border
          do:
          # Process @fortify/setup-specific env vars (version-dependent)
          - records.for-each:
              from: ${bootstrapEnvVars}
              record.var-name: envVar 
              do:
              - writer.append:
                  tableWriter: {fmt: textCell}
              - var.set:
                  asciiDocCells..: {fmt: asciiDocCell}
          # Process fcli-specific env vars (applies to all @fortify/setup versions)
          - records.for-each:
              from: ${fcliToolBootstrapEnvVars}
              record.var-name: envVar
              do:
              - writer.append:
                  tableWriter: {fmt: textCell}
              - var.set:
                  asciiDocCells..: {fmt: asciiDocCell}
      # Write version-specific bootstrap fragment files
      - out.write:
          ${cli.outputDir}/bootstrap-v${fortifySetupVersion}.txt: {fmt: bootstrapTextTable}
          ${cli.outputDir}/bootstrap-v${fortifySetupVersion}.adoc: {fmt: bootstrapAsciiDocTable}
  # ============================================================================
  # STEP 2: Generate Session Fragments (product-specific)
  # ============================================================================
  # Creates session-{product}.txt/adoc files for each Fortify product
  # Contains authentication and connection configuration env vars
  # Example outputs: session-fod.txt/adoc, session-ssc.txt/adoc
  - records.for-each:
      from: ${{'fod', 'ssc'}} 
      record.var-name: module
      do:
      # Reset AsciiDoc cell accumulator for this product
      - var.rm:
          - asciiDocCells
      # Load product-specific definitions and extract session env vars
      - var.set:
          asciiDocActionUrl: ${module}-actions.html
          definitions: ${module=='fod'?fodDefinitions:sscDefinitions}
          sessionEnvVars: ${definitions.session}
      # Generate table containing session configuration env vars
      - with:
          writers:
            tableWriter:
              to: var:textTable
              type: table
              style: border
          do:
          - records.for-each:
              from: ${sessionEnvVars}
              record.var-name: envVar 
              do:
              - writer.append:
                  tableWriter: {fmt: textCell}
              - var.set:
                  asciiDocCells..: {fmt: asciiDocCell}
      # Write product-specific session fragment files
      - out.write:
          ${cli.outputDir}/session-${module}.txt: {fmt: textTable}
          ${cli.outputDir}/session-${module}.adoc: {fmt: asciiDocTable}
  # ============================================================================
  # STEP 3: Generate CI Integration Core Fragments (product-specific)
  # ============================================================================
  # Creates ci-core-{product}.txt/adoc files with CI integration env vars
  # Text output: Single table with all env vars
  # AsciiDoc output: Multi-section table organized by workflow phase:
  #   - FoD: Release Configuration, Packaging, Scan, Post-Scan
  #   - SSC: Application Version Configuration, Packaging, Scan, Post-Scan
  # Example outputs: ci-core-fod.txt/adoc, ci-core-ssc.txt/adoc
  - records.for-each:
      from: ${{'fod', 'ssc'}} 
      record.var-name: module
      do:
      # Reset accumulators for this product
      - var.rm:
          - asciiDocCells
          - asciiDocSections
      # Prepare environment variable sections and titles for this product
      # Sections organize env vars by workflow phase (pre-scan, package, scan, post-scan)
      - var.set:
          asciiDocActionUrl: ${module}-actions.html
          definitions: ${module=='fod'?fodDefinitions:sscDefinitions}
          ciEnvVarSections: ${{definitions.preScan, commonDefinitions.package, definitions.scan, definitions.postScan}}
          section0Title: ${module=='fod'?'Release Configuration':'Application Version Configuration'}
          section1Title: Packaging Configuration
          section2Title: Scan Configuration
          section3Title: Post-Scan Configuration
      # Generate text output: Single flat table containing all CI env vars
      - with:
          writers:
            tableWriter:
              to: var:textTable
              type: table
              style: border
          do:
          # Iterate through all sections and their env vars
          - records.for-each:
              from: ${ciEnvVarSections}
              record.var-name: envVars
              do:
              - records.for-each:
                  from: ${envVars}
                  record.var-name: envVar 
                  do:
                    - writer.append:
                        tableWriter: {fmt: textCell}
      # Generate AsciiDoc output: Section 0 (Release/AppVersion Configuration)
      - var.rm:
          - asciiDocCells
      - var.set:
          sectionTitle: "${section0Title}"
      - records.for-each:
          from: ${ciEnvVarSections[0]}
          record.var-name: envVar
          do:
          - var.set:
              asciiDocCells..: {fmt: asciiDocCell}
      - var.set:
          asciiDocSections..: {fmt: asciiDocSection}
      # Generate AsciiDoc output: Section 1 (Packaging Configuration)
      - var.rm:
          - asciiDocCells
      - var.set:
          sectionTitle: "${section1Title}"
      - records.for-each:
          from: ${ciEnvVarSections[1]}
          record.var-name: envVar
          do:
          - var.set:
              asciiDocCells..: {fmt: asciiDocCell}
      - var.set:
          asciiDocSections..: {fmt: asciiDocSection}
      # Generate AsciiDoc output: Section 2 (Scan Configuration)
      - var.rm:
          - asciiDocCells
      - var.set:
          sectionTitle: "${section2Title}"
      - records.for-each:
          from: ${ciEnvVarSections[2]}
          record.var-name: envVar
          do:
          - var.set:
              asciiDocCells..: {fmt: asciiDocCell}
      - var.set:
          asciiDocSections..: {fmt: asciiDocSection}
      # Generate AsciiDoc output: Section 3 (Post-Scan Configuration)
      - var.rm:
          - asciiDocCells
      - var.set:
          sectionTitle: "${section3Title}"
      - records.for-each:
          from: ${ciEnvVarSections[3]}
          record.var-name: envVar
          do:
          - var.set:
              asciiDocCells..: {fmt: asciiDocCell}
      - var.set:
          asciiDocSections..: {fmt: asciiDocSection}
      # Write product-specific CI core fragment files
      - out.write:
          ${cli.outputDir}/ci-core-${module}.txt: {fmt: textTable}
          ${cli.outputDir}/ci-core-${module}.adoc: {fmt: asciiDocMultiSectionTable}
  # ============================================================================
  # STEP 4: Generate CI-Specific Versioned Documentation (complete guides)
  # ============================================================================
  # Creates complete CI integration guides for each CI system version
  # Each guide includes:
  #   - Version information table (fcli + @fortify/setup + CI action versions)
  #   - Bootstrap configuration (env vars specific to that @fortify/setup version)
  #   - Session configuration (FoD/SSC authentication - CI docs only)
  #   - CI Integration sections (current fcli version's `ci` action env vars - CI docs only)
  #
  # Generates three types of documents per CI system version:
  #   1. {ciSystem}-setup-v{version}.adoc - Bootstrap env vars only (product-independent)
  #   2. {ciSystem}-ci-fod-v{version}.adoc - Complete FoD CI integration guide
  #   3. {ciSystem}-ci-ssc-v{version}.adoc - Complete SSC CI integration guide
  #
  # Example outputs for github-3.0.x:
  #   - github-setup-v3.0.x.adoc
  #   - github-ci-fod-v3.0.x.adoc
  #   - github-ci-ssc-v3.0.x.adoc
  #
  # NOTE: Documents to generate are auto-detected from ciSystemDefinitions keys.
  # To add a new CI system/version, just add its definition to ciSystemDefinitions below.
  - records.for-each:
      from: ${#properties(ciSystemDefinitions)}
      record.var-name: ciSystemEntry
      do:
      # Extract CI system key (e.g., 'github-3.0.x') and definition from the property entry
      - var.set:
          ciSystemKey: ${ciSystemEntry.key}
          ciSystemDef: ${ciSystemEntry.value}
          ciVersion: ${ciSystemEntry.key.replaceAll('.*-', '')}  # Extract '3.0.x' from 'github-3.0.x'
          ciSystem: ${ciSystemEntry.key.replaceAll('-.*', '')}  # Extract 'github' from 'github-3.0.x'
          bootstrapKey: ${'fortify-setup-'+ciSystemEntry.value['fortify-setup-version']}
          bootstrapDef: ${fortifySetupDefinitions['fortify-setup-'+ciSystemEntry.value['fortify-setup-version']]}
      
      # ----------------------------------------------------------------------------
      # Generate {ciSystem}-setup-v{version}.adoc (product-independent)
      # Contains only bootstrap configuration (@fortify/setup + fcli env vars)
      # ----------------------------------------------------------------------------
      - var.rm:
          - bootstrapEnvVarCells
          - fcliEnvVarCells
      # Build bootstrap env var cells
      - records.for-each:
          from: ${bootstrapDef.envVars}
          record.var-name: envVar
          do:
          - var.set:
              bootstrapEnvVarCells..: {fmt: asciiDocCell}
      # Build fcli env var cells
      - records.for-each:
          from: ${fcliToolBootstrapEnvVars}
          record.var-name: envVar
          do:
          - var.set:
              fcliEnvVarCells..: {fmt: asciiDocCell}
      # Write setup document
      - out.write:
          ${cli.outputDir}/${ciSystem}-setup-v${ciVersion}.adoc: {fmt: ciSystemSetupDoc}
      
      # ----------------------------------------------------------------------------
      # Generate {ciSystem}-ci-{product}-v{version}.adoc for FoD and SSC
      # Contains complete CI integration guide (bootstrap + session + CI sections)
      # ----------------------------------------------------------------------------
      - records.for-each:
          from: ${{'fod', 'ssc'}}
          record.var-name: module
          do:
          # Reset cell accumulators for this document
          - var.rm:
              - bootstrapEnvVarCells
              - fcliEnvVarCells
              - sessionEnvVarCells
              - preScanEnvVarCells
              - packageEnvVarCells
              - scanEnvVarCells
              - postScanEnvVarCells
          - var.set:
              definitions: ${module=='fod'?fodDefinitions:sscDefinitions}
              asciiDocActionUrl: ${module}-actions.html
          # Build bootstrap env var cells
          - records.for-each:
              from: ${bootstrapDef.envVars}
              record.var-name: envVar
              do:
              - var.set:
                  bootstrapEnvVarCells..: {fmt: asciiDocCell}
          # Build fcli env var cells
          - records.for-each:
              from: ${fcliToolBootstrapEnvVars}
              record.var-name: envVar
              do:
              - var.set:
                  fcliEnvVarCells..: {fmt: asciiDocCell}
          # Build session env var cells
          - records.for-each:
              from: ${definitions.session}
              record.var-name: envVar
              do:
              - var.set:
                  sessionEnvVarCells..: {fmt: asciiDocCell}
          # Build pre-scan env var cells
          - records.for-each:
              from: ${definitions.preScan}
              record.var-name: envVar
              do:
              - var.set:
                  preScanEnvVarCells..: {fmt: asciiDocCell}
          # Build package env var cells
          - records.for-each:
              from: ${commonDefinitions.package}
              record.var-name: envVar
              do:
              - var.set:
                  packageEnvVarCells..: {fmt: asciiDocCell}
          # Build scan env var cells
          - records.for-each:
              from: ${definitions.scan}
              record.var-name: envVar
              do:
              - var.set:
                  scanEnvVarCells..: {fmt: asciiDocCell}
          # Build post-scan env var cells
          - records.for-each:
              from: ${definitions.postScan}
              record.var-name: envVar
              do:
              - var.set:
                  postScanEnvVarCells..: {fmt: asciiDocCell}
          # Write complete CI integration guide
          - out.write:
              ${cli.outputDir}/${ciSystem}-ci-${module}-v${ciVersion}.adoc: {fmt: ciSystemFullDoc}
          
formatters:
  # ============================================================================
  # BASE FORMATTERS - Text and AsciiDoc Table Formatting
  # ============================================================================
  
  # Format bootstrap fragment as plain text table with explanatory footer
  # Used for: bootstrap-v{version}.txt files
  # TODO: realNode references should ideally be fixed in action framework
  bootstrapTextTable: |
    ${textTable}
    
    * These variables are typically set by CI/CD bootstrapping tools like `@fortify/cli-action` (GitHub Actions)
      or similar CI-specific integrations. When using fcli directly, these are not required.
  
  # Format bootstrap fragment as AsciiDoc table with explanatory note
  # Used for: bootstrap-v{version}.adoc files
  bootstrapAsciiDocTable: |
    [%autowidth]
    |===
    |Environment Variable|Description 
    
    ${#join("", asciiDocCells)}
    |===
    
    NOTE: These variables are typically set by CI/CD bootstrapping tools like `@fortify/cli-action` (GitHub Actions)
    or similar CI-specific integrations. When using fcli directly, these are not required.
  
  # Combine multiple AsciiDoc sections into a single document
  # Used for: ci-core-{product}.adoc files (multi-section tables)
  asciiDocMultiSectionTable: |
    ${#join("\n\n", asciiDocSections)}
  
  # Format a single AsciiDoc section with title and table
  # Used by: ci-core fragment generation (one section per workflow phase)
  asciiDocSection: |
    ==== ${sectionTitle}
    
    [%autowidth]
    |===
    |Environment Variable|Description 
    
    ${#join("", asciiDocCells)}
    |===
  
  # Format plain text table with product-specific action reference note
  # Used for: session-{product}.txt and ci-core-{product}.txt files
  textTable: |
    ${textTable}
    
    * Any fcli action references in this table refer to actions in the `fcli ${module}` module; please see
      `fcli ${module} action help <action-name>` for more information.
  
  # Format a single table cell for plain text output
  # Handles realNode wrapper and converts action references to backtick format
  textCell:
    Environment Variable: ${(envVar.realNode==null?envVar:envVar.realNode).names}
    Description: ${(envVar.realNode==null?envVar:envVar.realNode).desc.replaceAll('actionRef:([\w-_]+)(#[\w-_]+)', '`$1`')}
  
  # Format a simple AsciiDoc table (without multi-section support)
  # Used for: session-{product}.adoc files
  asciiDocTable: |
    [%autowidth]
    |===
    |Environment Variable|Description 
    
    ${#join("", asciiDocCells)}
    |===
  
  # Format a single AsciiDoc table cell with line breaks and action links
  # Handles realNode wrapper, preserves line breaks, converts action references to links
  asciiDocCell: |
    |${(envVar.realNode==null?envVar:envVar.realNode).names.replaceAll('\n', ' +\\n')}
    |${(envVar.realNode==null?envVar:envVar.realNode).desc.replaceAll('\n', ' +\\n').replaceAll('actionRef:([\w-_]+)(#[\w-_]+)', 'link:'+asciiDocActionUrl+'$2[$1]')}
    
  # ============================================================================
  # COMPLETE CI INTEGRATION GUIDE FORMATTER
  # ============================================================================
  # Generates a complete AsciiDoc document for a specific CI system version + product
  # Used for: {ciSystem}-ci-{product}-v{version}.adoc files (e.g., github-ci-fod-v3.0.x.adoc)
  # Includes: Version table, bootstrap config, session config, CI integration sections
  ciSystemFullDoc: |
    = ${module=='fod'?'Fortify on Demand':'Software Security Center'} CI Integration - ${#capitalize(ciSystem)} Actions v${ciVersion}
    :fcli-version: ${#fcliBuildProperties().fcliVersion}
    :fortify-setup-version: ${ciSystemDef['fortify-setup-version']}
    :ci-action-version: ${ciVersion}
    :generation-date: ${#formatDateTime('yyyy-MM-dd')}
    :toc: left
    :toclevels: 3
    
    [discrete]
    == Version Information
    
    [%autowidth]
    |===
    |Component|Version
    
    |fcli|{fcli-version}
    |@fortify/setup|{fortify-setup-version}
    |${#capitalize(ciSystem)} Action|{ci-action-version}
    |Generated|{generation-date}
    |===
    
    NOTE: ${ciSystemDef.notes}
    
    [discrete]
    == Bootstrap Configuration
    
    These environment variables control how @fortify/setup bootstraps fcli and how fcli locates tool definitions.
    They are typically set in your CI workflow configuration file.
    
    [discrete]
    === @fortify/setup Environment Variables
    
    Configured by @fortify/setup ${ciSystemDef['fortify-setup-version']} to control fcli download and verification.
    
    [%autowidth]
    |===
    |Environment Variable|Description
    ${#join("", bootstrapEnvVarCells)}
    |===
    
    [discrete]
    === fcli Environment Variables
    
    These fcli-specific variables work with all @fortify/setup versions and control fcli behavior.
    
    [%autowidth]
    |===
    |Environment Variable|Description
    ${#join("", fcliEnvVarCells)}
    |===
    
    [discrete]
    == Session Configuration
    
    Configure authentication and connection details for ${module=='fod'?'Fortify on Demand':'Software Security Center'}.
    
    [%autowidth]
    |===
    |Environment Variable|Description
    ${#join("", sessionEnvVarCells)}
    |===
    
    [discrete]
    == CI Integration
    
    Environment variables for controlling scan behavior and post-scan actions.
    
    ==== ${module=='fod'?'Release Configuration':'Application Version Configuration'}
    
    [%autowidth]
    |===
    |Environment Variable|Description
    ${#join("", preScanEnvVarCells)}
    |===
    
    ==== Packaging Configuration
    
    [%autowidth]
    |===
    |Environment Variable|Description
    ${#join("", packageEnvVarCells)}
    |===
    
    ==== Scan Configuration
    
    [%autowidth]
    |===
    |Environment Variable|Description
    ${#join("", scanEnvVarCells)}
    |===
    
    ==== Post-Scan Configuration
    
    [%autowidth]
    |===
    |Environment Variable|Description
    ${#join("", postScanEnvVarCells)}
    |===
  
  # ============================================================================
  # SETUP GUIDE FORMATTER (Product-Independent)
  # ============================================================================
  # Generates a setup-only AsciiDoc document for a specific CI system version
  # Used for: {ciSystem}-setup-v{version}.adoc files (e.g., github-setup-v3.0.x.adoc)
  # Includes: Version table, bootstrap configuration only (no product-specific content)
  # This document applies to both FoD and SSC as it contains only @fortify/setup env vars
  ciSystemSetupDoc: |
    = ${#capitalize(ciSystem)} Action Setup - ${#capitalize(ciSystem)} Actions v${ciVersion}
    :fcli-version: ${#fcliBuildProperties().fcliVersion}
    :fortify-setup-version: ${ciSystemDef['fortify-setup-version']}
    :ci-action-version: ${ciVersion}
    :generation-date: ${#formatDateTime('yyyy-MM-dd')}
    :toc: left
    :toclevels: 3
    
    [discrete]
    == Version Information
    
    [%autowidth]
    |===
    |Component|Version
    
    |fcli|{fcli-version}
    |@fortify/setup|{fortify-setup-version}
    |${#capitalize(ciSystem)} Action|{ci-action-version}
    |Generated|{generation-date}
    |===
    
    NOTE: ${ciSystemDef.notes}
    
    [discrete]
    == Bootstrap Configuration
    
    These environment variables control how @fortify/setup bootstraps fcli and how fcli locates tool definitions.
    They are typically set in your CI workflow configuration file and apply to both Fortify on Demand (FoD)
    and Software Security Center (SSC) integrations.
    
    [discrete]
    === @fortify/setup Environment Variables
    
    Configured by @fortify/setup ${ciSystemDef['fortify-setup-version']} to control fcli download and verification.
    
    [%autowidth]
    |===
    |Environment Variable|Description
    ${#join("", bootstrapEnvVarCells)}
    |===
    
    [discrete]
    === fcli Environment Variables
    
    These fcli-specific variables work with all @fortify/setup versions and control fcli behavior.
    
    [%autowidth]
    |===
    |Environment Variable|Description
    ${#join("", fcliEnvVarCells)}
    |===
  
  # ============================================================================
  # ENVIRONMENT VARIABLE DEFINITIONS - Fortify on Demand (FoD)
  # ============================================================================
  # Contains all FoD-specific environment variable definitions organized by workflow phase
  fodDefinitions:
    commonEnvVarProperties:
    session:
      - names: FOD_URL
        desc: >-  
          Fortify on Demand URL, for example `https://ams.fortify.com`. This must be rendered by the CI/CD system
          as plain text, not as a masked secret/variable.
      - names: FOD_CLIENT_ID\nFOD_CLIENT_SECRET
        desc: >-
          Required when authenticating with an API key: Fortify on Demand Client ID (API key) and Secret (API secret).
      - names: FOD_TENANT\nFOD_USER\nFOD_PASSWORD
        desc: >-
          Required when authenticating with user credentials: Fortify on Demand tenant, user and password. It is
          recommended to use a Personal Access Token instead of an actual user password.
      - names: FOD_LOGIN_EXTRA_OPTS
        desc: >-
          Extra login options, for example for disabling SSL checks or changing connection time-outs; see 
          `fcli fod session login` documentation.
    # Pre-scan configuration: Release setup and preparation
    preScan:
      - names: FOD_RELEASE
        desc: >-
          Fortify on Demand release to use with this action. This should be specified as `<app-name>:<release-name>`
          (for non-microservices applications) or `<app-name>:<microservice-name>:<release-name>` (for microservices 
          applications). Default value is based on repository and branch name, for example `myOrg/myRepo:myBranch`.
          Note that you'll need to explicitly configure `FOD_RELEASE` for microservices applications, as the default
          value lacks a microservice name.
      - names: DO_SETUP\nSETUP_ACTION\nSETUP_EXTRA_OPTS
        desc: >-
          If `DO_SETUP` is set not set to `false`, the application and/or release will be created if they do not
          yet exist, and static scan settings will be configured if not configured already, using the
          fcli-provided actionRef:setup-release#_setup_release action, or, if specified, the custom fcli action specified through
          `SETUP_ACTION`. Extra options for the fcli action can be passed through the `SETUP_EXTRA_OPTS`
          environment variable.\n\nDepending on your Git workflow, it is recommended to copy state from the
          release representing your default branch by passing the `--copy-from` option through
          `SETUP_EXTRA_OPTS`. To allow this action to create new applications, depending on FoD version,
          you may (also) need to provide the `--app-owner <user id or name>` option through `SETUP_EXTRA_OPTS`.
    # Scan configuration: SAST scan submission and wait behavior
    scan:
      - names: DO_SAST_SCAN\nSAST_SCAN_EXTRA_OPTS
        desc: >-
          The fcli `ci` action currently only supports running a SAST scan, which is enabled by default.
          The `SAST_SCAN_EXTRA_OPTS` environment variable can be used to provide additional options to the
          `fcli fod sast-scan start` command, for example to specify scan notes. Note that these environment
          variables only control the submission of the scan request; see the information below for details
          on waiting for the scan to complete.
      - names: DO_WAIT\nDO_SAST_WAIT\nSAST_WAIT_EXTRA_OPTS
        desc: >-
          By default, the fcli `ci` action will wait for all started scans to complete; set `DO_WAIT` to
          `false` to just kick off any configured scans without waiting for completion. Note that doing so
          will skip any post-scan tasks. The `SAST_WAIT_EXTRA_OPTS` environment variable can be used to pass
          extra options to the `fcli fod sast-scan wait-for` command. Note that `DO_SAST_WAIT` is deprecated; 
          please use `DO_WAIT` instead.
    # Post-scan configuration: Summary, policy checks, PR comments, exports
    postScan:
      - names: DO_RELEASE_SUMMARY\nRELEASE_SUMMARY_ACTION\nRELEASE_SUMMARY_EXTRA_OPTS
        desc: >-
          If `DO_RELEASE_SUMMARY` is not set to `false`, a release summary will be generated using the
          fcli-provided actionRef:release-summary#_release_summary action or, if specified, the custom fcli action specified through
          `RELEASE_SUMMARY_ACTION`. Extra options for the fcli action can be specified through the
          `RELEASE_SUMMARY_EXTRA_OPTS` environment variable, which may include fcli options to allow
          unsigned custom actions to be used.
      - names: DO_CHECK_POLICY\nCHECK_POLICY_ACTION\nCHECK_POLICY_EXTRA_OPTS
        desc: >-
          If `DO_CHECK_POLICY` is set to true (implied if any of the other two `CHECK_POLICY_*` variables
          are set), a policy check will be run after scan completion using the fcli-provided
          actionRef:check-policy#_check_policy action or, if specified, the custom fcli action specified through
          `CHECK_POLICY_ACTION`. Extra options for a custom fcli action can be passed through the
          `CHECK_POLICY_EXTRA_OPTS` environment variable, which may include fcli options to allow
          unsigned custom actions to be used.
      - names: DO_PR_COMMENT\nPR_COMMENT_ACTION\nPR_COMMENT_EXTRA_OPTS
        desc: >-
          (PREVIEW) If `DO_PR_COMMENT` is set to true (implied if any of the other two `PR_COMMENT_*` variables
          are set), a Pull Request or Merge Request comment will be generated using an fcli-provided action
          matching the current CI system like actionRef:github-pr-comment#_github_pr_comment or, if specified, the custom fcli action
          specified through `PR_COMMENT_ACTION`. Extra options for the fcli action can be specified through
          the `PR_COMMENT_EXTRA_OPTS` environment variable, which may include fcli options to allow unsigned
          custom actions to be used.
      - names: DO_SAST_EXPORT\nSAST_EXPORT_ACTION\nSAST_EXPORT_EXTRA_OPTS
        desc: >-
          If `DO_SAST_EXPORT` is not set to `false` and a SAST scan was completed, the SAST vulnerability
          data will be exported into a CI-specific format using an fcli-provided action matching the current
          CI system like actionRef:github-sast-report#_github_sast_report or actionRef:gitlab-sast-report#_gitlab_sast_report, or, if specified, the custom fcli action
          specified through `SAST_EXPORT_ACTION`. Extra options for the fcli action can be specified through the
          `SAST_EXPORT_EXTRA_OPTS` environment variable, which may include fcli options to allow unsigned custom
          actions to be used.
          
  # ============================================================================
  # ENVIRONMENT VARIABLE DEFINITIONS - Software Security Center (SSC)
  # ============================================================================
  # Contains all SSC-specific environment variable definitions organized by workflow phase
  sscDefinitions:
    # Session configuration: SSC authentication and connection settings
    session:
      - names: SSC_URL
        desc: >-
            Software Security Center (SSC) URL, for example `https://ssc.customer.fortifyhosted.net/`. This must be 
            rendered by the CI/CD system as plain text, not as a masked secret/variable.
      - names: SSC_TOKEN
        desc: >-
            Required when authenticating with an SSC token (recommended). Most actions should work fine with a CIToken.
      - names: SSC_USER\nSSC_PASSWORD
        desc: >-
            Required when authenticating with SSC user credentials.
      - names: SC_SAST_TOKEN
        desc: >-
            ScanCentral SAST Client Authentication Token for authenticating with ScanCentral SAST Controller. This 
            environment variable is required when running a ScanCentral SAST scan.
      - names: SSC_LOGIN_EXTRA_OPTS
        desc: >-
            Extra SSC login options, for example for disabling SSL checks or changing connection time-outs; 
            see `fcli ssc session login` documentation.
    # Pre-scan configuration: Application version setup and preparation
    preScan:
      - names: SSC_APPVERSION
        desc: >-
          Fortify SSC application version to use with this action. This should be specified as `<app-name>:<version-name>`. 
          Default value is based on repository and branch name, for example `myOrg/myRepo:myBranch`.
      - names: DO_SETUP\nSETUP_ACTION\nSETUP_EXTRA_OPTS
        desc: >-
          If `DO_SETUP` is set not set to `false`, the application and/or version will be created if they do not yet
          exist using the fcli-provided actionRef:setup-appversion#_setup_appversion action, or, if specified, the custom fcli action specified
          through `SETUP_ACTION`. Extra options for the fcli action can be passed through the `SETUP_EXTRA_OPTS` 
          environment variable.\n\nDepending on your Git workflow, it is recommended to copy state from the
          application version representing your default branch by passing the `--copy-from` option through
          `SETUP_EXTRA_OPTS`.
    # Scan configuration: SAST and Debricked scan submission and wait behavior
    scan:
      - names: DO_SAST_SCAN\nSAST_SCAN_EXTRA_OPTS
        desc: >-
          The fcli `ci` action by default runs a SAST scan, optionally in combination with other scan types.
          The `DO_SAST_SCAN` environment variable can be set to `false` to disable the SAST scan.
          The `SAST_SCAN_EXTRA_OPTS` environment variable can be used to provide additional options to
          the `fcli sc-sast scan start` command, for example to request a scan completion email notification.
          Note that these environment variables only control the submission of the scan request; see the
          information below for details on waiting for the scan to complete. 
      - names: DO_DEBRICKED_SCAN\nDEBRICKED_SCAN_EXTRA_OPTS\nDEBRICKED_ACCESS_TOKEN\nDEBRICKED_VERSION\nDEBRICKED_HOME
        desc: >-
          The fcli `ci` action supports running a Debricked Software Composition Analysis (SCA) scan, which
          is enabled automatically if `DEBRICKED_ACCESS_TOKEN` is provided. The `DO_DEBRICKED_SCAN` environment
          variable can be set to `false` to (temporarily) disable the Debricked scan. The `DEBRICKED_SCAN_EXTRA_OPTS`
          environment variable can be used to provide additional options to the `debricked scan` command.\nBy default:\n
          - If `DEBRICKED_HOME` is specified, the pre-installed Debricked CLI at that location will be registered
          and used, skipping automatic installation. The path should point to the installation directory or binary.\n
          - `DEBRICKED_VERSION` may be specified to request a specific Debricked CLI version to be used; if not
          already installed (through fcli or on system PATH), the requested version will be automatically downloaded and installed.\n
          - If neither `DEBRICKED_VERSION` nor `DEBRICKED_HOME` are set, the most recently installed Debricked CLI version
          will be used (either previously installed through fcli or on system PATH) if found, otherwise latest available version
          will be installed.\n
          - Tool definitions to identify available Debricked CLI versions will be downloaded from the default
          location; use `TOOL_DEFINITIONS` to use customized tool definitions.\n
          - Set `PREINSTALLED` to `true` to require that Debricked CLI is already installed, preventing tool definitions
          from being updated or Debricked CLI from being installed.\n
      - names: DO_WAIT\nDO_SAST_WAIT\nSAST_WAIT_EXTRA_OPTS\nDEBRICKED_WAIT_EXTRA_OPTS
        desc: >-
          By default, the fcli `ci` action will wait for all started scans to complete; set `DO_WAIT` to
          `false` to just kick off any configured scans without waiting for completion. Note that doing so
          will skip any post-scan tasks. The `SAST_WAIT_EXTRA_OPTS` environment variable can be used to pass
          extra options to the `fcli sc-sast scan wait-for` command, and similarly, the `DEBRICKED_WAIT_EXTRA_OPTS`
          environment variable can be used to pass extra options to the `fcli ssc artifact wait-for` command.
          Note that `DO_SAST_WAIT` is deprecated; please use `DO_WAIT` instead.
    # Post-scan configuration: Aviator audit, summary, policy checks, PR comments, exports
    postScan:
      - names: AVIATOR_URL\nAVIATOR_TOKEN\nAVIATOR_LOGIN_EXTRA_OPTS
        desc: >-
          Aviator URL and JWT token to use for Aviator operations (see below). The `AVIATOR_TOKEN`
          environment variable should hold the actual token contents; prefixes like `file:` or `string:`
          (like the `--token` option on the `fcli aviator session login` command) are not supported. The
          `AVIATOR_LOGIN_EXTRA_OPTS` environment variable can be used to pass additional options to the
          `fcli aviator session login` command.
      - names: DO_AVIATOR_AUDIT\nAVIATOR_APP\nAVIATOR_AUDIT_EXTRA_OPTS\nAVIATOR_WAIT_EXTRA_OPTS
        desc: >-
          If `DO_AVIATOR_AUDIT` is not set to `false`, and Aviator URL and token have been configured,
          scan results will be sent to Aviator for AI-driven auditing. The Aviator application name
          can optionally be configured through `AVIATOR_APP`, which defaults to the SSC application name.
          The `AVIATOR_AUDIT_EXTRA_OPTS` environment variable can be used to pass extra options to the
          `fcli aviator ssc audit` command, for example to adjust tag mappings. The `AVIATOR_WAIT_EXTRA_OPTS`
          environment variable can be used to pass extra options to the `fcli ssc artifact wait-for` command,
          which will be run to wait for SSC to process the audited results.
      - names: DO_APPVERSION_SUMMARY\nAPPVERSION_SUMMARY_ACTION\nAPPVERSION_SUMMARY_EXTRA_OPTS
        desc: >-
          If `DO_APPVERSION_SUMMARY` is not set to `false`, an application version summary will be generated using the
          fcli-provided actionRef:appversion-summary#_appversion_summary action or, if specified, the custom fcli action specified through
          `APPVERSION_SUMMARY_ACTION`. Extra options for the fcli action can be specified through the
          `APPVERSION_SUMMARY_EXTRA_OPTS` environment variable, which may include fcli options to allow
          unsigned custom actions to be used.
      - names: DO_CHECK_POLICY\nCHECK_POLICY_ACTION\nCHECK_POLICY_EXTRA_OPTS
        desc: >-
          If `DO_CHECK_POLICY` is set to true (implied if any of the other two `CHECK_POLICY_*` variables
          are set), a policy check will be run after scan completion using the fcli-provided
          actionRef:check-policy#_check_policy action or, if specified, the custom fcli action specified through
          `CHECK_POLICY_ACTION`. Extra options for a custom fcli action can be passed through the
          `CHECK_POLICY_EXTRA_OPTS` environment variable, which may include fcli options to allow
          unsigned custom actions to be used.
      - names: DO_PR_COMMENT\nPR_COMMENT_ACTION\nPR_COMMENT_EXTRA_OPTS
        desc: >-
          (PREVIEW) If `DO_PR_COMMENT` is set to true (implied if any of the other two `PR_COMMENT_*` variables
          are set), a Pull Request or Merge Request comment will be generated using an fcli-provided action
          matching the current CI system like actionRef:github-pr-comment#_github_pr_comment or, if specified, the custom fcli action
          specified through `PR_COMMENT_ACTION`. Extra options for the fcli action can be specified through
          the `PR_COMMENT_EXTRA_OPTS` environment variable, which may include fcli options to allow unsigned
          custom actions to be used.
      - names: DO_SAST_EXPORT\nSAST_EXPORT_ACTION\nSAST_EXPORT_EXTRA_OPTS
        desc: >-
          If `DO_SAST_EXPORT` is not set to `false` and a SAST scan was completed, the SAST vulnerability
          data will be exported into a CI-specific format using an fcli-provided action matching the current
          CI system like actionRef:github-sast-report#_github_sast_report or actionRef:gitlab-sast-report#_gitlab_sast_report, or, if specified, the custom fcli action
          specified through `SAST_EXPORT_ACTION`. Extra options for the fcli action can be specified through the
          `SAST_EXPORT_EXTRA_OPTS` environment variable, which may include fcli options to allow unsigned custom
          actions to be used.
      - names: DO_DEBRICKED_EXPORT\nDEBRICKED_EXPORT_ACTION\nDEBRICKED_EXPORT_EXTRA_OPTS
        desc: >-
          If `DO_DEBRICKED_EXPORT` is not set to `false` and a Debricked scan was completed, the Debricked vulnerability
          data will be exported into a CI-specific format using an fcli-provided action matching the current
          CI system like actionRef:gitlab-debricked-report#_gitlab_debricked_report, or, if specified, the custom fcli action
          specified through `DEBRICKED_EXPORT_ACTION`. Extra options for the fcli action can be specified through the
          `DEBRICKED_EXPORT_EXTRA_OPTS` environment variable, which may include fcli options to allow unsigned custom
          actions to be used.
                  
  # ============================================================================
  # COMMON DEFINITIONS - Shared Across Products
  # ============================================================================
  # Environment variable definitions used by both FoD and SSC
  commonDefinitions:
    # Packaging configuration: ScanCentral Client setup and package generation
    package:
      - names: PACKAGE_ACTION\nPACKAGE_ACTION_EXTRA_OPTS
        desc: >- 
          By default, when running a SAST scan, the fcli actionRef:package#_package action is used to (optionally) package the source code
          to be scanned; see next entry for information on how to configure the default actionRef:package#_package action. If the standard
          fcli actionRef:package#_package action doesn't meet your needs, for example if you want to perform a local translation using
          Fortify Static Code Analyzer, you can use `PACKAGE_ACTION` to use a custom action for packaging, optionally
          providing extra options to this custom action through the `PACKAGE_ACTION_EXTRA_OPTS` environment variable.
          Note that any custom action must set the `global.package.output` action variable, pointing to the package or
          MBS file to be scanned.
      - names: USE_PACKAGE\nPACKAGE_EXTRA_OPTS\nSC_CLIENT_VERSION\nSC_CLIENT_HOME\nSOURCE_DIR\nTOOL_DEFINITIONS
        desc: >-
          These environment variables define packaging behavior. If `USE_PACKAGE` is specified, packaging will be skipped
          and the given package or MBS file (which must already exist) will be used. To pass additional options to the
          `scancentral package` command like `-bt` or `-bf`, use `PACKAGE_EXTRA_OPTS`.\nBy default:\n
          - If `SC_CLIENT_HOME` is specified, the pre-installed ScanCentral Client at that location will be registered
          and used, skipping automatic installation. The path should point to the installation directory or binary.\n
          - `SC_CLIENT_VERSION` may be specified to request a specific ScanCentral Client version to be used; if not
          already installed (through fcli or on system PATH), the requested version will be automatically downloaded and installed.\n
          - If neither `SC_CLIENT_VERSION` nor `SC_CLIENT_HOME` are set, the most recently installed ScanCentral Client version
          will be used (either previously installed through fcli or on system PATH) if found, otherwise latest available version
          will be installed.\n
          - Current working directory will be packaged; use `SOURCE_DIR` to package a different directory.\n
          - Debug logging for Scancentral Client is disabled; pass --debug on the fcli invocation to enable debug logging.\n
          - Tool definitions to identify available ScanCentral Client versions will be downloaded from the default
          location; use `TOOL_DEFINITIONS` to use customized tool definitions.\n
          - Set `PREINSTALLED` to `true` to require that ScanCentral Client is already installed, preventing tool definitions
          from being updated or ScanCentral Client from being installed.\n
  
  # ============================================================================
  # FORTIFY SETUP DEFINITIONS - @fortify/setup Versions
  # ============================================================================
  # Each entry represents a specific @fortify/setup version and its environment variables
  # Pattern: fortify-setup-{major}.{minor}.x → @fortify/setup v{major}.{minor}.x
  #
  # HOW TO ADD A NEW @fortify/setup VERSION:
  # 1. Add a new entry below with key 'fortify-setup-{major}.{minor}.x'
  # 2. Define 'notes' (version-specific info) and 'envVars' (array of environment variables)
  # 3. Add the new key to the hardcoded array in STEP 1 above (search for 'fortify-setup-2.1.x')
  # 4. Run ./gradlew :fcli-core:fcli-action:buildTimeAction_ci_doc to test
  # 5. Verify generated files: bootstrap-v{version}.txt and bootstrap-v{version}.adoc
  fortifySetupDefinitions:
    # @fortify/setup v2.1.x - Version pinning support
    fortify-setup-2.1.x:
      notes: >-
        @fortify/setup v2.1.x adds fcli version pinning support via FCLI_BOOTSTRAP_VERSION environment variable.
        Supports versions with or without 'v' prefix (e.g., 'v3.14.1' or '3.14.1'). Uses RUNNER_TOOL_CACHE
        for persistent caching when FCLI_BOOTSTRAP_VERSION is set to full major.minor.patch version.
        Bootstraps latest fcli v3.x by default. Follows semantic versioning: breaking changes in fcli (v4)
        will require @fortify/setup v3.x.
      envVars:
        - names: FCLI_BOOTSTRAP_VERSION
          desc: >-
            Fcli version to bootstrap (e.g., 'v3', 'v3.14', 'v3.14.1', or without 'v' prefix: '3.14.1').
            When set to a full major.minor.patch version, GitHub Actions will use RUNNER_TOOL_CACHE for
            persistent caching across workflow runs. Partial versions (e.g., 'v3') or unset will use
            RUNNER_TEMP for job-specific temporary storage. Ignored if FCLI_BOOTSTRAP_URL is set.
        - names: FCLI_BOOTSTRAP_PATH
          desc: >-
            Path to a pre-installed fcli executable. When set, fcli bootstrapping will use this binary instead
            of downloading fcli. The specified fcli must be version 3.14.0 or later. This allows CI integrations
            to control which fcli version is used and skip the download/verification process.
        - names: FCLI_BOOTSTRAP_URL
          desc: >-
            Custom URL for downloading the fcli archive. When set, this overrides FCLI_BOOTSTRAP_VERSION and
            the default GitHub release URL. Useful for air-gapped environments or internal mirrors. The URL
            should point to a platform-specific fcli archive (e.g., `fcli-linux.tgz`, `fcli-windows.zip`,
            `fcli-mac.tgz`).
        - names: FCLI_BOOTSTRAP_RSA_SHA256_URL
          desc: >-
            Custom URL for the fcli RSA SHA256 signature file. When set, this overrides the default signature
            URL (which is `FCLI_BOOTSTRAP_URL` + `.rsa_sha256`). Required when using a custom `FCLI_BOOTSTRAP_URL`
            with signature verification enabled.
        - names: FCLI_BOOTSTRAP_VERIFY_SIGNATURE
          desc: >-
            Controls whether RSA SHA256 signature verification is performed when downloading fcli. Set to `false`
            to skip verification (not recommended). By default, signature verification is enabled to ensure
            the downloaded fcli binary has not been tampered with.
  
  # ============================================================================
  # FCLI-SPECIFIC ENVIRONMENT VARIABLES
  # ============================================================================
  # These variables are implemented in fcli (not @fortify/setup) and apply to all bootstrap versions
  # Hardcoded here rather than in bootstrap definitions since they're version-independent
  fcliToolBootstrapEnvVars:
    - names: TOOL_DEFINITIONS
      desc: >-
        URL or file path to custom tool definitions YAML file. This fcli environment variable controls
        where fcli retrieves tool version information for ScanCentral Client, Debricked CLI, and other
        tools. Useful for air-gapped environments or when using custom tool repositories. When set,
        fcli will use the specified tool definitions instead of downloading from the default GitHub location.
  
  # ============================================================================
  # CI SYSTEM DEFINITIONS - Version Tracking
  # ============================================================================
  # Each entry represents a specific CI action version and its dependencies
  # Pattern: {ciSystem}-{major}.{minor}.x (e.g., github-3.0.x, gitlab-2.1.x)
  # Each definition includes:
  #   - fortify-setup-version: References fortify-setup-{version} for env vars (e.g., "2.0.x")
  #   - notes: Version-specific documentation and compatibility info
  #
  # HOW TO ADD A NEW CI SYSTEM VERSION:
  # 1. Add a new entry below with key '{ciSystem}-{major}.{minor}.x' (e.g., 'github-3.1.x')
  # 2. Set 'fortify-setup-version' to reference an existing fortify-setup version (e.g., "2.0.x")
  # 3. Define 'notes' with version-specific information and compatibility details
  # 4. Add the new key to the hardcoded array in STEP 4 above (search for 'github-3.0.x')
  # 5. Run ./gradlew :fcli-core:fcli-action:buildTimeAction_ci_doc to test
  # 6. Verify generated files: {product}-{ciSystem}-v{version}.adoc for both fod and ssc
  ciSystemDefinitions:
    # GitHub Action v3.0.x - Uses @fortify/setup v2.1.x
    github-3.0.x:
      fortify-setup-version: "2.1.x"
      notes: >-
        GitHub Action v3.0.x uses @fortify/setup v2.1.x to bootstrap fcli v3.x, then runs `fcli action run ci`.
        Follows semantic versioning: breaking changes in fcli require major version bump across all components
        (fcli v4 → @fortify/setup v3 → GitHub Action v4).
        
      