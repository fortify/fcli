# yaml-language-server: $schema=https://fortify.github.io/fcli/schemas/action/fcli-action-schema-dev-2.x.json
author: Fortify
usage:
  header: Stage, commit, push and create a pull/merge request
  description: |
    Convenience wrapper that combines `git-stage-commit-push` and `pr-or-mr-create`
    into a single action. Detects local changes, commits them to a new branch, pushes
    to the remote, then raises a pull request (GitHub) or merge request (GitLab).

    For more control, run `git-stage-commit-push` and `pr-or-mr-create` separately.

    This action requires:
    - Git repository access (local clone with a configured remote)
    - A CI token: GITHUB_TOKEN/GH_TOKEN (GitHub), CI_JOB_TOKEN (GitLab),
      SYSTEM_ACCESSTOKEN (Azure DevOps), or BITBUCKET_TOKEN (Bitbucket)

    Configuration via CLI options or environment variables:
    - `--source-dir` / `SOURCE_DIR` -- Directory where changes are detected (default: '.')
    - `--branch-prefix` / `BRANCH_PREFIX` -- Branch name prefix (default: "fcli/aviator-remediations")
    - `--title` / `PR_TITLE` -- PR/MR title
    - `--body` / `PR_BODY` -- PR/MR description
    - `--base-branch` / `BASE_BRANCH` -- Target branch for the PR/MR (default: auto-detected from remote, fallback "main")
    - `--author-name` / `GIT_AUTHOR_NAME` -- Commit author name (default: "fcli-aviator[bot]")
    - `--author-email` / `GIT_AUTHOR_EMAIL` -- Commit author email

config:
  output: immediate

cli.options:
  sourceDir:
    names: --source-dir, -s
    description: >-
      Directory where changes are detected.
      Defaults to current working directory if not specified.
    required: false
    default: "${#env('SOURCE_DIR')?:'.'}"
  branchPrefix:
    names: --branch-prefix
    description: >-
      Prefix for the new branch name.
    required: false
    default: "${#env('BRANCH_PREFIX')?:'fcli/aviator-remediations'}"
  title:
    names: --title, -t
    description: >-
      PR/MR title.
    required: false
    default: "${#env('PR_TITLE')?:'fix: Fortify auto-remediation fixes [Generated by fcli aviator]'}"
  body:
    names: --body
    description: >-
      PR/MR description.
    required: false
    default: "${#env('PR_BODY')?:'This pull request contains changes applied by fcli aviator.'}"
  baseBranch:
    names: --base-branch
    description: >-
      Target branch for the PR/MR. Auto-detected from the remote HEAD if not specified,
      falling back to "main".
    required: false
    default: "${#env('BASE_BRANCH')?:''}"
  authorName:
    names: --author-name
    description: >-
      Git author name for the commit.
    required: false
    default: "${#env('GIT_AUTHOR_NAME')?:'fcli-aviator[bot]'}"
  authorEmail:
    names: --author-email
    description: >-
      Git author email for the commit.
    required: false
    default: "${#env('GIT_AUTHOR_EMAIL')?:'fcli-aviator@opentext.com'}"

steps:
  # Compute base branch: CLI option/env var -> git remote HEAD -> "main"
  - var.set:
      baseBranch: "${#ifBlank(cli.baseBranch, #ifBlank(#git.defaultBranch(cli.sourceDir), 'main'))}"

  # Step 1: Stage, commit and push
  - action.run:
      action: git-stage-commit-push
      options:
        source-dir: "${cli.sourceDir}"
        branch-prefix: "${cli.branchPrefix}"
        author-name: "${cli.authorName}"
        author-email: "${cli.authorEmail}"
  - var.set:
      gitResult: ${result}

  - if: "${gitResult.status=='no_changes'}"
    do:
      - log.info: "No changes detected, skipping PR/MR creation."
      - exit: 0

  # Step 2: Create PR/MR from the pushed branch
  - action.run:
      action: pr-or-mr-create
      options:
        source-dir: "${cli.sourceDir}"
        source-branch: "${gitResult.branchName}"
        base-branch: "${baseBranch}"
        title: "${cli.title}"
        body: "${cli.body}"
  - var.set:
      prResult: ${result}

  - log.info: "commit-and-create-pr completed: git=${gitResult.status}, pr=${prResult.status}"
  - if: "${prResult.status=='success'}"
    log.info: "PR/MR URL: ${prResult.prLink}"