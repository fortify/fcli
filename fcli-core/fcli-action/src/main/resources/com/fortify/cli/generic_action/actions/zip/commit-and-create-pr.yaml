# yaml-language-server: $schema=https://fortify.github.io/fcli/schemas/action/fcli-action-schema-dev-2.x.json
author: Fortify
usage:
  header: Stage, commit, push and create a pull/merge request
  description: |
    Convenience wrapper that combines `git-stage-commit-push` and `pr-or-mr-create`
    into a single action. Detects local changes, commits them to a new branch, pushes
    to the remote, then raises a pull request (GitHub) or merge request (GitLab).

    For more control, run `git-stage-commit-push` and `pr-or-mr-create` separately.

    This action requires:
    - Git repository access (local clone with a configured remote)
    - A CI token: GITHUB_TOKEN/GH_TOKEN (GitHub), CI_JOB_TOKEN (GitLab),
      SYSTEM_ACCESSTOKEN (Azure DevOps), or BITBUCKET_TOKEN (Bitbucket)

    Configuration via CLI options or environment variables:
    - `--source-dir` / `SOURCE_DIR` — Directory where changes are detected (default: '.')
    - `--branch-prefix` / `BRANCH_PREFIX` — Branch name prefix (default: "fcli/aviator-remediations")
    - `--title` / `PR_TITLE` — PR/MR title (default: "fix: Fortify auto-remediation fixes [Generated by fcli]")
    - `--body` / `PR_BODY` — PR/MR description (default: generic message)
    - `--base-branch` / `BASE_BRANCH` — Target branch for the PR/MR (default: auto-detected from remote, fallback "main")
    - `--author-name` / `GIT_AUTHOR_NAME` — Commit author name (default: "fcli-actions[bot]")
    - `--author-email` / `GIT_AUTHOR_EMAIL` — Commit author email (default: "fcli-actions@opentext.com")

options:
  - name: source-dir
    description: Directory where changes are detected
    defaultValue: "${#env('SOURCE_DIR')?:global.ci.sourceDir?:'.'}"

  - name: branch-prefix
    description: Prefix for the new branch name
    defaultValue: "${#env('BRANCH_PREFIX')?:'fcli/aviator-remediations'}"

  - name: title
    description: PR/MR title
    defaultValue: "${#env('PR_TITLE')?:'fix: Fortify auto-remediation fixes [Generated by fcli aviator]'}"

  - name: body
    description: PR/MR description
    defaultValue: "${#env('PR_BODY')?:'This pull request contains changes applied by fcli aviator.'}"

  - name: author-name
    description: Git author name for the commit
    defaultValue: "${#env('GIT_AUTHOR_NAME')?:'fcli-aviator[bot]'}"

  - name: author-email
    description: Git author email for the commit
    defaultValue: "${#env('GIT_AUTHOR_EMAIL')?:'fcli-aviator@opentext.com'}"

config:
  output: immediate

steps:
  - var.set:
      sourceDir: "${#opt('source-dir', global.ci.sourceDir?:'.')}"
      branchPrefix: "${#opt('branch-prefix', 'fcli/aviator-remediations')}"
      prTitle: "${#opt('title', 'fix: Fortify auto-remediation fixes [Generated by fcli aviator]')}"
      prBody: "${#opt('body', 'This pull request contains changes applied by fcli aviator.')}"
      baseBranch: "${#ifBlank(#opt('base-branch', ''), #ifBlank(#git.defaultBranch(sourceDir), 'main'))}"
      authorName: "${#opt('author-name', 'fcli-aviator[bot]')}"
      authorEmail: "${#opt('author-email', 'fcli-aviator@opentext.com')}"

  # Step 1: Stage, commit and push
  - action.run:
      action: git-stage-commit-push
      options:
        source-dir: "${sourceDir}"
        branch-prefix: "${branchPrefix}"
        author-name: "${authorName}"
        author-email: "${authorEmail}"
  - var.set:
      gitResult: ${result}

  - if: "${gitResult.status=='no_changes'}"
    do:
      - log.info: "No changes detected, skipping PR/MR creation."
      - exit: 0

  # Step 2: Create PR/MR from the pushed branch
  - action.run:
      action: pr-or-mr-create
      options:
        source-dir: "${sourceDir}"
        source-branch: "${gitResult.branchName}"
        base-branch: "${baseBranch}"
        title: "${prTitle}"
        body: "${prBody}"
  - var.set:
      prResult: ${result}

  - log.info: "commit-and-create-pr completed: git=${gitResult.status}, pr=${prResult.status}"
  - if: "${prResult.status=='success'}"
    log.info: "PR/MR URL: ${prResult.prLink}"