# yaml-language-server: $schema=https://fortify.github.io/fcli/schemas/action/fcli-action-schema-dev-2.x.json
author: Fortify
usage:
  header: Stage, commit and push local changes to a new branch
  description: |
    This action detects local file changes, creates a new branch, stages and commits
    the changes, then pushes the branch to the remote repository. Credentials are
    auto-detected from the CI environment (GitHub Actions, GitLab CI, Azure DevOps,
    Bitbucket Pipelines).

    This action requires:
    - Git repository access (local clone with a configured remote)
    - A CI token with push permissions (GITHUB_TOKEN, GH_TOKEN, CI_JOB_TOKEN,
      SYSTEM_ACCESSTOKEN, or BITBUCKET_TOKEN)

    Configuration via CLI options or environment variables:
    - `--source-dir` / `SOURCE_DIR` — Directory where changes are detected (default: '.')
    - `--branch-prefix` / `BRANCH_PREFIX` — Branch name prefix (default: "fcli/aviator-remediations")
    - `--commit-message` / `COMMIT_MESSAGE` — Commit message (default: "fix: apply automated fixes [generated by fcli aviator]")
    - `--author-name` / `GIT_AUTHOR_NAME` — Commit author name (default: "fcli-aviator[bot]")
    - `--author-email` / `GIT_AUTHOR_EMAIL` — Commit author email (default: "fcli-aviator@opentext.com")

    Output variables (accessible by subsequent actions or scripts):
    - `result.status` — "success", "no_changes", or "error"
    - `result.branchName` — Name of the newly created branch
    - `result.commitSha` — SHA of the created commit
    - `result.pushedRef` — Full ref pushed to the remote

options:
  - name: source-dir
    description: Directory where changes are detected
    defaultValue: "${#env('SOURCE_DIR')?:global.ci.sourceDir?:'.'}"

  - name: branch-prefix
    description: Prefix for the new branch name
    defaultValue: "${#env('BRANCH_PREFIX')?:'fcli/aviator-remediations'}"

  - name: commit-message
    description: Git commit message
    defaultValue: "${#env('COMMIT_MESSAGE')?:'fix: apply automated fixes [generated by fcli aviator]'}"

  - name: author-name
    description: Git author name for the commit
    defaultValue: "${#env('GIT_AUTHOR_NAME')?:'fcli-aviator[bot]'}"

  - name: author-email
    description: Git author email for the commit
    defaultValue: "${#env('GIT_AUTHOR_EMAIL')?:'fcli-aviator@opentext.com'}"

config:
  output: immediate

steps:
  - var.set:
      sourceDir: "${#opt('source-dir', global.ci.sourceDir?:'.')}"
      branchPrefix: "${#opt('branch-prefix', 'fcli/aviator-remediations')}"
      commitMessage: "${#opt('commit-message', 'fix: apply automated fixes [generated by fcli aviator]')}"
      authorName: "${#opt('author-name', 'fcli-aviator[bot]')}"
      authorEmail: "${#opt('author-email', 'fcli-aviator@opentext.com')}"

  - log.debug: "Action configuration: sourceDir=${sourceDir}, branchPrefix=${branchPrefix}, author=${authorName} <${authorEmail}>"

  # Validate git repository
  - var.set:
      gitRepoInfo: ${#git.localRepo(sourceDir)}
  - if: ${gitRepoInfo==null}
    throw: "Source directory '${sourceDir}' is not a git repository."
  - if: "${#isBlank(gitRepoInfo.repository.remoteUrl)}"
    throw: "Git repository has no remote URL configured. A remote is required for push."
  - log.info: "Git repository: remote=${gitRepoInfo.repository.remoteUrl}, branch=${gitRepoInfo.branch.short?:'detached HEAD'}"

  # Check for changes
  - var.set:
      hasChanges: ${#git.hasChanges(sourceDir)}
  - if: ${!hasChanges}
    do:
      - log.info: "No changes detected in ${sourceDir}, skipping commit and push."
      - var.set:
          result: ${T(java.util.LinkedHashMap).new()}
          result.status: "no_changes"
          result.branchName: ""
          result.commitSha: ""
          result.pushedRef: ""
      - exit: 0
  - log.info: "Changes detected in ${sourceDir}, proceeding."

  # Set git author identity
  - var.set:
      gitAuthorEnv: ${#env.set('GIT_AUTHOR_NAME', authorName).put('GIT_AUTHOR_EMAIL', authorEmail)}
    on.fail:
      - log.warn: "Warning: Unable to set git author environment variables"

  # Create branch
  - var.set:
      branchName: ${#git.createBranch(sourceDir, branchPrefix)}
    on.fail:
      - log.warn:
          msg: "Failed to create branch with prefix '${branchPrefix}'"
          cause: ${lastException}
      - throw: ${lastException}
  - log.info: "Created branch: ${branchName}"

  # Stage all changes
  - var.set:
      staged: ${#git.addAll(sourceDir)}
    on.fail:
      - log.warn:
          msg: "Failed to stage changes in ${sourceDir}"
          cause: ${lastException}
      - throw: ${lastException}
  - log.debug: "All changes staged successfully"

  # Commit
  - var.set:
      commitSha: "${#git.commit(sourceDir, commitMessage)}"
    on.fail:
      - log.warn:
          msg: "Failed to commit staged changes"
          cause: ${lastException}
      - throw: ${lastException}
  - log.info: "Committed changes: ${commitSha}"

  # Push
  - var.set:
      pushedRef: ${#git.push(sourceDir, branchName)}
    on.fail:
      - var.set:
          remoteUrl: "${gitRepoInfo.repository.remoteUrl?:'unknown'}"
          exceptionMsg: "${lastException.message}"
      - log.warn:
          msg: "Failed to push branch '${branchName}' to remote '${remoteUrl}': ${exceptionMsg}"
          cause: ${lastException}
      - if: "${exceptionMsg.contains('No credentials available')}"
        log.warn: "DIAGNOSIS: Push failed due to missing credentials. Set one of: GITHUB_TOKEN/GH_TOKEN, CI_JOB_TOKEN, SYSTEM_ACCESSTOKEN, or BITBUCKET_TOKEN"
      - throw:
          msg: "Failed to push branch '${branchName}' to remote"
          cause: ${lastException}
  - log.info: "Pushed branch to remote: ${pushedRef}"

  - var.set:
      result: ${T(java.util.LinkedHashMap).new()}
      result.status: "success"
      result.branchName: "${branchName}"
      result.commitSha: "${commitSha}"
      result.pushedRef: "${pushedRef}"
  - log.info: "git-stage-commit-push completed: branch=${result.branchName}, commit=${result.commitSha}"
