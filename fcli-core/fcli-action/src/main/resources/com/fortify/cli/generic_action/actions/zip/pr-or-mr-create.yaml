# yaml-language-server: $schema=https://fortify.github.io/fcli/schemas/action/fcli-action-schema-dev-2.x.json
author: Fortify
usage:
  header: Create a pull request or merge request on GitHub or GitLab
  description: |
    This action creates a pull request (GitHub) or merge request (GitLab) for an
    existing branch. The repository platform is auto-detected from the git remote URL.
    Only GitHub and GitLab are supported; for other platforms the branch must be
    promoted to a PR/MR manually.

    Typically used after `git-stage-commit-push` to raise a PR/MR for the pushed branch.

    This action requires:
    - Git repository with a remote pointing to GitHub or GitLab
    - A CI token with PR/MR creation permissions (GITHUB_TOKEN/GH_TOKEN or CI_JOB_TOKEN)

    Configuration via CLI options or environment variables:
    - `--source-dir` / `SOURCE_DIR` — Local repo directory used to detect the platform (default: '.')
    - `--source-branch` / `SOURCE_BRANCH` — Branch to raise the PR/MR from (required)
    - `--base-branch` / `BASE_BRANCH` — Target branch for the PR/MR (default: auto-detected from remote, fallback "main")
    - `--title` / `PR_TITLE` — PR/MR title (default: "fix: Fortify auto-remediation fixes")
    - `--body` / `PR_BODY` — PR/MR description (default: generic message)

    Output variables:
    - `result.status` — "success", "no_pr_support", or "error"
    - `result.prLink` — URL of the created PR/MR (empty on failure)
    - `result.platform` — Detected repository platform ("github", "gitlab", or "unknown")

options:
  - name: source-dir
    description: Local repo directory (used to detect the repository platform)
    defaultValue: "${#env('SOURCE_DIR')?:global.ci.sourceDir?:'.'}"

  - name: source-branch
    description: Source branch to raise the PR/MR from
    required: true
    defaultValue: "${#env('SOURCE_BRANCH')?:''}"

  - name: title
    description: PR/MR title
    defaultValue: "${#env('PR_TITLE')?:'fix: Fortify auto-remediation fixes [Generated by fcli aviator]'}"

  - name: body
    description: PR/MR description
    defaultValue: "${#env('PR_BODY')?:'This pull request contains changes applied by fcli aviator.'}"

config:
  output: immediate

steps:
  - var.set:
      sourceDir: "${#opt('source-dir', global.ci.sourceDir?:'.')}"
      sourceBranch: "${#opt('source-branch', '')}"
      baseBranch: "${#ifBlank(#opt('base-branch', ''), #ifBlank(#git.defaultBranch(sourceDir), 'main'))}"
      prTitle: "${#opt('title', 'fix: Fortify auto-remediation fixes [Generated by fcli aviator]')}"
      prBody: "${#opt('body', 'This pull request contains changes applied by fcli aviator.')}"

  - if: "${#isBlank(sourceBranch)}"
    throw: "Option '--source-branch' is required. Pass the branch created by git-stage-commit-push."

  - log.debug: "PR/MR configuration: platform detection from '${sourceDir}', source=${sourceBranch}, base=${baseBranch}"

  # Detect repository platform from git remote URL
  - var.set:
      repoPlatform: ${#git.repositoryPlatform(sourceDir)}
  - log.debug: "Detected repository platform: ${repoPlatform}"

  - var.set:
      result: ${T(java.util.LinkedHashMap).new()}
      result.status: "error"
      result.prLink: ""
      result.platform: "${repoPlatform}"

  # GitHub PR creation
  - if: "${repoPlatform=='github'}"
    do:
      - var.set:
          repoOwner: "${#git.ciRepositoryOwner()}"
          prHead: "${repoOwner}:${sourceBranch}"
      - log.debug: "Creating GitHub PR: head=${prHead}, base=${baseBranch}, title=${prTitle}"
      - var.set:
          pr: ${#_ci.detect().repo().createPullRequest(prTitle, prHead, baseBranch, prBody)}
        on.fail:
          - log.warn:
              msg: "Failed to create GitHub Pull Request from '${sourceBranch}' to '${baseBranch}'"
              cause: ${lastException}
          - log.warn: "Troubleshooting: Verify branch '${sourceBranch}' exists on remote and base branch '${baseBranch}' is valid"
          - var.set:
              result.status: "error"
              result.errorMessage: "${lastException.message}"
      - if: ${pr!=null}
        do:
          - var.set:
              result.status: "success"
              result.prLink: "${pr.html_url}"
          - log.info: "Created GitHub Pull Request #${pr.number}: ${pr.html_url}"

  # GitLab MR creation
  - if: "${repoPlatform=='gitlab'}"
    do:
      - log.debug: "Creating GitLab Merge Request: source=${sourceBranch}, target=${baseBranch}, title=${prTitle}"
      - var.set:
          mr: ${#_ci.detect().project().createMergeRequest(prTitle, sourceBranch, baseBranch, prBody)}
        on.fail:
          - log.warn:
              msg: "Failed to create GitLab Merge Request from '${sourceBranch}' to '${baseBranch}'"
              cause: ${lastException}
          - log.warn: "Troubleshooting: Verify branch '${sourceBranch}' exists on remote and base branch '${baseBranch}' is valid"
          - var.set:
              result.status: "error"
              result.errorMessage: "${lastException.message}"
      - if: ${mr!=null}
        do:
          - var.set:
              result.status: "success"
              result.prLink: "${mr.web_url}"
          - log.info: "Created GitLab Merge Request !${mr.iid}: ${mr.web_url}"

  # Unsupported repository platform
  - if: "${repoPlatform!='github' && repoPlatform!='gitlab'}"
    do:
      - log.warn: "PR/MR creation is not supported for repository platform '${repoPlatform}'. Branch '${sourceBranch}' has been pushed; please create a PR/MR manually."
      - var.set:
          result.status: "no_pr_support"

  - log.info: "pr-or-mr-create completed: status=${result.status}, platform=${result.platform}"
  - if: "${result.status=='success'}"
    log.info: "PR/MR URL: ${result.prLink}"
