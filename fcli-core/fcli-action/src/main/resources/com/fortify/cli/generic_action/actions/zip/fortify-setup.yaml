# yaml-language-server: $schema=https://fortify.github.io/fcli/schemas/action/fcli-action-schema-dev-2.x.json

author: Fortify
usage:
  header: (PREVIEW) Set up Fortify tools for CI/CD workflows
  description: |
    Detects, registers, and installs Fortify tools (fcli, sc-client, fod-uploader,
    debricked-cli, bugtracker-utility, vuln-exporter) for use in CI/CD pipelines.
    
    Once tools are installed/registered, use the 'fcli tool <tool-name> env' command
    to generate environment variables for shell scripts or CI/CD systems.
    
    Supports:
    - Auto-detection of pre-installed tools
    - Dynamic installation with signature verification  
    - Platform-specific tool caching (GitHub, Azure, GitLab)
    - Air-gapped environments (pre-installed tools only)
    - Docker multi-stage builds (fcli bootstrap)
    
    Examples:
      # Minimal: install sc-client only
      fcli action run fortify-setup --sc-client-version 24.4.0
      
      # Pre-installed tools (air-gapped)
      fcli action run fortify-setup --air-gapped \
        --sc-client-version auto --fod-uploader-version auto
      
      # Platform tool cache
      fcli action run fortify-setup --use-tool-cache \
        --sc-client-version latest --debricked-cli-version v2
      
      # Docker multi-stage build
      fcli action run fortify-setup --fcli-copy-from /base/usr/bin/fcli \
        --base-dir /opt/fortify --sc-client-version 24.4.0

config:
  output: immediate
  mcp: exclude
  run.fcli.status.log.default: false
  run.fcli.status.check.default: true

cli.options:
  # Tool versions
  fcli-version:
    names: --fcli-version
    required: false
    default: skip
    description: "Version to use: <specific-version>, latest, auto, preinstalled, skip. Default: skip"
  sc-client-version:
    names: --sc-client-version
    required: false
    default: skip
    description: "Version to use: <specific-version>, latest, auto, preinstalled, skip. Default: skip"
  fod-uploader-version:
    names: --fod-uploader-version
    required: false
    default: skip
    description: "Version to use: <specific-version>, latest, auto, preinstalled, skip. Default: skip"
  debricked-cli-version:
    names: --debricked-cli-version
    required: false
    default: skip
    description: "Version to use: <specific-version>, latest, auto, preinstalled, skip. Default: skip"
  bugtracker-utility-version:
    names: --bugtracker-utility-version
    required: false
    default: skip
    description: "Version to use: <specific-version>, latest, auto, preinstalled, skip. Default: skip"
  vuln-exporter-version:
    names: --vuln-exporter-version
    required: false
    default: skip
    description: "Version to use: <specific-version>, latest, auto, preinstalled, skip. Default: skip"
  with-jre:
    names: --with-jre
    required: false
    default: auto
    description: "JRE handling for sc-client: yes (install with JRE), no (use system Java), auto (detect compatible JRE). Default: auto"
    
  # Tool paths (explicit overrides)
  fcli-path:
    names: --fcli-path
    required: false
    description: "Explicit path to fcli binary or installation directory"
  sc-client-path:
    names: --sc-client-path
    required: false
    description: "Explicit path to sc-client binary or installation directory"
  fod-uploader-path:
    names: --fod-uploader-path
    required: false
    description: "Explicit path to fod-uploader binary or installation directory"
  debricked-cli-path:
    names: --debricked-cli-path
    required: false
    description: "Explicit path to debricked-cli binary or installation directory"
  bugtracker-utility-path:
    names: --bugtracker-utility-path
    required: false
    description: "Explicit path to bugtracker-utility binary or installation directory"
  vuln-exporter-path:
    names: --vuln-exporter-path
    required: false
    description: "Explicit path to vuln-exporter binary or installation directory"
    
  # Directory options
  base-dir:
    names: --base-dir
    required: false
    description: "Base directory for tool installations: <base-dir>/<tool>/<version>/"
  use-tool-cache:
    names: --use-tool-cache
    type: boolean
    required: false
    default: false
    description: "Use platform-specific tool cache (detected via ci-vars)"
  fcli-copy-from:
    names: --fcli-copy-from
    required: false
    description: "Bootstrap fcli from existing installation (Docker multi-stage builds)"
    
  # Behavior options
  air-gapped:
    names: --air-gapped
    type: boolean
    required: false
    default: false
    description: "Air-gapped mode: all tools must be pre-installed, don't update tool definitions"
  tool-definitions:
    names: --tool-definitions
    required: false
    description: "Custom tool definitions URL (ignored in air-gapped mode)"

steps:
  # ===== PHASE 1: INITIALIZATION =====
  
  # Detect CI platform for cache location
  - run.fcli:
      ci-vars:
        cmd: action run ci-vars
  
  # ===== PHASE 2: TOOL DEFINITIONS (OPTIONAL) =====
  
  - if: ${!cli['air-gapped']}
    run.fcli:
      UPDATE_TOOL_DEFINITIONS:
        cmd: tool definitions update ${#joinOrNull('=','--source',cli['tool-definitions'])?:""}
      
  # ===== PHASE 3: DEFINE TOOL METADATA =====
      
  - var.set:
      tools: |-
        ${{
          {name: 'fcli', version: cli['fcli-version'], path: cli['fcli-path'], copyFrom: cli['fcli-copy-from'], supportsJre: false, status: null},
          {name: 'sc-client', version: cli['sc-client-version'], path: cli['sc-client-path'], copyFrom: null, supportsJre: true, status: null},
          {name: 'fod-uploader', version: cli['fod-uploader-version'], path: cli['fod-uploader-path'], copyFrom: null, supportsJre: false, status: null},
          {name: 'debricked-cli', version: cli['debricked-cli-version'], path: cli['debricked-cli-path'], copyFrom: null, supportsJre: false, status: null},
          {name: 'bugtracker-utility', version: cli['bugtracker-utility-version'], path: cli['bugtracker-utility-path'], copyFrom: null, supportsJre: false, status: null},
          {name: 'vuln-exporter', version: cli['vuln-exporter-version'], path: cli['vuln-exporter-path'], copyFrom: null, supportsJre: false, status: null}
        }}
  - log.debug: "Tools to process:"
  - log.debug: ${tools}

  # ===== PHASE 4: PROCESS EACH TOOL =====
  
  - records.for-each:
      from: ${tools}
      record.var-name: tool
      do:
        # Skip if version=skip
        - if: ${tool.version == 'skip'}
          var.set:
            tool.status: skipped
            
        # Explicit path mode: register from provided path
        - if: ${tool.version != 'skip' && tool.path != null}
          run.fcli:
            REGISTER_TOOL:
              cmd: tool ${tool.name} register --path "${tool.path}"
              records.for-each:
                record.var-name: register_result
                do:
                - var.set:
                    tool.status: registered-explicit
                    tool.installDir: ${register_result.installDir}
                    tool.binDir: ${register_result.binDir}
                    tool.actualVersion: ${register_result.version}
              on.fail:
                - var.set:
                    tool.status: failed
                            
        # Auto-detect mode: try to find pre-installed tool
        # Build register command with optional version filter
        # NOTE: For semantic versions (v3, v24, etc), use --require-latest to ensure
        #       any pre-installed version is the latest available in tool definitions
        - if: ${tool.version != 'skip' && tool.path == null}
          var.set:
            tool.registerCmd: tool ${tool.name} register --auto-detect
            tool.versionIsSemantic: ${tool.version != 'auto' && tool.version != 'latest' && tool.version != 'preinstalled' && tool.version.matches('^v?\\d+(\\.\\d+)?$')}
        - if: ${tool.version != 'skip' && tool.path == null && tool.version != 'auto' && tool.version != 'latest' && tool.version != 'preinstalled'}
          var.set:
            tool.registerCmd: ${tool.registerCmd} --version ${tool.version}
        - if: ${tool.version != 'skip' && tool.path == null && tool.versionIsSemantic}
          var.set:
            tool.registerCmd: ${tool.registerCmd} --require-latest
        - if: ${tool.version != 'skip' && tool.path == null}
          run.fcli:
            AUTO_DETECT:
              cmd: ${tool.registerCmd}
              records.for-each:
                record.var-name: register_result
                do:
                  - var.set:
                      tool.status: registered-preinstalled
                      tool.installDir: ${register_result.installDir}
                      tool.binDir: ${register_result.binDir}
                      tool.actualVersion: ${register_result.version}
              on.fail:
                - if: ${tool.version=='preinstalled'}
                  throw: "Tool ${tool.name} must be pre-installed but was not found"
                - if: ${cli['air-gapped']}
                  throw: "Tool ${tool.name} must be pre-installed (--air-gapped mode) but was not found"
        
        # Determine JRE for tools that support it (before build install command)
        - if: ${tool.status==null && tool.supportsJre && cli['with-jre'] != 'no'}
          var.set:
            tool.installVersion: "${tool.version == 'auto' ? 'latest' : tool.version}"
        - if: ${tool.status==null && tool.supportsJre && cli['with-jre'] == 'auto'}
          run.fcli:
            GET_JRE_REQUIREMENT:
              cmd: tool ${tool.name} get ${tool.installVersion}
              records.for-each:
                record.var-name: version_info
                do:
                  - var.set:
                      tool.requiredJre: ${version_info.extraProperties?.jre}
        - if: ${tool.status==null && tool.supportsJre && cli['with-jre'] == 'auto' && tool.requiredJre != null}
          var.set:
            tool.detectedJreHome: ${#env('SCANCENTRAL_JAVA_HOME')}
        - if: ${tool.status==null && tool.supportsJre && cli['with-jre'] == 'auto' && tool.requiredJre != null && tool.detectedJreHome == null}
          var.set:
            tool.detectedJreHome: ${global.ci['java'+tool.requiredJre+'Home']}
        - if: ${tool.status==null && tool.supportsJre && cli['with-jre'] == 'auto' && tool.requiredJre != null && tool.detectedJreHome == null}
          var.set:
            tool.detectedJreHome: ${#findJavaHome(tool.requiredJre)}
        
        # Build install command
        - if: ${tool.status==null && tool.name == 'fcli' && tool.copyFrom != null}
          var.set:
            tool.installCmd: tool fcli install --copy-from "${tool.copyFrom}"
        - if: ${tool.status==null && (tool.name != 'fcli' || tool.copyFrom == null)}
          var.set:
            tool.installVersion: "${tool.version == 'auto' ? 'latest' : tool.version}"
            tool.installCmd: tool ${tool.name} install --version ${tool.installVersion}
        - if: ${tool.status==null && cli['base-dir'] != null}
          var.set:
            tool.installCmd: ${tool.installCmd} --base-dir "${cli['base-dir']}"
        - if: ${tool.status==null && cli['use-tool-cache'] && global.ci.toolCacheDirPattern != null}
          var.set:
            tool.installVersion: "${tool.version == 'auto' ? 'latest' : tool.version}"
            tool.cacheDir: ${global.ci.toolCacheDirPattern.replace('{tool}', tool.name).replace('{version}', tool.installVersion)}
            tool.installCmd: ${tool.installCmd} --install-dir "${tool.cacheDir}"
        
        # Add JRE options for tools that support it
        - if: ${tool.status==null && tool.supportsJre && cli['with-jre'] == 'yes'}
          var.set:
            tool.installCmd: ${tool.installCmd} --with-jre
        - if: ${tool.status==null && tool.supportsJre && cli['with-jre'] == 'auto' && tool.detectedJreHome != null}
          var.set:
            tool.installCmd: ${tool.installCmd} --jre "${tool.detectedJreHome}"
        - if: ${tool.status==null && tool.supportsJre && cli['with-jre'] == 'auto' && tool.detectedJreHome == null}
          var.set:
            tool.installCmd: ${tool.installCmd} --with-jre
        
        # Execute installation
        - if: ${tool.status==null}
          run.fcli:
            INSTALL:
              cmd: ${tool.installCmd}
              records.for-each:
                record.var-name: install_result
                do:
                  - var.set:
                      tool.status: installed
                      tool.installDir: ${install_result.installDir}
                      tool.binDir: ${install_result.binDir}
                      tool.actualVersion: ${install_result.version}
              on.fail:
                - var.set:
                    tool.status: failed
  
  # ===== PHASE 5: GENERATE ENVIRONMENT OUTPUT =====
  
  # Select processed and failed tools from the tools array using SpEL collection selection
  # Note: Using projection (![#this.getRealNode()]) to unwrap the JSON node wrapper
  - var.set:
      global.fortify_setup.processed: ${tools.?[status != null && status != 'skipped' && status != 'failed'].![#this.getRealNode()]}
      global.fortify_setup.failed: ${tools.?[status == 'failed'].![#this.getRealNode()]}
  
  # ===== PHASE 5: SUMMARY =====
  
  - log.info: ""
  - log.info: "Fortify tools setup complete. ${global.fortify_setup.processed.size()} tool(s) processed."
  
  - records.for-each:
      from: ${global.fortify_setup.processed}
      record.var-name: tool
      do:
        - log.info: "  ✓ ${tool.name}: ${tool.actualVersion} (${tool.status}) at ${tool.binDir}"
        
  - if: ${global.fortify_setup.failed.size() > 0}
    log.info: ""
  - if: ${global.fortify_setup.failed.size() > 0}
    log.info: "ERROR: ${global.fortify_setup.failed.size()} tool(s) failed:"
  - if: ${global.fortify_setup.failed.size() > 0}
    records.for-each:
      from: ${global.fortify_setup.failed}
      record.var-name: tool
      do:
        - log.info: "  ✗ ${tool.name}: Installation failed"
  - if: ${global.fortify_setup.failed.size() > 0}
    throw: "Fortify tools setup failed. See errors above."
