# yaml-language-server: $schema=https://fortify.github.io/fcli/schemas/action/fcli-action-schema-dev-2.x.json

author: Fortify
usage:
  header: (PREVIEW) Set up Fortify tools for CI/CD workflows
  description: |
    Detects, registers, and installs Fortify tools (fcli, sc-client, fod-uploader,
    debricked-cli, bugtracker-utility, vuln-exporter) for use in CI/CD pipelines.

    Supports:
    - Auto-detection of pre-installed tools
    - Dynamic installation with signature verification  
    - Platform-specific tool caching (GitHub, Azure, GitLab)
    - Air-gapped environments (pre-installed tools only)
    - Docker multi-stage builds (fcli bootstrap)
    
    Examples:
      # Install sc-client, then use it to package source code
      fcli action run fortify-setup --sc-client 24.4.0
      fcli tool sc-client run -- package -o package.zip
      
      # Pre-installed tools (air-gapped)
      fcli action run fortify-setup --air-gapped \
        --sc-client auto --fod-uploader auto
      
      # Docker multi-stage build, installing from preinstalled fcli
      fcli action run fortify-setup --self /base/usr/bin/fcli \
        --fcli auto \
        --base-dir /opt/fortify --sc-client 24.4.0
    
    Tools that are registered or installed through this action automatically become the
    default version for subsequent 'fcli tool <tool-name> run' commands. In the following
    example, the `fcli tool sc-client run` command will use sc-client v24.4.0 as specified
    on the `fcli action run fortify-setup` command:
    - fcli action run fortify-setup --sc-client 24.4.0
    - fcli tool sc-client run -- package -o package.zip
    
    If you need direct access to any tools installations, the fortify-env action may be used 
    to output environment variables pointing to the installed tool locations. In the following 
    example, the output of `fcli action run fortify-env` will include environment variables 
    pointing to sc-client v24.4.0 and latest fod-uploader, alongside any other tools that were 
    previously installed or registered:
    - fcli action run fortify-setup --sc-client 24.4.0 --fod-uploader latest
    - fcli action run fortify-env

config:
  output: immediate
  mcp: exclude
  run.fcli.status.log.default: false
  run.fcli.status.check.default: true

cli.options:
  # Tool versions
  fcli-version:
    names: --fcli
    required: false
    description: "Version to use: <specific-version>, latest, auto, preinstalled, skip. If omitted, tool is skipped unless explicit path or env var is set"
  sc-client-version:
    names: --sc-client
    required: false
    description: "Version to use: <specific-version>, latest, auto, preinstalled, skip. If omitted, tool is skipped unless explicit path or env var is set"
  fod-uploader-version:
    names: --fod-uploader
    required: false
    description: "Version to use: <specific-version>, latest, auto, preinstalled, skip. If omitted, tool is skipped unless explicit path or env var is set"
  debricked-cli-version:
    names: --debricked-cli
    required: false
    description: "Version to use: <specific-version>, latest, auto, preinstalled, skip. If omitted, tool is skipped unless explicit path or env var is set"
  bugtracker-utility-version:
    names: --bugtracker-utility
    required: false
    description: "Version to use: <specific-version>, latest, auto, preinstalled, skip. If omitted, tool is skipped unless explicit path or env var is set"
  vuln-exporter-version:
    names: --vuln-exporter
    required: false
    description: "Version to use: <specific-version>, latest, auto, preinstalled, skip. If omitted, tool is skipped unless explicit path or env var is set"
  with-jre:
    names: --with-jre
    required: false
    default: auto
    description: "JRE handling for sc-client: yes (install with JRE), no (use system Java), auto (detect compatible JRE). Default: auto"
    
  # Tool paths (explicit overrides)
  # Tool registration follows this priority:
  #   1. Explicit --<tool>-path option
  #   2. <TOOL_PREFIX>_HOME environment variable (e.g., SC_CLIENT_HOME, FCLI_HOME)
  #   3. Search PATH environment variable
  # For explicit paths and env vars, registration must succeed with version validation.
  # For PATH search, registration failure triggers installation.
  fcli-path:
    names: --fcli-path
    required: false
    description: "Explicit path to fcli binary or installation directory"
  sc-client-path:
    names: --sc-client-path
    required: false
    description: "Explicit path to sc-client binary or installation directory"
  fod-uploader-path:
    names: --fod-uploader-path
    required: false
    description: "Explicit path to fod-uploader binary or installation directory"
  debricked-cli-path:
    names: --debricked-cli-path
    required: false
    description: "Explicit path to debricked-cli binary or installation directory"
  bugtracker-utility-path:
    names: --bugtracker-utility-path
    required: false
    description: "Explicit path to bugtracker-utility binary or installation directory"
  vuln-exporter-path:
    names: --vuln-exporter-path
    required: false
    description: "Explicit path to vuln-exporter binary or installation directory"
    
  # Directory options
  base-dir:
    names: --base-dir
    required: false
    description: "Base directory for tool installations: <base-dir>/<tool>/<version>/"
    
  # Path to fcli executable used to execute this action
  self:
    names: --self
    required: false
    description: "Path to bootstrapped fcli executable. Not intended for end users; typically set by platform integration tools."
    
  # Behavior options
  air-gapped:
    names: --air-gapped
    type: boolean
    required: false
    default: ${#env('SETUP_AIRGAPPED')?:false}
    description: "Air-gapped mode: all tools must be pre-installed, don't update tool definitions"
  tool-definitions:
    names: --tool-definitions
    required: false
    description: "Custom tool definitions URL (ignored in air-gapped mode)"

steps:
  # ===== PHASE 1: TOOL DEFINITIONS (OPTIONAL) =====
  
  - if: ${!cli['air-gapped']}
    run.fcli:
      UPDATE_TOOL_DEFINITIONS:
        cmd: tool definitions update ${#isBlank(cli['tool-definitions'])?'':('"--source='+cli['tool-definitions']+'"')}
      
  # ===== PHASE 3: DEFINE TOOL METADATA =====
  
  # ============================================================================
  # INTEGRATOR DOCUMENTATION: --self parameter
  # ============================================================================
  # This parameter enables platform integration tools (GitHub Actions, GitLab
  # Components, Azure DevOps tasks, shell scripts) to pass their bootstrapped
  # fcli to this action, avoiding redundant downloads.
  #
  # WHY THIS PARAMETER EXISTS:
  # - Fcli cannot install itself (chicken-and-egg problem)
  # - Platform integrations must bootstrap fcli first using their own logic:
  #   * GitHub: @fortify/setup TypeScript module downloads fcli
  #   * GitLab: Shell script in component downloads fcli
  #   * Azure: TypeScript task downloads fcli
  #   * Shell: fortify-setup.sh downloads fcli
  # - Once fcli is available, pass it to this action via --self
  # - If user requests same or compatible fcli version, this action can then 
  #   re-use the given fcli executable instead of downloading again.
  #
  # PARAMETER: --self <path>
  # - Path to fcli executable that platform tool has already resolved/downloaded and that is used to run this action
  # - Allows this action to re-use bootstrapped fcli if user requested same or compatible fcli version to be installed
  # ============================================================================
  
  - var.set:
      tools: |-
        ${{
          {name: 'fcli', version: cli['fcli-version'], path: cli['fcli-path'],
           envPrefix: 'FCLI', copyIfMatching: cli['self'], supportsJre: false, status: null},
          {name: 'sc-client', version: cli['sc-client-version'], path: cli['sc-client-path'],
           envPrefix: 'SC_CLIENT', copyIfMatching: null, supportsJre: true, status: null},
          {name: 'fod-uploader', version: cli['fod-uploader-version'], path: cli['fod-uploader-path'],
           envPrefix: 'FOD_UPLOADER', copyIfMatching: null, supportsJre: false, status: null},
          {name: 'debricked-cli', version: cli['debricked-cli-version'], path: cli['debricked-cli-path'],
           envPrefix: 'DEBRICKED', copyIfMatching: null, supportsJre: false, status: null},
          {name: 'bugtracker-utility', version: cli['bugtracker-utility-version'], path: cli['bugtracker-utility-path'],
           envPrefix: 'FBTU', copyIfMatching: null, supportsJre: false, status: null},
          {name: 'vuln-exporter', version: cli['vuln-exporter-version'], path: cli['vuln-exporter-path'],
           envPrefix: 'FVE', copyIfMatching: null, supportsJre: false, status: null}
        }}
  - log.debug: "Tools to process:"
  - log.debug: ${tools}
  
  # Check if any tools were explicitly requested via CLI options
  - var.set:
      anyToolsRequested: ${tools.?[version != null || path != null || copyIfMatching != null].size() > 0}
  - log.debug: "Any tools explicitly requested: ${anyToolsRequested}"

  # ===== PHASE 4: PROCESS EACH TOOL =====
  
  - records.for-each:
      from: ${tools}
      record.var-name: tool
      do:
        # Determine registration path source (priority: explicit path > env var > PATH)
        - var.set:
            tool.envVarName: "${tool.envPrefix}_HOME"
            tool.versionEnvVarName: "${tool.envPrefix}_VERSION"
            tool.envVarValue: ${#env(tool.envVarName)}
            tool.versionEnvVarValue: ${#env(tool.versionEnvVarName)}
            tool.registerPath: ${#ifBlank(tool.path,tool.envVarValue)}
            tool.isPreinstalled: ${#isNotBlank(tool.registerPath)}
            # Determine effective version:
            # - If explicit version/path/copyIfMatching specified via CLI: use specified version or 'auto'
            # - If no tools requested via CLI and env vars set: use env var version or 'auto'
            # - Otherwise: skip
            tool.effectiveVersion: |-
              ${
                #ifBlank(tool.version,
                  (tool.path != null || tool.copyIfMatching != null) ? 'auto' :
                  (!anyToolsRequested && (tool.isPreinstalled || tool.versionEnvVarValue != null)) ? (#ifBlank(tool.versionEnvVarValue, 'auto')) :
                  'skip'
                )
              }
        
        # Skip if effective version is 'skip'
        - if: ${tool.effectiveVersion == 'skip'}
          var.set:
            tool.status: skipped
        
        - if: ${tool.effectiveVersion != 'skip'}
          steps:
            # Fall back to PATH if neither explicit path nor env var is set
            - if: ${tool.registerPath == null}
              var.set:
                tool.registerPath: ${#env('PATH')}
            
            # Build and execute register command
            # For explicit path or env var: registration must succeed with version validation
            # For PATH search: registration failure is acceptable (will install later)
            - var.set:
                tool.registerCmd: "tool ${tool.name} register --path \"${tool.registerPath}\""
            
            # Add version constraint if specified and not auto/preinstalled mode
            - if: ${tool.effectiveVersion != 'auto' && tool.effectiveVersion != 'preinstalled'}
              var.set:
                tool.registerCmd: ${tool.registerCmd} --version ${tool.effectiveVersion}
            
            # Execute registration
            - run.fcli:
                REGISTER_TOOL:
                  cmd: ${tool.registerCmd}
                  stderr: collect
                  records.for-each:
                    record.var-name: register_result
                    do:
                      - var.set:
                          tool.status: registered
                          tool.installDir: ${register_result.installDir}
                          tool.binDir: ${register_result.binDir}
                          tool.actualVersion: ${register_result.version}
                  on.fail:
                    # Pre-installed tools (explicit path or env var) must register successfully
                    - if: ${tool.isPreinstalled == true && tool.version != null}
                      throw: "Tool ${tool.name} registration failed from ${tool.registerPath}.\nEnsure the tool is correctly installed and the version matches the requested version ${tool.version}."
                    - if: ${tool.isPreinstalled == true && tool.version == null}
                      throw: "Tool ${tool.name} registration failed from ${tool.registerPath}.\nEnsure the tool is correctly installed."
                    # In air-gapped mode, all tools must be found in PATH
                    - if: ${cli['air-gapped'] == true}
                      throw: "Tool ${tool.name} must be pre-installed (--air-gapped mode) but was not found in PATH"
                    # For PATH search, registration failure is acceptable - will install later
                    - log.progress: "Tool ${tool.name} not found in PATH, will proceed with installation"
            
            # Tool needs installation
            - if: ${tool.status == null}
              steps:
                # Resolve semantic version to actual version for proper tool cache directory naming
                # Skip for 'auto' which isn't a valid version spec in tool list
                - if: ${global.fortifySetup.toolCacheDirPattern != null && tool.effectiveVersion != 'auto'}
                  steps:
                    - run.fcli:
                        RESOLVE_VERSION:
                          cmd: tool ${tool.name} list -q "version=='${tool.effectiveVersion}' || aliases.contains('${tool.effectiveVersion}')"
                          records.for-each:
                            record.var-name: version_match
                            do:
                              - var.set:
                                  tool.resolvedVersion: ${version_match.version}
                          on.fail:
                            # If version resolution fails, we'll skip tool cache and use default install location
                            - log.debug: "Could not resolve version ${tool.effectiveVersion} for ${tool.name}, skipping tool cache"
                
                # Determine JRE for tools that support it (before build install command)
                - if: ${tool.supportsJre == true && cli['with-jre'] != 'no'}
                  steps:
                    - if: ${cli['with-jre'] == 'auto'}
                      steps:
                        - run.fcli:
                            GET_JRE_REQUIREMENT:
                              cmd: tool ${tool.name} get ${tool.effectiveVersion}
                              records.for-each:
                                record.var-name: version_info
                                do:
                                  - var.set:
                                      tool.requiredJre: ${version_info.extraProperties?.jre}
                        - if: ${tool.requiredJre != null}
                          steps:
                            - var.set:
                                tool.detectedJreHome: ${#env('SCANCENTRAL_JAVA_HOME')}
                            - if: ${tool.detectedJreHome == null}
                              var.set:
                                tool.detectedJreHome: ${global.fortifySetup['java'+tool.requiredJre+'Home']}
                            - if: ${tool.detectedJreHome == null}
                              var.set:
                                tool.detectedJreHome: ${#findJavaHome(tool.requiredJre)}
                
                # Build install command
                - var.set:
                    tool.installVersion: ${tool.effectiveVersion=='auto'?'latest':tool.effectiveVersion}
                    tool.installCmd: tool ${tool.name} install --version ${tool.installVersion}
                # If tool has explicit copyIfMatching path (e.g., fcli bootstrap with --self), use copy-from
                - if: ${tool.copyIfMatching != null}
                  var.set:
                    tool.installCmd: ${tool.installCmd} --copy-from "${tool.copyIfMatching}" --on-copy-version-mismatch skip
                - if: ${cli['base-dir'] != null}
                  var.set:
                    tool.installCmd: ${tool.installCmd} --base-dir "${cli['base-dir']}"
                # For tool cache: use resolvedVersion if available, otherwise fall back to default install location
                - if: ${global.fortifySetup.toolCacheDirPattern != null && tool.resolvedVersion != null}
                  var.set:
                    tool.cacheDir: ${global.fortifySetup.toolCacheDirPattern.replace('{tool}', tool.name).replace('{version}', tool.resolvedVersion)}
                    tool.installCmd: ${tool.installCmd} --install-dir "${tool.cacheDir}"
                
                # Add JRE options for tools that support it
                - if: ${tool.supportsJre == true}
                  steps:
                    - if: ${cli['with-jre'] == 'yes'}
                      var.set:
                        tool.installCmd: ${tool.installCmd} --with-jre
                    - if: ${cli['with-jre'] == 'auto' && tool.detectedJreHome != null}
                      var.set:
                        tool.installCmd: ${tool.installCmd} --jre "${tool.detectedJreHome}"
                    - if: ${cli['with-jre'] == 'auto' && tool.detectedJreHome == null}
                      var.set:
                        tool.installCmd: ${tool.installCmd} --with-jre
                
                # Execute installation
                - run.fcli:
                    INSTALL:
                      cmd: ${tool.installCmd}
                      records.for-each:
                        record.var-name: install_result
                        do:
                          - var.set:
                              tool.status: installed
                              tool.installDir: ${install_result.installDir}
                              tool.binDir: ${install_result.binDir}
                              tool.actualVersion: ${install_result.version}
                      on.fail:
                        - var.set:
                            tool.status: failed
  
  # ===== PHASE 5: GENERATE ENVIRONMENT OUTPUT =====
  
  # Select processed and failed tools from the tools array using SpEL collection selection
  # Note: Using projection (![#this.getRealNode()]) to unwrap the JSON node wrapper
  - var.set:
      global.fortify_setup.processed: ${tools.?[status != null && status != 'skipped' && status != 'failed'].![#this.getRealNode()]}
      global.fortify_setup.failed: ${tools.?[status == 'failed'].![#this.getRealNode()]}
  
  # ===== PHASE 5: SUMMARY =====
  
  - log.info: ""
  - log.info: "Fortify tools setup complete. ${global.fortify_setup.processed.size()} tool(s) processed."
  
  - records.for-each:
      from: ${global.fortify_setup.processed}
      record.var-name: tool
      do:
        - log.info: "  ✓ ${tool.name}: ${tool.actualVersion} (${tool.status}) at ${tool.binDir}"
        
  - if: ${global.fortify_setup.failed.size() > 0}
    log.info: ""
  - if: ${global.fortify_setup.failed.size() > 0}
    log.info: "ERROR: ${global.fortify_setup.failed.size()} tool(s) failed:"
  - if: ${global.fortify_setup.failed.size() > 0}
    records.for-each:
      from: ${global.fortify_setup.failed}
      record.var-name: tool
      do:
        - log.info: "  ✗ ${tool.name}: Installation failed"
  - if: ${global.fortify_setup.failed.size() > 0}
    throw: "Fortify tools setup failed. See errors above."
