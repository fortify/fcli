# FPR Module Messages

# Top-level command
fcli.fpr.usage.header = Commands for working with local FPR (Fortify Project Result) files.

# Issue commands
fcli.fpr.issue.usage.header = Commands for listing and analyzing issues from a local FPR file.
fcli.fpr.issue.list.usage.header = List all issues/vulnerabilities from an FPR file.
fcli.fpr.issue.get.usage.header = Get detailed information about a specific issue from an FPR file.
fcli.fpr.issue.count.usage.header = Count issues by category or analyzer from an FPR file.
fcli.fpr.issue.update.usage.header = Update an issue in an FPR file by setting its analysis tag, custom tags, or other audit attributes.

# Information commands
fcli.fpr.information.usage.header = Commands for retrieving information, signatures, and performing operations on FPR files.

# Summary command
fcli.fpr.information.show-summary.usage.header = Display project summary information from an FPR file (build info, engine version, LOC totals, machine info, rule packs).

# LOC command
fcli.fpr.information.list-source-files.usage.header = List source files and their lines-of-code counts from an FPR file.

# Errors command
fcli.fpr.information.list-errors.usage.header = List scan errors recorded during analysis from an FPR file.

# Signature command
fcli.fpr.information.show-signature.usage.header = Display FPR signature information including version, MAC, engine version, and build metadata.

# Merge command
fcli.fpr.information.merge.usage.header = Merge audit data from a source FPR into the primary project FPR. Primary audit data takes precedence for conflicts.

# Source archive commands
fcli.fpr.information.extract-source.usage.header = Extract the source archive from an FPR file to a local directory.
fcli.fpr.information.merge-source.usage.header = Merge a local source directory into an FPR file as a source archive.

# Trim command
fcli.fpr.information.trim.usage.header = Remove previous scan data from a merged FPR, keeping only the latest scan.

# Shared options
fcli.fpr.issue.list.fpr = Path to the local FPR file to read.
fcli.fpr.issue.get.fpr = Path to the local FPR file to read.
fcli.fpr.issue.get.instance-id = The instanceId of the issue to retrieve.
fcli.fpr.issue.get.embed = Comma-separated list of extra data to embed. Valid values: history.
fcli.fpr.issue.count.fpr = Path to the local FPR file to read.
fcli.fpr.issue.count.by = Group counts by 'category' (default) or 'analyzer'.
fcli.fpr.issue.update.fpr = Path to the local FPR file to update.
fcli.fpr.issue.update.instance-ids = Comma-separated list of one or more issue instanceIds to update.
fcli.fpr.issue.update.analysis = Optional analysis value to set. Valid values (case-insensitive): 'Not an Issue', 'Exploitable', 'Suspicious', 'Reliability Issue', 'False Positive', 'Bad Practice'.
fcli.fpr.issue.update.custom-tags = Comma-separated TAG=VALUE pairs for custom tags. TAG can be the tag name or its GUID; lookups are case-insensitive. Example: "--custom-tags 'Auditor Status=Reviewed,Severity=High'".
fcli.fpr.issue.update.comment = Optional comment to add to the issue audit trail.
fcli.fpr.issue.update.suppress = Suppress the issue in the FPR file.
fcli.fpr.issue.update.user = Username to record in the audit trail. Defaults to the current operating system user.
fcli.fpr.issue.update.assign-user = Assign the issue to the specified user. Stored as the assignedUser attribute on the Issue element. Pass an empty string to clear the assignment.

fcli.fpr.information.show-summary.fpr = Path to the local FPR file to read.
fcli.fpr.information.list-source-files.fpr = Path to the local FPR file to read.
fcli.fpr.information.list-errors.fpr = Path to the local FPR file to read.
fcli.fpr.information.show-signature.fpr = Path to the local FPR file to read.

fcli.fpr.information.merge.project = Path to the primary FPR file. Audit data from this file takes precedence in conflicts.
fcli.fpr.information.merge.source = Path to the secondary FPR file whose audit data will be merged in.
fcli.fpr.information.merge.output-file = Output FPR file path. Defaults to the primary project path if not specified.

fcli.fpr.information.extract-source.fpr = Path to the FPR file to extract the source archive from.
fcli.fpr.information.extract-source.output-dir = Directory to extract source files into.

fcli.fpr.information.merge-source.fpr = Path to the FPR file to merge the source archive into.
fcli.fpr.information.merge-source.source-dir = Directory containing source files to add to the FPR.
fcli.fpr.information.merge-source.output-file = Output FPR file path. Defaults to the input FPR path if not specified.

fcli.fpr.information.trim.fpr = Path to the FPR file to trim.
fcli.fpr.information.trim.output-file = Output FPR file path. Defaults to the input FPR path if not specified.

# Default output columns
fcli.fpr.issue.list.output.table.args = instanceId,category,priority,analyzerName,primaryFile,primaryLine,audited,suppressed
fcli.fpr.issue.get.output.table.args = instanceId,category,kingdom,type,subtype,analyzerName,priority,primaryFile,primaryLine,audited,suppressed,issueStatus,shortDescription
fcli.fpr.issue.count.output.table.args = group,total,audited,suppressed
fcli.fpr.issue.update.output.table.args = instanceId,analysis,customTags,comment,suppressed,assignedUser,user,__action__
fcli.fpr.information.show-summary.output.table.args = project,version,buildID,numberFiles,engineVersion
fcli.fpr.information.list-source-files.output.table.args = file,type,loc
fcli.fpr.information.list-errors.output.table.args = code,message
fcli.fpr.information.show-signature.output.table.args = fprVersion,signed,mac,engineVersion,buildID,hostname,platform
fcli.fpr.information.merge.output.table.args = project,source,output,mergedIssues,__action__
fcli.fpr.information.extract-source.output.table.args = outputDir,totalFiles,extractedFiles,__action__
fcli.fpr.information.merge-source.output.table.args = fpr,sourceDir,output,filesAdded,__action__
fcli.fpr.information.trim.output.table.args = fpr,output,removedEntries,__action__