# Make sure none of the commands inherit usage header or description of the top-level fcli command
# Note that we define these as usage.* whereas our parent bundle defines fcli.usage.* (with fcli prefix).
# For some reason, overriding fcli.usage.* doesn't work.
usage.header =
usage.description =

# Shared options
delim = Change the default delimiter character when using options that accept \
  "application:version" as an argument or parameter.
fcli.ssc.appversion.resolver.nameOrId = Application version id or <application>:<version> name.
aviator.admin-config.name.arggroup = Fortify Aviator administrator configuration name options%n

# fcli aviator
fcli.aviator.usage.header = Interact with Fortify Aviator.

# fcli aviator admin-config
fcli.aviator.admin-config.usage.header = Manage Fortify Aviator administrator configurations (start here).
fcli.aviator.admin-config.admin-config = Name of the Fortify Aviator administrator configuration to use. Default value: ${DEFAULT-VALUE}.
fcli.aviator.admin-config.create.usage.header = Create an administrator configuration for interacting with Fortify Aviator.
fcli.aviator.admin-config.create.usage.description = Stores the Fortify Aviator URL, tenant and RSA private key that are used by administrator commands like 'fcli aviator app' and 'fcli aviator token'. \
  Required options: --url, --tenant, --private-key. \
  %n%nExamples: \
  %n%n Create the default administrator configuration: \
  %n   fcli aviator admin-config create --url https://av.example.com \
  %n     --tenant MyTenant --private-key private.pem \
  %n%n Create a named configuration, reading the private key from an env var: \
  %n   fcli aviator admin-config create --admin-config prod \
  %n     --url https://av.example.com --tenant MyTenant \
  %n     --private-key env:AVIATOR_PRIVATE_KEY
fcli.aviator.admin-config.create.url = Fortify Aviator URL.
fcli.aviator.admin-config.create.tenant = Fortify Aviator tenant.
fcli.aviator.admin-config.create.private-key = RSA private key. Can be specified as one of:\
  \n   file:<local file containing key>\
  \n   string:<key string value>\
  \n   env:<env-var name containing key>\
  \n  If no prefix is given, <local file> is assumed.\
  \n  Key must be in PEM format.
fcli.aviator.admin-config.create.admin-config = Name for this Fortify Aviator administrator configuration. Default value: ${DEFAULT-VALUE}.
fcli.aviator.admin-config.delete.usage.header = Delete a Fortify Aviator administrator configuration.
fcli.aviator.admin-config.delete.usage.description = Deletes the specified administrator configuration; the default configuration is deleted if --admin-config isn't specified. \
  %n%nExamples: \
  %n%n Delete the default administrator configuration: \
  %n   fcli aviator admin-config delete \
  %n%n Delete a named administrator configuration: \
  %n   fcli aviator admin-config delete --admin-config prod
fcli.aviator.admin-config.delete.admin-config = Name of the Fortify Aviator administrator configuration to be deleted. Default value: ${DEFAULT-VALUE}.
fcli.aviator.admin-config.list.usage.header = List available Fortify Aviator administrator configurations.
fcli.aviator.admin-config.list.usage.description = Lists all stored administrator configurations. \
  %n%nExamples: \
  %n%n List all administrator configurations: \
  %n   fcli aviator admin-config list \
  %n%n List administrator configurations as JSON: \
  %n   fcli aviator admin-config list -o json

# fcli aviator session
fcli.aviator.session.usage.header = Manage Fortify Aviator user sessions (start here).
fcli.aviator.session.option.aviator-session = Name of the Fortify Aviator user session to use. Default value: ${DEFAULT-VALUE}.
fcli.aviator.session.login.usage.header = Create a user session for interacting with Fortify Aviator.
fcli.aviator.session.login.usage.description = Creates a Fortify Aviator user session that is used by commands like 'fcli aviator ssc audit-sast'. \
  Required options: --url, --token. \
  %n%nExamples: \
  %n%n Log in using a token stored in a file: \
  %n   fcli aviator session login --url https://av.example.com --token token.txt \
  %n%n Log in using a token stored in an environment variable: \
  %n   fcli aviator session login --url https://av.example.com \
  %n     --token env:AVIATOR_TOKEN \
  %n%n Log in using a named session: \
  %n   fcli aviator session login --av-session prod \
  %n     --url https://av.example.com --token env:AVIATOR_TOKEN
fcli.aviator.session.login.url = Fortify Aviator URL.
fcli.aviator.session.login.token = Fortify Aviator user access token. Can be specified as one of:\
  \n   file:<local file containing token>\
  \n   string:<token string value>\
  \n   env:<env-var name containing token>\
  \n  If no prefix is given, <local file> is assumed.\
  \n  For security reasons, avoid specifying sensitive tokens directly\
  \n  on the command line (using string:). Prefer using files or env:.
fcli.aviator.session.logout.usage.header = Terminate a Fortify Aviator user session.
fcli.aviator.session.logout.usage.description = Terminates the specified user session; the default session is terminated if --av-session isn't specified. \
  %n%nExamples: \
  %n%n Log out of the default session: \
  %n   fcli aviator session logout \
  %n%n Log out of a named session: \
  %n   fcli aviator session logout --av-session prod
fcli.aviator.session.list.usage.header = List active and expired Fortify Aviator user sessions.
fcli.aviator.session.list.usage.description = Lists all Fortify Aviator user sessions, including expired sessions. \
  %n%nExamples: \
  %n%n List all sessions: \
  %n   fcli aviator session list

# fcli aviator app
fcli.aviator.app.usage.header = Manage Fortify Aviator applications.
fcli.aviator.app.usage.description = Commands for managing Fortify Aviator applications. These commands require an administrator configuration. Use 'fcli aviator admin-config create' to create a configuration.

fcli.aviator.app.create.usage.header = Create a new Fortify Aviator application.
fcli.aviator.app.create.usage.description = Creates a new Fortify Aviator application within the tenant specified in the admin configuration. \
  Required parameter: the application name. \
  %n%nExamples: \
  %n%n Create an application: \
  %n   fcli aviator app create MyApp \
  %n%n Create an application using a named administrator configuration: \
  %n   fcli aviator app create MyApp --admin-config prod
fcli.aviator.app.create.name = Name of the application to create.

fcli.aviator.app.add-entitlement.usage.header = Add one entitlement to an existing Fortify Aviator application.
fcli.aviator.app.add-entitlement.usage.description = Increments an existing Fortify Aviator application's entitlement multiplier by one and returns the updated application details.
fcli.aviator.app.add-entitlement.applicationId = ID of the application to update.

fcli.aviator.app.delete.usage.header = Delete a Fortify Aviator application.
fcli.aviator.app.delete.usage.description = Deletes a Fortify Aviator application by its ID from the tenant specified in the admin configuration.
fcli.aviator.app.delete.applicationId = ID of the application to delete.

fcli.aviator.app.get.usage.header = Get a Fortify Aviator application.
fcli.aviator.app.get.usage.description = Retrieves details for a specific Fortify Aviator application by its ID.
fcli.aviator.app.get.applicationId = ID of the application to retrieve.

fcli.aviator.app.list.usage.header = List Fortify Aviator applications.
fcli.aviator.app.list.usage.description = Lists all Fortify Aviator applications for the tenant specified in the admin configuration. \
  %n%nExamples: \
  %n%n List all applications: \
  %n   fcli aviator app list \
  %n%n List applications as JSON: \
  %n   fcli aviator app list -o json

fcli.aviator.app.update.usage.header = Update a Fortify Aviator application.
fcli.aviator.app.update.usage.description = Updates an existing Fortify Aviator application, identified by its ID. Currently, this only supports renaming the application.
fcli.aviator.app.update.applicationId = ID of the application to update.
fcli.aviator.app.update.name = The new name for the application.

# fcli aviator connection
fcli.aviator.connection.usage.header = Diagnose Fortify Aviator connectivity.
fcli.aviator.connection.usage.description = Commands for diagnosing Fortify Aviator endpoint and credential connectivity.
fcli.aviator.connection.diagnose.usage.header = Run Fortify Aviator connectivity diagnostics.
fcli.aviator.connection.diagnose.usage.description = Runs ordered connectivity checks for Fortify Aviator endpoint configuration, DNS, TCP, optional HTTP proxy CONNECT (when a proxy is configured), TLS, gRPC reachability, and optional credential validation. Use --url with optional --token, or a saved --av-session / --admin-config. \
%n%nExamples: \
%n%n Diagnose connectivity to a Fortify Aviator URL: \
%n   fcli aviator connection diagnose --url https://av.example.com \
%n%n Diagnose connectivity and validate a user token: \
%n   fcli aviator connection diagnose --url https://av.example.com \
%n     --token env:AVIATOR_TOKEN \
%n%n Diagnose connectivity using an existing user session: \
%n   fcli aviator connection diagnose --av-session default \
%n%n Diagnose connectivity using an administrator configuration: \
%n   fcli aviator connection diagnose --admin-config default
aviator.connection.diagnose.source.arggroup = Fortify Aviator diagnostics source options%n
fcli.aviator.connection.diagnose.url = Fortify Aviator URL to diagnose. Optionally pair with --token to validate a user token without a saved session.
fcli.aviator.connection.diagnose.token = Fortify Aviator user access token. Can be specified as one of:\
  \n   file:<local file containing token>\
  \n   string:<token string value>\
  \n   env:<env-var name containing token>\
  \n  If no prefix is given, <local file> is assumed.\
  \n  The url: prefix is not supported for this option.\
  \n  For security reasons, avoid specifying sensitive tokens directly\
  \n  on the command line (using string:). Prefer using files or env:.
fcli.aviator.connection.diagnose.aviator-session = Name of the Fortify Aviator user session to diagnose and validate.
fcli.aviator.connection.diagnose.av-session = Name of the Fortify Aviator user session to diagnose and validate.
fcli.aviator.connection.diagnose.admin-config = Name of the Fortify Aviator administrator configuration to diagnose and validate.
fcli.aviator.connection.diagnose.timeout = Timeout in seconds for TCP, proxy CONNECT, TLS, and gRPC diagnostic stages. Default value: ${DEFAULT-VALUE}.

# fcli aviator token
fcli.aviator.token.usage.header = Manage Fortify Aviator access tokens.
fcli.aviator.token.usage.description = Commands for creating, deleting, revoking, listing, and validating Fortify Aviator access tokens. These commands require an administrator configuration.

fcli.aviator.token.create.usage.header = Create a user access token.
fcli.aviator.token.create.usage.description = Creates a new access token for a user within the tenant specified in the admin configuration. \
  Required option: --email. \
  %n%nExamples: \
  %n%n Create a token for a user, saving the token to a file: \
  %n   fcli aviator token create --email user@example.com --save-token token.txt \
  %n%n Create a named token with an explicit expiration date: \
  %n   fcli aviator token create --email user@example.com --name ci-token \
  %n     --end-date 2027-01-31 --save-token token.txt
fcli.aviator.token.create.email = User's email address for whom the token will be generated.
fcli.aviator.token.create.name = Optional custom name for the token.
fcli.aviator.token.create.end-date = Optional token expiration date in YYYY-MM-DD format. Defaults to one month from creation.
fcli.aviator.token.create.save-token = Save the generated raw token string to the specified file.

fcli.aviator.token.delete.usage.header = Delete a user access token.
fcli.aviator.token.delete.usage.description = Deletes a user's access token. Requires the token to be deleted. \
  Required option: --token. \
  %n%nExamples: \
  %n%n Delete a token stored in a file: \
  %n   fcli aviator token delete --token token.txt \
  %n%n Delete a token stored in an environment variable: \
  %n   fcli aviator token delete --token env:AVIATOR_TOKEN
fcli.aviator.token.delete.email = Deprecated option no longer used.

fcli.aviator.token.revoke.usage.header = Revoke a user access token.
fcli.aviator.token.revoke.usage.description = Revokes a user's access token, rendering it invalid. Requires the token to be revoked. \
  Required option: --token. \
  %n%nExamples: \
  %n%n Revoke a token stored in a file: \
  %n   fcli aviator token revoke --token token.txt \
  %n%n Revoke a token stored in an environment variable: \
  %n   fcli aviator token revoke --token env:AVIATOR_TOKEN
fcli.aviator.token.revoke.email = Deprecated option no longer used.

fcli.aviator.token.list.usage.header = List user access tokens.
fcli.aviator.token.list.usage.description = Retrieves a list of access tokens. Can be filtered by a user's email address. \
  %n%nExamples: \
  %n%n List all tokens: \
  %n   fcli aviator token list \
  %n%n List the tokens of a specific user: \
  %n   fcli aviator token list --email user@example.com
fcli.aviator.token.list.email = User's email address to  Filter the list for tokens associated with this email address (optional).

fcli.aviator.token.validate.usage.header = Validate a user access token.
fcli.aviator.token.validate.usage.description = Validates an access token, checking its authenticity and status against the Fortify Aviator service. \
  Required option: --token. \
  %n%nExamples: \
  %n%n Validate a token stored in a file: \
  %n   fcli aviator token validate --token token.txt \
  %n%n Validate a token stored in an environment variable: \
  %n   fcli aviator token validate --token env:AVIATOR_TOKEN

# fcli aviator entitlement
fcli.aviator.entitlement.usage.header = Manage Fortify Aviator entitlements.
fcli.aviator.entitlement.usage.description = Commands for managing Fortify Remediation Aviator and Fortify DAST Aviator entitlements. These commands require an administrator configuration.

fcli.aviator.entitlement.list.usage.header = (DEPRECATED) List Fortify Remediation Aviator entitlements for a tenant.
fcli.aviator.entitlement.list.usage.description = This command is deprecated, please use 'fcli aviator entitlement list-sast' instead. \
  Retrieves a list of Fortify Remediation Aviator entitlements for the tenant specified in the admin configuration.

fcli.aviator.entitlement.list-sast.usage.header = List Fortify Remediation Aviator entitlements for a tenant.
fcli.aviator.entitlement.list-sast.usage.description = Retrieves a list of Fortify Remediation Aviator entitlements for the tenant specified in the admin configuration. \
  %n%nExamples: \
  %n%n List all Fortify Remediation Aviator entitlements: \
  %n   fcli aviator entitlement list-sast

fcli.aviator.entitlement.list-dast.usage.header = List Fortify DAST Aviator entitlements for a tenant.
fcli.aviator.entitlement.list-dast.usage.description = Retrieves a list of Fortify DAST Aviator entitlements with credit balance details for the tenant specified in the admin configuration. \
  %n%nExamples: \
  %n%n List all Fortify DAST Aviator entitlements: \
  %n   fcli aviator entitlement list-dast

# fcli aviator ssc
fcli.aviator.ssc.usage.header = Use Fortify Remediation Aviator with SSC.
fcli.aviator.ssc.audit.usage.header = (DEPRECATED) Audit SAST findings in an SSC application version using Fortify Remediation Aviator.
fcli.aviator.ssc.audit.usage.description = This command is deprecated, please use 'fcli aviator ssc audit-sast' instead. \
  Downloads the FPR from an SSC application version, audits it with Fortify Remediation Aviator, and uploads the result back to SSC. \
  This command requires an active user session. Use 'fcli aviator session login' to create a session. \
  This command doesn't wait for SSC to finish processing the audited FPR file; please use the 'fcli ssc artifact wait-for' \
  command to wait until the audited FPR file has been processed by SSC.
fcli.aviator.ssc.audit-sast.usage.header = Audit SAST findings in an SSC application version using Fortify Remediation Aviator.
fcli.aviator.ssc.audit-sast.usage.description = Downloads the FPR from an SSC application version, audits it with Fortify Remediation Aviator, and uploads the result back to SSC. \
  This command requires an active user session. Use 'fcli aviator session login' to create a session. \
  This command doesn't wait for SSC to finish processing the audited FPR file; please use the 'fcli ssc artifact wait-for' \
  command to wait until the audited FPR file has been processed by SSC. \
  Required option: --av. \
  %n%nExamples: \
  %n%n Audit an application version: \
  %n   fcli aviator ssc audit-sast --av "MyApp:1.0" \
  %n%n Audit using a specific Fortify Aviator application: \
  %n   fcli aviator ssc audit-sast --av "MyApp:1.0" --app MyAviatorApp \
  %n%n Check whether the open issues exceed the available quota: \
  %n   fcli aviator ssc audit-sast --av "MyApp:1.0" --test-exceeding-quota \
  %n%n Skip the audit if the open issues exceed the available quota: \
  %n   fcli aviator ssc audit-sast --av "MyApp:1.0" --skip-if-exceeding-quota \
  %n%n Audit only issues in specific folders of a filter set: \
  %n   fcli aviator ssc audit-sast --av "MyApp:1.0" \
  %n     --fs "Security Auditor View" --folder Critical,High
fcli.aviator.ssc.audit.app =  Fortify Aviator application name to associate with the audit. If not provided, the SAST/FPR Build ID of the SSC application is used.
fcli.aviator.ssc.audit.tag-mapping = Custom tag mapping for audit results.
fcli.aviator.ssc.audit-dast.tag-mapping = Custom tag mapping for DAST audit results.
fcli.aviator.ssc.audit.filterset = Name or ID of the FilterSet to apply.
fcli.aviator.ssc.audit.no-filterset = Do not apply any filter sets, including the default enabled filter set from the FPR.
fcli.aviator.ssc.audit.folder = Filter issues by a comma-separated list of specific folder names from the selected FilterSet (e.g., 'Hot,Critical'). This option requires a FilterSet to be active.
fcli.aviator.ssc.audit.skip-if-exceeding-quota = Skip audit if the number of open issues exceeds the available Fortify Remediation Aviator quota. When skipped, a summary with top unaudited categories is shown.
fcli.aviator.ssc.audit.test-exceeding-quota = Check whether the number of open issues exceeds the available Fortify Remediation Aviator quota and report the result without performing an audit.
fcli.aviator.ssc.audit.default-quota-fallback = (Internal) When the Fortify Aviator application does not exist, use the tenant default quota instead of reporting app not found. Used by bulk audit.
fcli.aviator.ssc.audit.force-reaudit = Re-audit issues previously processed by Aviator, while preserving suppressed and manually triaged issues.
fcli.aviator.ssc.audit.folder-priority-order = Custom priority order for folder-based filtering when quota is exceeded (comma-separated, highest priority first). Example: Critical,High,Medium,Low. If not specified, uses default priority order.
fcli.aviator.source-encodings = Comma-separated source encoding candidates to try in order when decoding source files. Use FPR to try the source encoding recorded in audit.fvdl. When writing remediated files, the accepted encoding is used. Default value: ${DEFAULT-VALUE}.
fcli.aviator.ssc.audit.refresh = By default, this command will refresh the  source application version's metrics when copying from it. \
  Note that for large applications this can lead to an error if the timeout expires.
fcli.aviator.ssc.audit.refresh-timeout = Time-out, for example 30s (30 seconds), 5m (5 minutes), 1h (1 hour). Default value: ${DEFAULT-VALUE}

fcli.aviator.ssc.audit-sast.app = Fortify Aviator application name to associate with the audit. If not provided, the SAST/FPR Build ID of the SSC application is used.
fcli.aviator.ssc.audit-sast.tag-mapping = Custom tag mapping for audit results.
fcli.aviator.ssc.audit-sast.filterset = Name or ID of the FilterSet to apply.
fcli.aviator.ssc.audit-sast.no-filterset = Do not apply any filter sets, including the default enabled filter set from the FPR.
fcli.aviator.ssc.audit-sast.folder = Filter issues by a comma-separated list of specific folder names from the selected FilterSet (e.g., 'Hot,Critical'). This option requires a FilterSet to be active.
fcli.aviator.ssc.audit-sast.skip-if-exceeding-quota = Skip audit if the number of open issues exceeds the available Fortify Remediation Aviator quota. When skipped, a summary with top unaudited categories is shown.
fcli.aviator.ssc.audit-sast.test-exceeding-quota = Check whether the number of open issues exceeds the available Fortify Remediation Aviator quota and report the result without performing an audit.
fcli.aviator.ssc.audit-sast.default-quota-fallback = (Internal) When the Fortify Aviator application does not exist, use the tenant default quota instead of reporting app not found. Used by bulk audit.
fcli.aviator.ssc.audit-sast.force-reaudit = Re-audit issues previously processed by Aviator, while preserving suppressed and manually triaged issues.
fcli.aviator.ssc.audit-sast.folder-priority-order = Custom priority order for folder-based filtering when quota is exceeded (comma-separated, highest priority first). Example: Critical,High,Medium,Low. If not specified, uses default priority order.
fcli.aviator.ssc.audit-sast.refresh = By default, this command will refresh the source application version's metrics when copying from it. \
  Note that for large applications this can lead to an error if the timeout expires.
fcli.aviator.ssc.audit-sast.refresh-timeout = Time-out, for example 30s (30 seconds), 5m (5 minutes), 1h (1 hour). Default value: ${DEFAULT-VALUE}

fcli.ssc.appversion.create.refresh = Refresh out-of-date application version metrics before downloading the FPR. \
  Note that for large applications this can lead to an error if the timeout expires.
fcli.ssc.appversion.create.refresh-timeout = Time-out for refreshing application version metrics, for example 30s (30 seconds), \
  5m (5 minutes), 1h (1 hour). Default value: ${DEFAULT-VALUE}

fcli.aviator.ssc.audit-dast.usage.header = Audit DAST findings in an SSC application version using Fortify Aviator.
fcli.aviator.ssc.audit-dast.usage.description = Downloads the current application version FPR from SSC, audits eligible WebInspect findings, \
  writes decisions to audit.xml, and uploads the changed DAST FPR. This command requires an active Fortify Aviator user session. \
  Required option: --av. \
  %n%nExamples: \
  %n%n Audit the DAST findings of an application version: \
  %n   fcli aviator ssc audit-dast --av "MyApp:1.0" \
  %n%n Audit using a specific Fortify Aviator application: \
  %n   fcli aviator ssc audit-dast --av "MyApp:1.0" --app MyAviatorApp \
  %n%n Audit without refreshing application version metrics first: \
  %n   fcli aviator ssc audit-dast --av "MyApp:1.0" --no-refresh
fcli.aviator.ssc.audit-dast.app = Fortify Aviator application name to associate with the DAST audit. \
  If omitted, the SSC application name is used.

fcli.aviator.ssc.apply-remediations.usage.header = Apply auto-remediations from a Fortify Remediation Aviator-processed artifact to source code.
fcli.aviator.ssc.apply-remediations.usage.description = Downloads FPR artifact(s) from SSC, or reads a local remediations cache zip, and applies Fortify Remediation Aviator-generated remediations to the specified source directory. \
  Exactly one of --from-cache, --artifact-id, --latest, or --all must be specified. Online selection requires an active SSC session; --from-cache does not. \
  %n%nExamples: \
  %n%n Apply remediations from a remediations cache zip: \
  %n   fcli aviator ssc apply-remediations --from-cache ./remediations.zip \
  %n%n Apply selected issue IDs from a cache zip: \
  %n   fcli aviator ssc apply-remediations --from-cache ./remediations.zip \
  %n     --issue-ids id1,id2 \
  %n%n Apply remediations from a known artifact by ID: \
  %n   fcli aviator ssc apply-remediations --artifact-id 12345 \
  %n%n Apply remediations from the latest artifact of an application version: \
  %n   fcli aviator ssc apply-remediations --av "MyApp:1.0" --latest \
  %n%n Apply remediations from the latest artifact uploaded in the last 7 days: \
  %n   fcli aviator ssc apply-remediations --av "MyApp:1.0" --latest --since 7d \
  %n%n Apply remediations across all artifacts of an application version: \
  %n   fcli aviator ssc apply-remediations --av "MyApp:1.0" --all \
  %n%n Apply remediations across all artifacts uploaded in the last 2 weeks: \
  %n   fcli aviator ssc apply-remediations --av "MyApp:1.0" --all --since 2w \
  %n%n Apply remediations from the latest artifact to a custom source directory: \
  %n   fcli aviator ssc apply-remediations --av "MyApp:1.0" --latest \
  %n     --source-dir /path/to/src
fcli.aviator.ssc.apply-remediations.from-cache = Local remediations cache zip produced by download-remediations-cache. Mutually exclusive with online selection options. Does not require an SSC session.
fcli.aviator.ssc.apply-remediations.source-dir = Source code directory where remediations will be applied. Defaults to current directory.
fcli.aviator.ssc.apply-remediations.preview = Shows available remediations and their proposed changes without modifying source files. \
  Does not validate whether the proposed changes apply cleanly to the current source.
fcli.aviator.ssc.apply-remediations.issue-ids = Comma-separated list of issue IDs to apply. Matches requested values against remediations.xml \
  instanceId values. Requires --from-cache so integrations can download once via download-remediations-cache and apply selected remediations without repeated SSC downloads.
# Shared by download-remediations-cache and apply-remediations online selection (AviatorSSCRemediationsSelectorArgGroups).
fcli.aviator.ssc.remediations-cache.artifact-id = Specific artifact ID to process. Mutually exclusive with --latest and --all.
fcli.aviator.ssc.remediations-cache.latest = Select the most recent Fortify Remediation Aviator-processed artifact. Requires --av/--appversion. Mutually exclusive with --artifact-id and --all.
fcli.aviator.ssc.remediations-cache.all = Select all Fortify Remediation Aviator-processed artifacts for the given application version, newest upload first. Requires --av/--appversion. Mutually exclusive with --artifact-id and --latest.
fcli.aviator.ssc.remediations-cache.since = Filter artifacts by upload date. Supports relative durations (e.g. 7d, 2w, 1M, 90d) or absolute dates. Can only be used with --latest or --all.

fcli.aviator.ssc.download-remediations-cache.usage.header = Download a remediations cache zip containing Fortify Remediation Aviator audited FPR(s) from SSC.
fcli.aviator.ssc.download-remediations-cache.usage.description = Downloads audited FPR file(s) from SSC into a single remediations cache zip (manifest.json + ordered FPR entries) for use with apply-remediations --from-cache. \
  Exactly one of --artifact-id, --latest, or --all must be specified. Requires -f/--file. Overwriting an existing file requires confirmation (-y/--confirm). \
  %n%nExamples: \
  %n%n Download the latest artifact of an application version: \
  %n   fcli aviator ssc download-remediations-cache --av "MyApp:1.0" --latest \
  %n     -f remediations.zip \
  %n%n Download all artifacts uploaded in the last 2 weeks, overwriting the file: \
  %n   fcli aviator ssc download-remediations-cache --av "MyApp:1.0" --all \
  %n     --since 2w -f remediations.zip -y \
  %n%n Download a specific artifact by ID: \
  %n   fcli aviator ssc download-remediations-cache --artifact-id 12345 \
  %n     -f remediations.zip \
  %n%n Apply the downloaded cache to local source code: \
  %n   fcli aviator ssc apply-remediations --from-cache remediations.zip \
  %n     --source-dir /path/to/src
fcli.aviator.ssc.download-remediations-cache.file = Destination remediations cache zip path. Required. Existing files require confirmation (-y/--confirm) before overwrite.
fcli.aviator.ssc.download-remediations-cache.confirm = Confirm overwriting existing remediations cache file.
fcli.aviator.ssc.download-remediations-cache.confirmPrompt = Overwrite existing remediations cache file %s?

fcli.aviator.ssc.prepare.usage.header = (PREVIEW) Prepare an SSC instance for Fortify Remediation Aviator integration.
fcli.aviator.ssc.prepare.usage.description = This command ensures that the Fortify Remediation Aviator-specific custom tags ('Aviator prediction', 'Aviator status') \
  exist in SSC and are associated with the specified issue templates and/or application versions. \
  This is necessary to prevent SSC from stripping Fortify Remediation Aviator audit data from uploaded FPR files. \
  For SSC 26.2 and later, Aviator tags are built-in system-managed tags that can be enabled through \
  Administration -> Configuration -> AI Assistant -> Aviator. When enabled, the tags are automatically \
  associated with all issue templates and application versions, and this command will detect them and skip \
  manual association. For older SSC versions, the tags are created as custom tags and must be manually associated. \
  %n%nAt least one update option must be specified. \
  %n%nExamples: \
  %n%n Prepare a single application version: \
  %n   fcli aviator ssc prepare --av "MyApp:1.0" \
  %n%n Prepare a single issue template: \
  %n   fcli aviator ssc prepare --issue-template MyIssueTemplate \
  %n%n Prepare all issue templates and all application versions: \
  %n   fcli aviator ssc prepare --all-issue-templates --all-avs \
  %n%nNOTE\:  This command is considered preview functionality as it will likely change in a future fcli version \
  to re-use generic tag update functionality that is planned for the fcli ssc module.
fcli.aviator.ssc.prepare.issue-template = Update a single issue template by its name or ID.
fcli.aviator.ssc.prepare.all-issue-templates = Update all issue templates on the SSC instance.
fcli.aviator.ssc.prepare.appversion = Update a single application version by its ID or name (app:version).
fcli.aviator.ssc.prepare.all-appversions = Update all application versions on the SSC instance.

# fcli aviator ssc correlate-sast-dast
fcli.aviator.ssc.correlate-sast-dast.usage.header = Correlate SAST and DAST findings for an SSC application version.
fcli.aviator.ssc.correlate-sast-dast.usage.description = Downloads the latest SAST and DAST FPR artifacts from an SSC application version, \
  groups findings by category, streams mixed-category SAST findings to the Fortify Aviator server \
  for correlation via gRPC, injects correlation results into the DAST FPR as ExternalFindings, \
  and uploads it back to SSC. Required option: --av. \
  %n%nExamples: \
  %n%n Correlate the latest SAST and DAST results of an application version: \
  %n   fcli aviator ssc correlate-sast-dast --av "MyApp:1.0" \
  %n%n Correlate using a specific Fortify Aviator application: \
  %n   fcli aviator ssc correlate-sast-dast --av "MyApp:1.0" --app MyAviatorApp \
  %n%n Correlate without refreshing application version metrics first: \
  %n   fcli aviator ssc correlate-sast-dast --av "MyApp:1.0" --no-refresh
fcli.aviator.ssc.correlate-sast-dast.app = Fortify Aviator application name to associate with the correlation. If not provided, the SAST/FPR Build ID of the SSC application is used.

