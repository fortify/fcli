fcli.tool.sc-client.register.usage.description.1 = Registration approaches:\n\n\
  --path: Explicitly specify the path to the tool binary, bin directory, or installation directory.\n\n\
  --auto-detect: Automatically locate the tool using the following detection mechanism:\n\
  \  1. Check fcli status for previously registered installation\n\
  \  2. Check tool-specific environment variables:\n\
  \     - SCANCENTRAL_CMD or SCANCENTRAL_HOME\n\
  \     - SC_CLIENT_CMD or SC_CLIENT_HOME\n\
  \  3. Search PATH for the tool binary\n\n\
