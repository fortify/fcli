plugins {
    id "de.undercouch.download" version "5.6.0"
}
apply from: "${sharedGradleScriptsDir}/fcli-module.gradle"

ext.generatedToolDefinitionsDir = "${buildDir}/tool-definitions"
tasks.register('generateToolDefinitionResources') {
    group = 'build resources'
    description = 'Download tool-definitions archive and generate native-image resource-config'
    def toolDefinitionsSource = "https://github.com/fortify/tool-definitions/releases/download/v1/tool-definitions.yaml.zip"
    def toolDefinitionsFile = "tool-definitions.yaml.zip"
    def relDir = "com/fortify/cli/tool/config"
    def downloadOutputDir = layout.buildDirectory.dir("tool-definitions/${relDir}")
    def resourceConfigOutputDir = layout.buildDirectory.dir("tool-definitions/META-INF/native-image/tool-definitions")
    // Inputs: the URL (as property) & trigger updates when version changes
    inputs.property('toolDefinitionsSource', toolDefinitionsSource)
    // Outputs: downloaded zip and resource-config.json
    outputs.file(downloadOutputDir.map { it.file(toolDefinitionsFile) })
    outputs.file(resourceConfigOutputDir.map { it.file('resource-config.json') })
    doLast {
        def downloadDirFile = downloadOutputDir.get().asFile
        downloadDirFile.mkdirs()
        def resourceConfigDirFile = resourceConfigOutputDir.get().asFile
        resourceConfigDirFile.mkdirs()
        download.run {
            src toolDefinitionsSource
            dest new File(downloadDirFile, toolDefinitionsFile)
            onlyIfModified true
            useETag 'all'
        }
        def relFile = "${relDir}/${toolDefinitionsFile}"
        def resourceConfigContents = '{"resources":[{"pattern":"'+relFile+'"}]}'
        new File(resourceConfigDirFile, 'resource-config.json').text = resourceConfigContents
        println resourceConfigContents
    }
}
sourceSets.main.output.dir generatedToolDefinitionsDir, builtBy: generateToolDefinitionResources