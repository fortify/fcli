syntax = "proto3";

package com.fortify.aviator;

option java_multiple_files = true;
option java_package = "com.fortify.aviator.application";
option java_outer_classname = "ApplicationProto";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

message Application {
  int64 id = 1;
  string name = 2;
  int64 entitlement_id = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  bool is_deleted = 6;
  string legalTermsOfService=7;
  string quota_last_updated=8;
  int64 quota=9;
  int64 entitlement_multiplier = 10;
  int64 entitlements_consumed = 11;
  int64 effective_initial_quota = 12;
  int64 effective_monthly_quota = 13;
  repeated int64 active_entitlement_ids = 14;
  optional ApplicationMultiplierOutcome multiplier_outcome = 15;
  optional int64 operation_allocation_quota = 16;
  optional int64 previous_multiplier = 17;
  optional string operation_message = 18;
  // True when this response is the stored result of an earlier attempt with the same operation_id.
  optional bool operation_replayed = 19;
}

enum ApplicationMultiplierOutcome {
  MULTIPLIER_OUTCOME_UNSPECIFIED = 0;
  FRESH_ALLOCATION_CREATED = 1;
  INACTIVE_ALLOCATION_REACTIVATED = 2;
  MULTIPLIER_REDUCED = 3;
  // Retained for generated-client compatibility; capacity failures use non-OK RPC statuses.
  NO_CAPACITY = 4 [deprecated = true];
}

message ApplicationMultiplierOperationResponse {
  int64 application_id = 1;
  int64 previous_multiplier = 2;
  int64 new_multiplier = 3;
  int64 quota = 4;
  ApplicationMultiplierOutcome outcome = 5;
  string message = 6;
  Application application = 7;
  // True when this response is the stored result of an earlier attempt with the same operation_id.
  bool operation_replayed = 8;
}

// Mutating requests carry an operation_id (lowercase UUIDv7, generated once per logical operation and
// reused on every retry). When set, the signed `message` must end with
//   ;<fully qualified method>;<operation_id>;<timestamp>
// so that the signature binds the caller, tenant, method, payload and operation id. A retry must be
// re-signed with a fresh timestamp but keeps the same operation_id and payload.
// Clients that omit operation_id are served in compatibility mode (aviator.grpc.replay.mode=COMPATIBLE, the default)
// and are deduplicated by their exact signed message.
message CreateApplicationRequest {
  string name = 1;
  string tenantName = 2;
  string signature = 3;
  string message = 4;
  string operation_id = 5;
}

message UpdateApplicationRequest {
  int64 id = 1;
  string name = 2;
  string signature = 3;
  string message = 4;
  string tenantName = 5;
  string operation_id = 6;
}

// operation_id is honoured by AddEntitlement, ReduceEntitlement and DeleteApplication and ignored by reads.
message ApplicationById {
  int64 id = 1;
  string signature = 2;
  string message = 3;
  string tenantName = 4;
  string operation_id = 5;
}

message ApplicationByName {
  string name = 1;
  string signature = 2;
  string message = 3;
  string tenantName = 4;
}

message ApplicationByTenantName {
  string name = 1;
  string signature = 2;
  string message = 3;
}

message ValidateAdminSessionRequest {
  string tenantName = 1;
  string signature = 2;
  string message = 3;
}

message ApplicationList {
  repeated Application applications = 1;
}

message ApplicationResponseMessage {
  string responseMessage = 1;
  // True when this response is the stored result of an earlier attempt with the same operation_id.
  bool operation_replayed = 2;
}

// Public, unauthenticated, side-effect free. Old servers answer UNIMPLEMENTED, which clients treat as
// "replay protection not supported".
message ServerCapabilities {
  // 0 is never returned by a server that implements this RPC; protocol 1 = operation ids and method-bound signatures.
  int32 replay_protocol_version = 1;
  // True when the server rejects mutations that do not carry an operation_id.
  bool operation_id_required = 2;
  // Operation ids older than this are rejected as expired and are never executed.
  int64 operation_id_max_age_seconds = 3;
  // Maximum age of the signed timestamp; retries must be re-signed within this window.
  int64 message_max_age_seconds = 4;
}

message GetApplicationByTokenRequest {
  string token = 1;
  string app_name = 2;
}

message GetDefaultQuotaRequest {
  optional string token = 1;
  optional string tenant_name = 2;
  optional string signature = 3;
  optional string message = 4;
}

message GetDefaultQuotaResponse {
  int64 default_quota = 1;
}

// Allocation failures use non-OK gRPC statuses with google.rpc.ErrorInfo:
// domain "aviator.application", reason INVALID_ARGUMENT, NOT_FOUND,
// FAILED_PRECONDITION, or APPLICATION_BUSY. Reasons do not imply a safe retry.
//
// Replay and duplicate failures use google.rpc.ErrorInfo domain "aviator.operation" with reasons
// OPERATION_ID_REQUIRED, OPERATION_ID_INVALID, OPERATION_ID_EXPIRED, OPERATION_ID_REUSED,
// OPERATION_BINDING_MISMATCH, OPERATION_IN_PROGRESS (ABORTED, retry the same id) and
// OPERATION_ALREADY_COMPLETED.
service ApplicationService {
  rpc CreateApplication(CreateApplicationRequest) returns (Application) {}
  rpc GetApplication(ApplicationById) returns (Application) {}
  // Admin lookup by exact, case-sensitive name within the admin's tenant; NOT_FOUND when absent or deleted.
  rpc GetApplicationByName(ApplicationByName) returns (Application) {}
  rpc UpdateApplication(UpdateApplicationRequest) returns (Application) {}
  rpc AddEntitlement(ApplicationById) returns (Application) {}
  rpc ReduceEntitlement(ApplicationById) returns (ApplicationMultiplierOperationResponse) {}
  rpc DeleteApplication(ApplicationById) returns (ApplicationResponseMessage) {}
  rpc ValidateAdminSession(ValidateAdminSessionRequest) returns (google.protobuf.Empty) {}
  rpc ListApplications(ApplicationByTenantName) returns (ApplicationList) {}
  rpc ListApplicationsByEntitlement(ApplicationById) returns (ApplicationList) {}
  rpc GetApplicationByToken(GetApplicationByTokenRequest) returns (Application) {}
  rpc GetDefaultQuota(GetDefaultQuotaRequest) returns (GetDefaultQuotaResponse) {}
  rpc GetServerCapabilities(google.protobuf.Empty) returns (ServerCapabilities) {}
}