# yaml-language-server: $schema=https://fortify.github.io/fcli/schemas/action/fcli-action-schema-dev-2.x.json
author: Fortify
usage:
  header: Create a pull request from changed files
  description: |
    This action detects local file changes, creates a new branch, commits the changes,
    pushes to the remote, and raises a pull/merge request via the detected CI system's API.
    
    This action requires:
    - Git repository access (for branch/commit/push operations)
    - CI system token with PR/MR creation permissions (GITHUB_TOKEN, CI_JOB_TOKEN, etc.)
    
    Configuration via environment variables:
    - `SOURCE_DIR` — Source directory where changes are detected (default: CI workspace or current directory)
    - `PR_TITLE` — PR/MR title (default: "fix: Fortify auto-remediation fixes")
    - `PR_BODY` — PR/MR body (default: auto-generated description)
    - `PR_BRANCH_PREFIX` — Branch name prefix (default: "fcli/remediation")
    - `PR_COMMIT_MESSAGE` — Commit message (default: "fix: apply Fortify auto-remediation fixes")

config:
  output: immediate
  mcp: exclude

steps:
  - run.fcli:
      detect-env:
        group: detect-env
        cmd: fcli action run detect-env
        status.check: true

  - var.set:
      sourceDir: ${#env('SOURCE_DIR')?:global.ci.sourceDir?:'.'}
      baseBranch: "${#git.defaultBranch(#env('SOURCE_DIR')?:global.ci.sourceDir?:'.')?:global.ci.sourceBranch?:'main'}"

  # Check if there are changes to commit
  - var.set:
      hasChanges: ${#git.hasChanges(sourceDir)}

  - if: ${!hasChanges}
    do:
      - log.info: "No changes detected, skipping PR creation."
      - exit: 0

  - var.set:
      branchPrefix: ${#env('PR_BRANCH_PREFIX')?:'aviator/remediations'}
      commitMessage: "${#env('PR_COMMIT_MESSAGE')?:'fix: apply Fortify auto-remediation fixes'}"
      prTitle: "${#env('PR_TITLE')?:'fix: Fortify auto-remediation fixes'}"
      prBody: "${#env('PR_BODY')?:'This pull request contains auto-remediation fixes generated by Fortify SAST Aviator.'}"

  # Create a new branch for the changes
  - var.set:
      branchName: ${#git.createBranch(sourceDir, branchPrefix)}
  - log.info: "Created branch: ${branchName}"

  # Stage and commit changes
  - var.set:
      staged: ${#git.addAll(sourceDir)}
      commitSha: "${#git.commit(sourceDir, commitMessage)}"
  - log.info: "Committed changes: ${commitSha}"

  # Push branch to remote
  - var.set:
      pushedRef: ${#git.push(sourceDir)}
  - log.info: "Pushed branch to remote: ${pushedRef}"

  # Create PR/MR based on detected CI system
  - var.set:
      ci.detected: ${#_ci.detect()}
      ci.type: ${ci.detected.type}

  # GitHub PR creation
  - if: ${ci.type=='github'}
    do:
      - var.set:
          pr: ${#_ci.detect().repo().createPullRequest(prTitle, branchName, baseBranch, prBody)}
      - log.info: "Created GitHub Pull Request #${pr.number}: ${pr.html_url}"

  # GitLab MR creation
  - if: ${ci.type=='gitlab'}
    do:
      - var.set:
          mr: ${#_ci.detect().project().createMergeRequest(prTitle, branchName, baseBranch, prBody)}
      - log.info: "Created GitLab Merge Request !${mr.iid}: ${mr.web_url}"

  # Unknown CI system - log warning
  - if: ${ci.type!='github' && ci.type!='gitlab'}
    log.warn: "PR/MR creation not supported for CI system '${ci.type}'. Branch '${branchName}' has been pushed; please create a PR/MR manually."
